<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holy Doughnut Studio splash · demo</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff6e8; color: #2b2d42;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #5b5670; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
  button { font: 600 14px system-ui, sans-serif; padding: 10px 16px; border-radius: 10px; border: 2px solid #2b2d42;
    background: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid #e0457b; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Holy Doughnut Studio splash</h1>
  <p>This page is what sits "under" the splash. Tap or press a key to skip it.</p>
  <div class="row">
    <button data-theme="light">Play · light</button>
    <button data-theme="cyan">cyan</button>
    <button data-theme="purple">purple</button>
    <button data-theme="dark">dark</button>
  </div>
  <p id="status"></p>
</main>
<script src="hds-splash.js"></script>
<script>
  const status = document.getElementById('status');
  const play = theme => {
    status.textContent = 'Playing…';
    HDSSplash.show({ theme }).then(shown => { status.textContent = shown ? 'Done.' : 'Turned off (?nosplash or hds-nosplash).'; });
  };
  document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => play(b.dataset.theme)));
  play('light');
</script>
</body>
</html>
