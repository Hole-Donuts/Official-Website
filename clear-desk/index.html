<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1318">
<meta name="description" content="Clear Desk 17.00: a clear desk & clear screen SOP game (ISO/IEC 27001 A.7.7) by Ihsan Mahendra · Holy Doughnut Studio. English and Bahasa Indonesia.">
<meta name="author" content="Ihsan Mahendra">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Clear Desk 17.00</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one-screen first-person desk. HUD on top, the desk scene fills the middle,
   an inspector strip and four physical destinations sit under it like the reach of your hands. */
:root {
  color-scheme: dark;
  --ink: #0e1318;          /* HUD + page ground */
  --panel: #161d25;
  --line: #2a3542;
  --text: #edf1f5;
  --muted: #94a2b1;
  --lamp: #f3b23e;         /* accent: desk-lamp amber */
  --lamp-ink: #1d1406;
  --ok: #3cc47c;
  --bad: #ef5a52;
  --t-rahasia: #d43c35;
  --t-internal: #d6951b;
  --t-publik: #2f9a5c;
  --t-pribadi: #3f74cf;
  --t-none: #6b7785;
  --wall: #2b3542;
  --wall-2: #232c37;
  --wood-1: #9a6440;
  --wood-2: #7a4a2c;
  --wood-3: #5a3520;
  --paper: #f6f3ec;
  --paper-ink: #2a2f36;
  --f-display: "Familjen Grotesk", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-hand: "Caveat", "Comic Sans MS", cursive;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--text);
  font-family: var(--f-body); font-size: 14px; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

#app {
  height: 100%; display: grid;
  grid-template-rows: auto 1fr auto auto;
  max-width: 1400px; margin: 0 auto;
}

/* ---------- HUD ---------- */
.hud {
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.hud .doc-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 180px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scen-name { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.1; text-wrap: balance; }
.stat { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.stat b { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 600; line-height: 1; }
#timer.warn { color: var(--bad); }
.pips { display: flex; gap: 5px; height: 20px; align-items: center; }
.pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); }
.pip.on { background: var(--bad); border-color: var(--bad); }
.btn {
  border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer;
  font-weight: 600; background: var(--lamp); color: var(--lamp-ink);
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

/* ---------- Scene ---------- */
.scene { position: relative; overflow: hidden; container-type: size; min-height: 0; }
.wall {
  position: absolute; inset: 0 0 auto 0; height: 52%;
  background: linear-gradient(180deg, var(--wall-2), var(--wall));
}
.window {
  position: absolute; right: 6cqw; top: 11cqh; width: min(22cqw, 40cqh); height: 30cqh;
  border: 6px solid #3b4757; border-radius: 3px;
  background: linear-gradient(180deg, #4b5d8a 0%, #c9748a 55%, #f2b36b 100%);
  box-shadow: inset 0 0 0 2px #1d242d;
}
.window::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; background: #3b4757; transform: translateX(-50%); }
.window::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
  background: repeating-linear-gradient(90deg, #26303e 0 9%, #313d4e 9% 14%, #1e2733 14% 22%); clip-path: polygon(0 40%, 9% 40%, 9% 10%, 22% 10%, 22% 55%, 34% 55%, 34% 25%, 46% 25%, 46% 60%, 60% 60%, 60% 0, 72% 0, 72% 45%, 86% 45%, 86% 30%, 100% 30%, 100% 100%, 0 100%); }
.scene.day .window { background: linear-gradient(180deg, #7fb2e6 0%, #b9d8f2 100%); }
.scene.night .window { background: linear-gradient(180deg, #0b1226 0%, #1b2440 100%); }
.scene.night .window::after { background: repeating-linear-gradient(90deg, #121a29 0 9%, #1a2335 9% 14%, #0f1522 14% 22%); }
.scene.night .wall { background: linear-gradient(180deg, #161c25, #1d2530); }

.poster {
  position: absolute; left: 5cqw; top: 6cqh; width: min(19cqw, 30cqh);
  background: var(--paper); color: var(--paper-ink); border: 0; border-radius: 2px;
  padding: 1.6cqh 1.4cqh; text-align: left; cursor: pointer;
  box-shadow: 0 6px 14px rgba(0,0,0,.35); transform: rotate(-2deg);
  display: flex; flex-direction: column; gap: .8cqh;
}
.poster::before { content: ""; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--t-rahasia); transform: translateX(-50%); box-shadow: 0 2px 2px rgba(0,0,0,.4); }
.poster .p-k { font-family: var(--f-mono); font-size: clamp(7px, 1.7cqh, 11px); letter-spacing: .08em; color: #5d6772; }
.poster .p-t { font-family: var(--f-display); font-weight: 700; font-size: clamp(10px, 3.2cqh, 20px); line-height: 1; }
.poster .p-r { height: 4px; background: repeating-linear-gradient(90deg, #c4c9cf 0 70%, transparent 70% 100%); }
.poster .p-h { font-size: clamp(7px, 1.6cqh, 11px); color: #5d6772; }
.poster:hover { transform: rotate(-2deg) translateY(-2px); }

.wallclock {
  position: absolute; right: 6cqw; top: 2.5cqh;
  font-family: var(--f-mono); font-weight: 600; font-size: clamp(11px, 3cqh, 18px);
  padding: 2px 10px; border-radius: 4px; background: #0b0f14; color: #ff6b5c;
  border: 1px solid #39434f; font-variant-numeric: tabular-nums; letter-spacing: .06em;
}

.lampglow { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 55% 45% at 18% 62%, rgba(243,178,62,.16), transparent 70%); }
.scene.night .lampglow { background: radial-gradient(ellipse 60% 50% at 18% 64%, rgba(243,178,62,.26), transparent 70%), linear-gradient(rgba(5,8,14,.25), rgba(5,8,14,.25)); }

/* desk plane in first-person perspective */
.deskwrap { position: absolute; left: 0; right: 0; top: 44%; bottom: 0; perspective: 900px; perspective-origin: 50% -40%; }
.desk {
  position: absolute; left: -12%; right: -12%; top: -6%; bottom: 0;
  transform-origin: 50% 100%; transform: rotateX(38deg);
  --u: min(8.5cqw, 13.5cqh);
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.05) 0 2px, transparent 2px 11px, rgba(255,255,255,.035) 11px 13px, transparent 13px 29px),
    linear-gradient(180deg, var(--wood-2), var(--wood-1));
  box-shadow: inset 0 -14px 0 var(--wood-3), inset 0 10px 24px rgba(0,0,0,.35);
}
.keyboard {
  position: absolute; left: 50%; top: 9%; width: calc(var(--u) * 2.6); height: calc(var(--u) * .8);
  transform: translateX(-50%); border-radius: 5px; background-color: #2c3138;
  box-shadow: 0 3px 0 #1b1f24, inset 0 0 0 4px #2c3138;
  background-image: repeating-linear-gradient(90deg, transparent 0 6.5%, #2c3138 6.5% 7.5%), repeating-linear-gradient(0deg, #4a525c 0 21%, #2c3138 21% 25%);
}

.item {
  position: absolute; border: 0; padding: 0; background: none; cursor: grab;
  transform: translate(-50%, -50%) rotate(var(--r, 0deg));
  touch-action: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35));
  transition: transform .18s ease, opacity .25s ease, filter .18s;
  font-size: calc(var(--u) * .11);
}
.item { z-index: 2; }
.item.k-doc, .item.k-folder, .item.k-brochure, .item.k-laptop { z-index: 1; }
.item.sel { z-index: 3; }
.item:hover { filter: drop-shadow(0 6px 4px rgba(0,0,0,.4)) brightness(1.06); }
.item.sel { filter: drop-shadow(0 0 0 var(--lamp)) drop-shadow(0 0 6px var(--lamp)) drop-shadow(0 0 2px var(--lamp)); }
.item.dragging { opacity: .25; }
.item.gone { opacity: 0; transform: translate(-50%, 20%) rotate(var(--r)) scale(.4); pointer-events: none; }
.item.shake { animation: shake .4s; }
.item.arrive { animation: arrive .6s ease-out; }
@keyframes shake { 0%,100% { margin-left: 0 } 20% { margin-left: -6px } 40% { margin-left: 6px } 60% { margin-left: -4px } 80% { margin-left: 4px } }
@keyframes arrive { from { opacity: 0; margin-top: -40px } to { opacity: 1; margin-top: 0 } }
.item svg { display: block; width: 100%; height: 100%; }

.k-doc { width: var(--u); height: calc(var(--u) * 1.3); }
.k-folder { width: calc(var(--u) * 1.15); height: calc(var(--u) * 1.3); }
.k-brochure { width: calc(var(--u) * .95); height: calc(var(--u) * 1.2); }
.k-receipt { width: calc(var(--u) * .55); height: calc(var(--u) * 1.15); }
.k-sticky { width: calc(var(--u) * .66); height: calc(var(--u) * .66); }
.k-usb { width: calc(var(--u) * .72); height: calc(var(--u) * .27); }
.k-hdd { width: calc(var(--u) * .62); height: calc(var(--u) * .85); }
.k-card { width: calc(var(--u) * .55); height: calc(var(--u) * 1.05); }
.k-key { width: calc(var(--u) * .7); height: calc(var(--u) * .28); }
.k-phone { width: calc(var(--u) * .48); height: calc(var(--u) * .95); }
.k-wallet { width: calc(var(--u) * .85); height: calc(var(--u) * .6); }
.k-laptop { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.05); }
.k-cup { width: calc(var(--u) * .62); height: calc(var(--u) * .62); }
.k-wrapper { width: calc(var(--u) * .8); height: calc(var(--u) * .66); }

.paper, .receipt, .broch {
  width: 100%; height: 100%; background: var(--paper); color: var(--paper-ink);
  position: relative; overflow: hidden; text-align: left; padding: 9% 9%;
  display: flex; flex-direction: column; gap: 6%;
}
.phead { height: 7%; min-height: 3px; }
.ptitle { font-family: var(--f-display); font-weight: 700; font-size: 1.1em; line-height: 1.05; }
.plines { flex: 1; background: repeating-linear-gradient(180deg, #c9cdd3 0 1px, transparent 1px 9%); }
.stamp {
  position: absolute; left: 50%; top: 62%; transform: translate(-50%, -50%) rotate(-18deg);
  border: 2px solid var(--t-rahasia); color: var(--t-rahasia); font-family: var(--f-mono); font-weight: 600;
  font-size: .95em; padding: 1px 4px; letter-spacing: .06em; background: rgba(246,243,236,.6);
}
.receipt { clip-path: polygon(0 0, 100% 0, 100% 96%, 90% 100%, 80% 96%, 70% 100%, 60% 96%, 50% 100%, 40% 96%, 30% 100%, 20% 96%, 10% 100%, 0 96%); font-size: .85em; }
.broch .bimg { height: 45%; background: linear-gradient(135deg, #2f9a5c, #4ec3b0 60%, #f3d36b); }
.folder { width: 100%; height: 100%; position: relative; }
.folder .ftab { position: absolute; left: 6%; top: 0; width: 38%; height: 10%; background: #d9b467; border-radius: 4px 4px 0 0; }
.folder .fbody { position: absolute; inset: 8% 0 0 0; background: #e7c47a; border-radius: 2px 3px 3px 3px; padding: 12% 10%; color: #4a3612; text-align: left; overflow: hidden; }
.folder .flabel { background: var(--paper); padding: 4% 6%; font-family: var(--f-display); font-weight: 700; font-size: 1.05em; line-height: 1.05; }
.folder .stamp { top: 70%; background: rgba(231,196,122,.6); }
.sticky { width: 100%; height: 100%; background: #f7e36b; color: #2b2a6e; font-family: var(--f-hand); font-size: 1.55em; line-height: 1; padding: 10%; text-align: left; overflow: hidden; }
.sticky.alt { background: #f9b6c8; }

/* monitor stands on the back of the desk, facing you */
.monitor {
  position: absolute; left: 50%; bottom: 47%; transform: translateX(-50%);
  width: min(36cqw, 56cqh); border: 0; background: none; padding: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
}
.bezel { display: block; width: 100%; aspect-ratio: 16 / 10; background: #15191e; border-radius: 6px; padding: 3.5%; box-shadow: 0 10px 24px rgba(0,0,0,.45); position: relative; }
.monitor:hover .bezel { box-shadow: 0 0 0 2px var(--lamp), 0 10px 24px rgba(0,0,0,.45); }
.screen { display: block; width: 100%; height: 100%; text-align: left; border-radius: 2px; overflow: hidden; position: relative; font-family: var(--f-mono); }
.neck { display: block; width: 10%; height: 9cqh; max-height: 40px; background: linear-gradient(90deg, #22272e, #3a414b, #22272e); }
.base { display: block; width: 34%; height: 1.6cqh; min-height: 6px; background: #2a3038; border-radius: 6px 6px 2px 2px; }
.led { position: absolute; right: 5%; bottom: 1.3%; width: 5px; height: 5px; border-radius: 50%; background: #39d27a; }
.screen.off + .led, .monitor.is-off .led { background: #e59a2e; }
.monitor-hint { position: absolute; left: 50%; top: -1.8em; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-family: var(--f-mono); color: var(--lamp); letter-spacing: .04em; }

.scr-on { position: absolute; inset: 0; background: #f4f6f8; display: flex; flex-direction: column; font-size: clamp(5px, 1.5cqh, 10px); color: #24303c; }
.scr-on .bar { background: #1f7a4a; color: #fff; padding: 2% 3%; display: flex; justify-content: space-between; }
.scr-on .grid { flex: 1; background:
  repeating-linear-gradient(90deg, transparent 0 calc(20% - 1px), #d3d9df calc(20% - 1px) 20%),
  repeating-linear-gradient(180deg, transparent 0 calc(10% - 1px), #d3d9df calc(10% - 1px) 10%); position: relative; }
.scr-on .grid i { position: absolute; left: 0; right: 0; height: 10%; background: rgba(31,122,74,.12); }
.scr-on .rows { position: absolute; inset: 0; display: grid; grid-template-rows: repeat(10, 1fr); padding-left: 2%; }
.scr-on .rows span { display: block; white-space: nowrap; overflow: hidden; align-self: center; }
.scr-lock { position: absolute; inset: 0; background: linear-gradient(160deg, #1f3a5f, #0e1c2f); color: #e9eef5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%; font-size: clamp(6px, 1.8cqh, 12px); }
.scr-lock .big { font-family: var(--f-display); font-size: 2.6em; font-weight: 700; line-height: 1; }
.scr-lock .av { width: 14%; aspect-ratio: 1; border-radius: 50%; background: #9fb3c8; }
.scr-off { position: absolute; inset: 0; background: linear-gradient(135deg, #07090c 0 60%, #11161c 60% 62%, #07090c 62%); }

.plant { position: absolute; right: 2cqw; bottom: 47%; width: min(7cqw, 12cqh); aspect-ratio: 1 / 1.4; pointer-events: none; }

/* ---------- Inspector ---------- */
.inspector {
  display: flex; align-items: center; gap: 10px 16px; min-height: 66px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
}
.inspector .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.inspector .t { font-weight: 600; font-size: 15px; }
.inspector .d { color: var(--muted); font-size: 13px; line-height: 1.35; }
.inspector .empty { color: var(--muted); }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; padding: 3px 7px; border-radius: 3px; color: #fff; font-weight: 600; white-space: nowrap; }
.chip.RAHASIA { background: var(--t-rahasia); }
.chip.INTERNAL { background: var(--t-internal); color: #1d1406; }
.chip.PUBLIK { background: var(--t-publik); }
.chip.PRIBADI { background: var(--t-pribadi); }
.chip.NONE { background: var(--t-none); }
.keys { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ---------- Destinations ---------- */
.zones {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel);
}
.zone { position: relative; min-width: 0; }
.zbtn {
  width: 100%; height: 100%; display: flex; align-items: center; gap: 10px;
  background: #1c252f; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; cursor: pointer; text-align: left;
  transition: border-color .15s, background .15s, transform .15s;
}
.zbtn svg { width: 46px; height: 32px; flex: none; }
.zbtn .zl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.zbtn .zn { font-weight: 600; font-size: 13.5px; line-height: 1.15; }
.zbtn .zc { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.zbtn .zk { font-family: var(--f-mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: auto; align-self: flex-start; }
.zones.ready .zbtn { border-color: #4a5a6c; }
.zbtn:hover, .zbtn.hot { border-color: var(--lamp); background: #262f3a; }
.zbtn.pulse-ok { animation: pok .5s; }
.zbtn.pulse-bad { animation: pbad .5s; }
@keyframes pok { 50% { background: rgba(60,196,124,.25); border-color: var(--ok); } }
@keyframes pbad { 50% { background: rgba(239,90,82,.25); border-color: var(--bad); } }
.lockbtn {
  position: absolute; right: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px;
  font-family: var(--f-mono); font-size: 10.5px; padding: 3px 7px; border-radius: 4px; cursor: pointer;
  background: #2a3442; border: 1px solid #3b4859; color: var(--text);
}
.lockbtn svg { width: 11px; height: 13px; }
.lockbtn.locked { background: var(--ok); border-color: var(--ok); color: #06210f; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px);
  width: min(560px, calc(100% - 32px)); background: #0b1015; border: 1px solid var(--line);
  border-left: 4px solid var(--muted); border-radius: 8px; padding: 10px 14px; z-index: 40;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  display: flex; flex-direction: column; gap: 3px; box-shadow: 0 12px 30px rgba(0,0,0,.5);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.ok { border-left-color: var(--ok); }
.toast.bad { border-left-color: var(--bad); }
.toast.info { border-left-color: var(--lamp); }
.toast .tt { font-weight: 600; }
.toast .tx { color: #c9d2db; font-size: 13px; line-height: 1.4; }
.toast .tc { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* ---------- Ghost (drag) ---------- */
.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; transform: translate(-50%, -50%) rotate(var(--r)) scale(1.15); filter: drop-shadow(0 12px 10px rgba(0,0,0,.5)); }

/* ---------- Overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: rgba(6,9,13,.55); overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: min(600px, 100%); max-height: 100%; overflow-y: auto; margin: auto;
  background: var(--paper); color: var(--paper-ink); border-radius: 6px;
  box-shadow: 0 24px 60px rgba(0,0,0,.55); position: relative;
}
.clip { position: absolute; top: -10px; left: 50%; width: 96px; height: 22px; transform: translateX(-50%); background: #9aa3ad; border-radius: 4px 4px 8px 8px; box-shadow: inset 0 -3px 0 #6f7882; }
.card-in { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 16px; }
.docmeta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: #66707b; text-transform: uppercase; border-bottom: 1px solid #d8d4ca; padding-bottom: 10px; }
.card h1, .card h2 { font-family: var(--f-display); font-weight: 700; margin: 0; line-height: 1.05; text-wrap: balance; }
.card h1 { font-size: 30px; }
.card h2 { font-size: 16px; }
.situ { background: #1c252f; color: var(--text); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.situ .eyebrow { color: var(--lamp); }
.situ p { margin: 0; color: #c9d2db; line-height: 1.45; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; line-height: 1.45; font-size: 14px; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--f-mono); font-weight: 600; font-size: 12px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--paper-ink); display: grid; place-items: center; }
.steps b { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rule { border: 1px solid #d8d4ca; border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.rule .eyebrow { color: #66707b; font-size: 10px; }
.rule b { font-family: var(--f-mono); font-size: 16px; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.card .hint { font-size: 12.5px; color: #66707b; }
.card .btn.ghost { color: var(--paper-ink); border-color: #c9c4b8; }

.verdict { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.vstamp { font-family: var(--f-mono); font-weight: 600; font-size: 20px; letter-spacing: .08em; padding: 6px 12px; border: 3px solid currentColor; transform: rotate(-4deg); border-radius: 4px; }
.vstamp.pass { color: #1f8a4f; }
.vstamp.fail { color: var(--t-rahasia); }
.vtext { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
.vtext p { margin: 0; color: #4a535d; line-height: 1.45; }
.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.findings li { border-left: 4px solid; padding: 6px 10px; background: #efebe2; border-radius: 0 4px 4px 0; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; line-height: 1.4; }
.findings li.major { border-color: var(--t-rahasia); }
.findings li.minor { border-color: var(--t-internal); }
.findings .fh { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.findings .fc { font-family: var(--f-mono); font-size: 11px; color: #66707b; }
.findings .none { border-color: #1f8a4f; }

.menu {
  position: fixed; z-index: 35; background: #0b1015; border: 1px solid var(--line); border-radius: 8px;
  padding: 6px; display: flex; flex-direction: column; gap: 4px; width: 230px; box-shadow: 0 16px 40px rgba(0,0,0,.55);
}
.menu button { text-align: left; background: transparent; border: 0; border-radius: 5px; padding: 9px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.menu button:hover, .menu button:focus-visible { background: #1f2933; }
.menu small { color: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }

@media (max-width: 640px) {
  .hud { gap: 8px 14px; }
  .scen-name { font-size: 15px; }
  .doc-id .eyebrow { display: none; }
  .stat b { font-size: 17px; }
  .zones { gap: 6px; }
  .zbtn { flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px; }
  .zbtn svg { width: 36px; height: 25px; }
  .zbtn .zn { font-size: 12px; }
  .zbtn .zk, .keys { display: none; }
  .lockbtn { right: 4px; bottom: auto; top: 4px; font-size: 9.5px; padding: 2px 5px; }
  .card-in { padding: 22px 18px 18px; }
  .card h1 { font-size: 24px; }
  .rules { grid-template-columns: 1fr 1fr 1fr; }
  .rule b { font-size: 14px; }
  .monitor-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.langbtn { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 0; overflow: hidden; background: transparent; cursor: pointer; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; }
.langbtn span { padding: 6px 8px; color: var(--muted); }
.langbtn span.on { background: var(--text); color: var(--ink); }

.titlerow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

};
const LOCK_SVG = locked => locked
  ? '<svg viewBox="0 0 11 13"><rect x="1" y="5" width="9" height="8" rx="1.5" fill="currentColor"/><path d="M3 5 V3.5 a2.5 2.5 0 0 1 5 0 V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
  : '<svg viewBox="0 0 11 13"><rect x="1" y="5" width="9" height="8" rx="1.5" fill="currentColor"/><path d="M3 5 V3.5 a2.5 2.5 0 0 1 5 0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';

const desk = $('#desk'), scene = $('#scene');
let S = null, lastScenId = null, tick = null, toastT = null;

function tagKey(t) { return t || 'NONE'; }
function tagLabel(t, l = LANG) { return tr(TAG[tagKey(t)], l); }

function itemInner(it) {
  const stamp = it.tag === 'RAHASIA' ? `<span class="stamp">${tagLabel('RAHASIA')}</span>` : '';
  const short = tr(it.short);
  switch (it.kind) {
    case 'doc': return `<span class="paper"><span class="phead" style="background:var(--t-${tagKey(it.tag).toLowerCase()})"></span><span class="ptitle">${short}</span><span class="plines"></span>${stamp}</span>`;
    case 'folder': return `<span class="folder"><span class="ftab"></span><span class="fbody"><span class="flabel">${short}</span>${stamp}</span></span>`;
    case 'brochure': return `<span class="broch"><span class="bimg"></span><span class="ptitle">${short}</span></span>`;
    case 'receipt': return `<span class="receipt"><span class="ptitle">${short}</span><span class="plines"></span></span>`;
    case 'sticky': return `<span class="sticky${it.alt ? ' alt' : ''}">${tr(it.note)}</span>`;
    default: return SVG[it.kind];
  }
}

function pickScenario() {
  const opts = SCEN.filter(s => s.id !== lastScenId);
  const s = opts[Math.floor(Math.random() * opts.length)];
  lastScenId = s.id;
  return s;
}

function pickItems(n) {
  const pool = shuffle(POOL.slice());
  const chosen = [];
  const take = pred => { const i = pool.findIndex(pred); if (i >= 0) chosen.push(pool.splice(i, 1)[0]); };
  take(i => i.cls === 'secretActive' || i.cls === 'internalActive');
  take(i => i.cls === 'secretDispose' || i.cls === 'internalDispose' || i.cls === 'password');
  take(i => i.cls === 'trash');
  take(i => i.cls === 'media' || i.cls === 'password');
  while (chosen.length < n - FIXED.length && pool.length) chosen.push(pool.shift());
  return shuffle(FIXED.concat(chosen)).map(i => ({ ...i }));
}

function makeSlots() {
  const slots = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) {
    if (r === 0 && c >= 1 && c <= 3) continue; // keyboard and monitor stand sit here
    slots.push({ x: 18 + c * 16 + rnd(-2, 2), y: 20 + r * 30 + rnd(-2, 2) });
  }
  return shuffle(slots);
}

function renderItem(it) {
  it.el.setAttribute('aria-label', `${tr(it.title)}, ${tagLabel(it.tag)}`);
  it.el.innerHTML = itemInner(it);
}

function placeItem(it, slot, arrive) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'item k-' + it.kind + (arrive ? ' arrive' : '');
  el.style.left = slot.x + '%';
  el.style.top = slot.y + '%';
  it.r = rnd(-14, 14).toFixed(1) + 'deg';
  el.style.setProperty('--r', it.r);
  el.dataset.id = it.id;
  it.el = el; it.slot = slot;
  renderItem(it);
  bindItem(el, it);
  desk.appendChild(el);
}

function newRound() {
  clearInterval(tick);
  cleanupDrag();
  const sc = pickScenario();
  desk.querySelectorAll('.item').forEach(e => e.remove());
  const items = pickItems(sc.n);
  const slots = makeSlots();
  const ev = Math.random() < 0.7 ? EVENTS[Math.floor(Math.random() * EVENTS.length)] : null;
  S = { sc, items, slots, ev, evAt: ev ? sc.secs * rnd(0.15, 0.35) : Infinity, evFired: false,
        timeLeft: sc.secs, running: false, viol: 0, minor: [], placed: { laci: 0, penghancur: 0, sampah: 0, tas: 0 },
        done: 0, screen: 'on', locked: false, sel: null, over: false, startKey: 'start', reason: null };
  items.forEach(it => placeItem(it, slots.pop()));
  scene.classList.remove('day', 'dusk', 'night');
  scene.classList.add(sc.sky);
  renderRound();
  $('#result').hidden = true;
  $('#brief').hidden = false;
  $('#startBtn').focus();
}

// Texts that depend on the round; re-run on a language switch.
function renderRound() {
  const sc = S.sc;
  $('#scenName').textContent = tr(sc.title);
  $('#briefWhen').textContent = `${tr(sc.day)} · ${clock(S.over || S.running || S.paused ? sc.secs - S.timeLeft : 0)}`;
  $('#briefScen').textContent = tr(sc.title);
  $('#briefDesc').textContent = tr(sc.desc);
  $('#rTime').textContent = tr(T.secs(sc.secs));
  $('#rItems').textContent = S.items.length + (S.ev && !S.evFired ? '+?' : '');
  $('#rMax').textContent = sc.max + 'x';
  $('#startBtn').textContent = tr(T[S.startKey]);
  renderScreen(); renderLock(); renderHUD(); renderZones(); select(S.sel);
}

function clock(elapsed) {
  const [h, m] = S.sc.time;
  const t = h * 60 + m + Math.floor(elapsed / 9);
  return String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}

function start() {
  $('#brief').hidden = true;
  if (S.over) return;
  S.running = true;
  let last = performance.now();
  clearInterval(tick);
  tick = setInterval(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    if (!S.running) return;
    S.timeLeft -= dt;
    const elapsed = S.sc.secs - S.timeLeft;
    if (!S.evFired && elapsed >= S.evAt && S.items.some(i => !i.gone)) fireEvent();
    if (S.timeLeft <= 0) { S.timeLeft = 0; renderHUD(); audit('timeout'); return; }
    renderHUD();
  }, 200);
}

function openSOP() {
  if (S.running) { S.running = false; S.paused = true; }
  S.startKey = S.over ? 'close' : (S.paused ? 'resume' : 'start');
  $('#startBtn').textContent = tr(T[S.startKey]);
  $('#brief').hidden = false;
  $('#startBtn').focus();
}

function fireEvent() {
  if (S.evFired) return;
  S.evFired = true;
  const it = { ...S.ev.item };
  S.items.push(it);
  placeItem(it, S.slots.pop() || { x: 50, y: 60 }, true);
  showToast('info', tr(T.newItem), tr(S.ev.msg), '');
  renderHUD();
}

function renderHUD() {
  $('#timer').textContent = fmt(S.timeLeft);
  $('#timer').classList.toggle('warn', S.timeLeft <= 15);
  $('#left').textContent = S.items.filter(i => !i.gone).length;
  $('#wallclock').textContent = clock(S.sc.secs - S.timeLeft);
  const p = $('#pips'); p.innerHTML = '';
  for (let i = 0; i < S.sc.max; i++) { const d = document.createElement('span'); d.className = 'pip' + (i < S.viol ? ' on' : ''); p.appendChild(d); }
  p.setAttribute('aria-label', tr(T.pipsAria(S.viol, S.sc.max)));
}

function renderZones() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const k = el.dataset.count, n = S.placed[k], label = tr(T['z_' + k]);
    el.textContent = n ? `${label} · ${n}` : label;
  });
}

function renderScreen() {
  const scr = $('#screen'), mon = $('#monitor');
  mon.classList.toggle('is-off', S.screen === 'off');
  $('#monHint').textContent = tr(S.screen === 'on' ? T.monOn : S.screen === 'locked' ? T.monLocked : T.monOff);
  if (S.screen === 'on') {
    const rows = [tr(T.sheetHead), 'C-1021  Rina Hapsari   0812-xxx', 'C-1022  Dimas Pratama  0813-xxx', 'C-1023  Sari Wulandari 0857-xxx', 'C-1024  Yoga Saputra   0821-xxx', 'C-1025  Maya Lestari   0878-xxx', 'C-1026  Budi Santoso   0815-xxx', 'C-1027  Ayu Kartika    0819-xxx', 'C-1028  Fajar Nugroho  0852-xxx', 'C-1029  Nina Puspita   0896-xxx'];
    scr.innerHTML = `<span class="scr-on"><span class="bar"><span>${tr(T.sheetFile)}</span><span>${tagLabel('RAHASIA')}</span></span><span class="grid"><i style="top:30%"></i><span class="rows">${rows.map(r => `<span>${r}</span>`).join('')}</span></span></span>`;
  } else if (S.screen === 'locked') {
    scr.innerHTML = `<span class="scr-lock"><span class="av"></span><span class="big">${clock(S.sc.secs - S.timeLeft)}</span><span>${tr(T.lockScreen)}</span></span>`;
  } else {
    scr.innerHTML = '<span class="scr-off"></span>';
  }
}

function renderLock() {
  const b = $('#lockBtn');
  b.classList.toggle('locked', S.locked);
  b.setAttribute('aria-pressed', String(S.locked));
  b.innerHTML = LOCK_SVG(S.locked) + tr(S.locked ? T.lockOn : T.lockOff);
  b.setAttribute('aria-label', tr(S.locked ? T.lockAriaOn : T.lockAriaOff));
}

function select(it) {
  if (S.sel && S.sel.el) S.sel.el.classList.remove('sel');
  S.sel = it && !it.gone ? it : null;
  it = S.sel;
  const ins = $('#inspector');
  $('#zones').classList.toggle('ready', !!it);
  if (!it) {
    ins.innerHTML = `<span class="empty">${tr(T.inspEmpty)}</span>`;
    return;
  }
  it.el.classList.add('sel');
  ins.innerHTML = `<span class="chip ${tagKey(it.tag)}">${tagLabel(it.tag)}</span><span class="body"><span class="t">${tr(it.title)}</span><span class="d">${tr(it.detail)}</span></span><span class="keys">${tr(T.keys)}</span>`;
}

function attempt(it, dest) {
  if (!S.running || it.gone) return;
  const c = CLS[it.cls];
  const zb = document.querySelector(`.zbtn[data-dest="${dest}"]`);
  if (c.ok.includes(dest)) {
    if (dest === 'laci' && S.locked) {
      showToast('info', tr(T.drawerStill), tr(T.drawerStillTx), '');
      return;
    }
    it.gone = true; it.dest = dest;
    S.placed[dest]++; S.done++;
    it.el.classList.remove('sel');
    it.el.classList.add('gone');
    setTimeout(() => it.el.remove(), 300);
    pulse(zb, 'pulse-ok');
    showToast('ok', `${tr(it.title)} → ${destName(dest)}`, tr(c.msg), '');
    if (S.sel === it) select(null);
    renderHUD(); renderZones();
    // the surprise item lands while the desk is still being cleared, never after it looks done
    if (S.ev && !S.evFired && S.items.filter(i => !i.gone).length <= 2) fireEvent();
  } else {
    const [text, code] = c.why[dest] || [T.defaultWhy, 'A.7.7'];
    violation(l => `${tr(it.title, l)} → ${destName(dest, l)}`, text, code);
    pulse(zb, 'pulse-bad');
    it.el.classList.remove('shake'); void it.el.offsetWidth; it.el.classList.add('shake');
  }
}

function violation(title, text, code) {
  S.viol++;
  S.minor.push({ title, text, code });
  showToast('bad', tr(T.notSop) + tr(title), tr(text), tr(CTRL[code]));
  renderHUD();
  if (S.viol >= S.sc.max) setTimeout(() => audit('violations'), 900);
}

function pulse(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function showToast(kind, title, text, code) {
  const t = $('#toast');
  t.className = 'toast show ' + kind;
  t.querySelector('.tt').textContent = title;
  t.querySelector('.tx').textContent = text;
  t.querySelector('.tc').textContent = code || '';
  t.querySelector('.tc').hidden = !code;
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), kind === 'bad' ? 4200 : kind === 'info' ? 3800 : 2200);
}

/* ---- monitor ---- */
function openMonitorMenu() {
  if (!S.running) return;
  if (S.screen === 'off') { showToast('info', tr(T.pcIsOff), tr(T.pcIsOffTx), ''); return; }
  const m = $('#monMenu');
  const r = $('#monitor').getBoundingClientRect();
  m.hidden = false;
  m.querySelector('[data-act="lock"]').disabled = S.screen === 'locked';
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + r.width / 2 - w / 2)) + 'px';
  m.style.top = Math.max(12, Math.min(window.innerHeight - h - 12, r.top + r.height * 0.3)) + 'px';
  m.querySelector('button:not(:disabled)').focus();
}
function monitorAct(act) {
  $('#monMenu').hidden = true;
  if (act === 'cancel' || !S.running) return;
  if (act === 'lock') {
    S.screen = 'locked';
    if (S.sc.leave === 'eod') violation(T.onlyLocked, T.onlyLockedTx, 'A.8.1');
    else showToast('ok', tr(T.monLocked), tr(T.scrLockedTx), '');
  } else {
    S.screen = 'off';
    showToast('ok', tr(T.offT), tr(S.sc.leave === 'eod' ? T.offEod : T.offTemp), '');
  }
  renderScreen();
}

/* ---- audit ---- */
function audit(reason) {
  if (S.over) return;
  S.running = false; S.over = true; S.reason = reason;
  clearInterval(tick);
  cleanupDrag();
  select(null);
  $('#monMenu').hidden = true;
  renderResult();
  $('#brief').hidden = true;
  $('#result').hidden = false;
  $('#againBtn').focus();
}

function majorFindings() {
  const major = [];
  S.items.filter(i => !i.gone).forEach(i => {
    const c = CLS[i.cls];
    major.push({ item: true, title: l => tr(T.leftOnDesk([tr(i.title, 'id'), tr(i.title, 'en')]), l),
      text: l => tr(T.should, l) + c.ok.map(d => destName(d, l).toLowerCase()).join(tr(T.or, l)) + '. ' + tr(c.msg, l),
      code: i.cls === 'password' ? 'A.5.17' : i.cls === 'access' ? 'A.7.2' : i.cls === 'media' ? 'A.7.10' : 'A.7.7' });
  });
  if (S.sc.leave === 'eod' && S.screen !== 'off') major.push({ title: S.screen === 'on' ? T.pcOnFind : T.pcNotOff, text: T.pcFindTx, code: 'A.8.1' });
  if (S.sc.leave === 'temp' && S.screen === 'on') major.push({ title: T.scrNotLocked, text: T.scrNotLockedTx, code: 'A.7.7' });
  if (!S.locked) major.push({ title: T.drawerFind, text: T.drawerFindTx, code: 'A.7.7' });
  return major;
}

function renderResult() {
  const major = majorFindings(), reason = S.reason;
  const pass = reason === 'leave' && major.length === 0 && S.viol < S.sc.max;
  const stamp = $('#resStamp');
  stamp.textContent = tr(pass ? T.pass : T.fail);
  stamp.className = 'vstamp ' + (pass ? 'pass' : 'fail');
  let title, sub;
  if (pass) {
    title = S.viol === 0 ? T.passClean : T.passNotes;
    sub = S.viol === 0 ? T.passCleanTx : T.passNotesTx(S.viol);
  } else if (reason === 'timeout') {
    title = T.timeout; sub = T.timeoutTx;
  } else if (reason === 'violations') {
    title = T.tooMany; sub = T.tooManyTx(S.viol, S.sc.max);
  } else {
    const left = S.items.filter(i => !i.gone).length;
    const rest = major.filter(f => !f.item).map(f => tr(f.title).toLowerCase());
    title = left ? T.notClear : T.clearNotDone;
    sub = tr(left ? T.itemsLeft(left) : T.allCleared) + (rest.length ? tr(T.notYet) + rest.join(', ') + '.' : '.');
  }
  $('#resTitle').textContent = tr(title);
  $('#resSub').textContent = tr(sub);
  $('#resWhen').textContent = `${tr(S.sc.title)} · ${tr(S.sc.day)} ${clock(S.sc.secs - S.timeLeft)}`;
  $('#resTime').textContent = fmt(S.timeLeft);
  $('#resDone').textContent = `${S.done}/${S.items.length}`;
  $('#resViol').textContent = `${S.viol}/${S.sc.max}`;
  const list = $('#resList'); list.innerHTML = '';
  const add = (cls, f, sev) => {
    const li = document.createElement('li'); li.className = cls;
    li.innerHTML = `<span class="fh"><span></span><span class="fc"></span></span><span class="ft"></span>`;
    li.querySelector('.fh span').textContent = `${tr(sev)} · ${tr(f.title)}`;
    li.querySelector('.fc').textContent = tr(CTRL[f.code]) || '';
    li.querySelector('.ft').textContent = tr(f.text);
    list.appendChild(li);
  };
  major.forEach(f => add('major', f, T.major));
  S.minor.forEach(f => add('minor', f, T.minor));
  if (!major.length && !S.minor.length) add('none', { title: T.none, text: T.noneTx, code: 'A.7.7' }, 'OK');
}

/* ---- language switch ---- */
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tr(T[el.dataset.t]); });
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = tr(T[el.dataset.th]); });
  document.querySelectorAll('[data-t-aria]').forEach(el => { el.setAttribute('aria-label', tr(T[el.dataset.tAria])); });
  document.querySelectorAll('[data-tag]').forEach(el => { el.textContent = tagLabel(el.dataset.tag); });
  document.querySelectorAll('[data-lang-toggle]').forEach(b => {
    b.innerHTML = `<span${LANG === 'en' ? ' class="on"' : ''}>EN</span><span${LANG === 'id' ? ' class="on"' : ''}>ID</span>`;
    b.setAttribute('aria-label', LANG === 'en' ? 'Ganti ke Bahasa Indonesia' : 'Switch to English');
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('clear-desk-lang', l); } catch (_) {}
  applyStatic();
  if (!S) return;
  S.items.forEach(it => { if (!it.gone && it.el) renderItem(it); });
  renderRound();
  if (S.over) renderResult();
}
function initialLang() {
  const h = location.hash.replace('#', '');
  if (h === 'en' || h === 'id') return h;
  try { const s = localStorage.getItem('clear-desk-lang'); if (s === 'en' || s === 'id') return s; } catch (_) {}
  return (navigator.language || '').toLowerCase().startsWith('id') ? 'id' : 'en';
}
document.querySelectorAll('[data-lang-toggle]').forEach(b => b.addEventListener('click', () => setLang(LANG === 'en' ? 'id' : 'en')));

/* ---- input: tap to select, drag to drop ---- */
let drag = null;
// Remove every drag leftover, even if pointerup never reached the item (multi-touch, cancelled touch, round ended mid-drag).
function cleanupDrag() {
  drag = null;
  document.querySelectorAll('.ghost').forEach(g => g.remove());
  document.querySelectorAll('.item.dragging').forEach(e => e.classList.remove('dragging'));
  document.querySelectorAll('.zbtn.hot').forEach(e => e.classList.remove('hot'));
}
function zoneAt(x, y) {
  for (const b of document.querySelectorAll('.zbtn')) {
    const r = b.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return b;
  }
  return null;
}
function bindItem(el, it) {
  el.addEventListener('pointerdown', e => {
    if (!S.running || it.gone || e.button > 0) return;
    if (drag) cleanupDrag();
    drag = { it, el, pid: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, hot: null };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener('pointermove', e => {
    if (!drag || drag.it !== it || e.pointerId !== drag.pid) return;
    if (!S.running) { cleanupDrag(); return; }
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
      drag.moved = true;
      select(it);
      const g = document.createElement('div');
      g.className = 'ghost k-' + it.kind;
      g.style.setProperty('--r', it.r);
      g.style.setProperty('--u', Math.min(scene.clientWidth * 0.085, scene.clientHeight * 0.135) * 1.15 + 'px');
      g.style.width = el.offsetWidth + 'px'; g.style.height = el.offsetHeight + 'px';
      g.style.fontSize = getComputedStyle(el).fontSize;
      g.innerHTML = itemInner(it);
      document.body.appendChild(g);
      drag.ghost = g;
      el.classList.add('dragging');
    }
    if (drag.moved) {
      drag.ghost.style.left = e.clientX + 'px';
      drag.ghost.style.top = e.clientY + 'px';
      const z = zoneAt(e.clientX, e.clientY);
      if (z !== drag.hot) { drag.hot && drag.hot.classList.remove('hot'); z && z.classList.add('hot'); drag.hot = z; }
    }
  });
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
  el.addEventListener('lostpointercapture', endDrag);
  el.addEventListener('click', () => {
    if (el.dataset.noclick || !S.running || it.gone) return;
    select(S.sel === it ? null : it);
  });
}

function endDrag(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  cleanupDrag();
  if (d.moved) {
    d.el.dataset.noclick = '1';
    setTimeout(() => delete d.el.dataset.noclick, 50);
    const z = e.type === 'pointerup' ? zoneAt(e.clientX, e.clientY) : null;
    if (z && S.running) attempt(d.it, z.dataset.dest);
  }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', cleanupDrag);

document.querySelectorAll('.zbtn').forEach(b => b.addEventListener('click', () => {
  if (!S.running) return;
  if (!S.sel) { showToast('info', tr(T.pickFirst), tr(T.pickFirstTx), ''); return; }
  attempt(S.sel, b.dataset.dest);
}));
$('#lockBtn').addEventListener('click', () => {
  if (!S.running) return;
  S.locked = !S.locked; renderLock();
  showToast('info', tr(S.locked ? T.dLocked : T.dOpened), tr(S.locked ? T.dLockedTx : T.dOpenedTx), '');
});
$('#monitor').addEventListener('click', openMonitorMenu);
$('#monMenu').addEventListener('click', e => { const b = e.target.closest('button'); if (b) monitorAct(b.dataset.act); });
$('#leaveBtn').addEventListener('click', () => { if (S.running) audit('leave'); });
$('#poster').addEventListener('click', openSOP);
$('#startBtn').addEventListener('click', () => { if (S.over) { $('#brief').hidden = true; $('#result').hidden = false; return; } S.paused = false; start(); });
$('#againBtn').addEventListener('click', newRound);
$('#sopBtn').addEventListener('click', () => { $('#result').hidden = true; openSOP(); });
document.addEventListener('pointerdown', e => {
  const m = $('#monMenu');
  if (!m.hidden && !m.contains(e.target) && !$('#monitor').contains(e.target)) m.hidden = true;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#monMenu').hidden = true; if (S.running) select(null); return; }
  if (!S.running || !S.sel) return;
  const i = ['1', '2', '3', '4'].indexOf(e.key);
  if (i >= 0) { e.preventDefault(); attempt(S.sel, DEST_KEYS[i]); }
});

LANG = initialLang();
applyStatic();
newRound();
})();
</script>
</body>
</html>
