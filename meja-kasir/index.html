<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1115">
<meta name="description" content="Cashier Desk: a first-person cashier desk training game for the store checkout SOP (SOP-KSR-01) by Ihsan Mahendra · Holy Doughnut Studio. English and Bahasa Indonesia.">
<meta name="author" content="Ihsan Mahendra">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cashier Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: first-person cashier desk. Dark HUD strip on top, the store + counter scene in the middle (a fixed 1280x640 world scaled to fit), action panel at the bottom. Single dark look, by choice, matching the other SOP games. */
:root{
  color-scheme:dark;
  --hud:#0d1115; --panel:#12171c; --card:#1a2128; --card2:#212a33; --line:#2f3a45;
  --ink:#e9edf0; --mute:#97a3ae;
  --amber:#f2b33d; --amber-ink:#1b1406;
  --good:#4cc38a; --bad:#e8604c;
  --paper:#f3efe6; --paper-ink:#1d2329;
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--hud);color:var(--ink);font-family:var(--sans);overflow-x:hidden;overflow-y:auto}
#app{display:grid;grid-template-rows:auto minmax(220px,1fr) auto;height:100%}
button{font:inherit;color:inherit}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hud);border-bottom:1px solid #1c242c}
.eyebrow{font:500 11px/1.2 var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.hud h1{font:700 19px/1.2 var(--display);margin:3px 0 0}
.stats{display:flex;gap:22px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat .k{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--mute)}
.stat .v{font:600 18px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px;margin-top:6px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid #5a6875}
.pip.on{background:var(--good);border-color:var(--good)}
.pip.cur{border-color:var(--amber)}
.btn{font:600 14px var(--sans);border-radius:6px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible,.act:focus-visible,.chipbtn:focus-visible,.obj:focus-visible,.lang button:focus-visible,.key:focus-visible,.den:focus-visible,.plu:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;border:0;padding:9px 11px;font:600 12px var(--mono);letter-spacing:.06em;color:var(--mute);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}

/* Stage: a 1280x640 world scaled to the available space */
.stage{position:relative;min-height:0;background:#1b2229;overflow:hidden}
#world{position:absolute;left:50%;top:50%;width:1280px;height:640px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center}
#world > svg{position:absolute;inset:0;width:1280px;height:640px;display:block}
#world text{font-family:var(--mono)}
#bg{z-index:0}
#cust{position:absolute;left:520px;top:58px;width:240px;height:280px;z-index:1;transition:transform 1s ease,opacity .5s}
#cust.away{transform:translateX(620px);opacity:0}
#cust.leave{transform:translateX(-640px);opacity:0}
#cust svg{width:100%;height:100%;display:block}
#counter{z-index:2;pointer-events:none}
.obj{position:absolute;z-index:3;cursor:pointer;border-radius:6px;transition:filter .15s}
.obj:hover,.obj.sel{filter:drop-shadow(0 0 8px rgba(242,179,61,.95))}
.obj.attn{animation:attn 1.3s ease-in-out infinite}
@keyframes attn{0%,100%{filter:drop-shadow(0 0 2px rgba(242,179,61,.3))}50%{filter:drop-shadow(0 0 12px rgba(242,179,61,1))}}
.obj svg{display:block;width:100%;height:100%}
.lbl{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font:600 11px var(--mono);letter-spacing:.06em;color:#c9d2da;white-space:nowrap;pointer-events:none}

.item{width:112px;height:104px;transition:left .35s ease,top .35s ease,opacity .3s,transform .35s}
.item .nm{position:absolute;left:-4px;right:-4px;bottom:-4px;text-align:center;font:600 10.5px/1.15 var(--sans);color:#fff;background:rgba(13,17,21,.78);border-radius:3px;padding:2px 3px}
.item.gone{opacity:0;transform:scale(.6)}
.item .flag{position:absolute;top:-8px;right:-6px;font:700 10px var(--mono);background:var(--bad);color:#fff;border-radius:3px;padding:1px 5px}

#bubble{position:absolute;right:770px;top:40px;max-width:380px;z-index:4;background:#fbf8f1;color:#1d2329;border-radius:12px;padding:12px 16px;font:500 17px/1.45 var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#bubble::after{content:"";position:absolute;right:-12px;top:30px;border:8px solid transparent;border-left:12px solid #fbf8f1;border-right:0}
#bubble b{display:block;font:600 11px var(--mono);letter-spacing:.08em;color:#7b6a45;margin-bottom:2px;text-transform:uppercase}
#bubble.me{background:#2a3742;color:#e9edf0}
#bubble.me::after{border-left-color:#2a3742}
#bubble.me b{color:var(--amber)}

/* POS monitor */
#pos{position:absolute;left:884px;top:96px;width:362px;height:262px;z-index:3;background:#0b1a16;border-radius:4px;color:#b9f3d3;font:13px/1.35 var(--mono);display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden}
#pos .ph{display:flex;justify-content:space-between;background:#123128;padding:5px 9px;font-size:11px;letter-spacing:.06em;color:#8fd9b4}
#pos .pl{min-height:0;padding:6px 9px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#pos .ln{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
#pos .ln span:first-child{overflow:hidden;text-overflow:ellipsis}
#pos .ln.x{color:#5e7d70;text-decoration:line-through}
#pos .msg{padding:5px 9px;font-size:12.5px;min-height:34px;border-top:1px dashed #23493c}
#pos .msg.warn{background:#3a2a0c;color:#ffd27a}
#pos .msg.ok{color:#7fe0b0}
#pos .tot{display:flex;justify-content:space-between;align-items:baseline;padding:6px 9px;background:#123128;font:600 22px var(--mono);color:#e7fff2}
#pos .tot small{font-size:11px;color:#8fd9b4;letter-spacing:.08em}

#tray .note{position:absolute;width:86px;height:42px;border-radius:3px;font:700 12px var(--mono);color:#fff;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.35)}
#tray .note.ok{outline:2px solid var(--good)}
#tray .note.rej{opacity:.25}
#drawerBox{transition:transform .35s ease}
#drawer.open #drawerBox{transform:translateY(-62px)}
#receipt{transition:transform .5s ease}
#printer.on #receipt{transform:translateY(-44px)}

.hint{position:absolute;top:8px;left:12px;font:500 12px var(--mono);color:var(--amber);letter-spacing:.06em;background:rgba(13,17,21,.78);padding:4px 10px;border-radius:4px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:6}
.toasts{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:grid;gap:8px;width:min(560px,calc(100% - 32px));z-index:7;pointer-events:none}
.toast{background:rgba(14,19,23,.96);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:6px;padding:10px 14px;font-size:13.5px;line-height:1.45;animation:tin .25s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.good{border-left-color:var(--good)}
.toast.bad{border-left-color:var(--bad)}
.toast.info{border-left-color:var(--amber)}
.toast b{display:block;font-size:14px;margin-bottom:2px}
.toast.bad b{color:#ff9c8c}.toast.good b{color:#7fe0b0}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* Bottom panel */
.panel{background:var(--panel);border-top:1px solid #1c242c;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.info{display:flex;align-items:flex-start;gap:14px;min-height:40px}
.tag{font:600 11px var(--mono);letter-spacing:.1em;background:var(--amber);color:var(--amber-ink);padding:5px 8px;border-radius:3px;white-space:nowrap;margin-top:1px}
.info .txt{min-width:0}
.info .t{font:600 15px var(--sans)}
.info .d{color:var(--mute);font-size:13.5px;margin:3px 0 0;max-width:95ch;line-height:1.45}
.saym{display:none;margin:6px 0 0;font-size:14px;line-height:1.45;background:#fbf8f1;color:#1d2329;border-radius:8px;padding:6px 10px}
.saym.me{background:#2a3742;color:var(--ink)}
.saym b{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-right:6px;color:#7b6a45}
.saym.me b{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips:empty{display:none}
.chipbtn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px 6px 8px;cursor:pointer;font-size:13px}
.chipbtn i{width:12px;height:12px;border-radius:3px;flex:none}
.chipbtn[aria-pressed="true"]{border-color:var(--amber);background:#2b2412}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.act{position:relative;display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 40px 10px 12px;cursor:pointer;min-height:52px}
.act:hover{border-color:#5a6875;background:var(--card2)}
.act b{display:block;font-size:14px;font-weight:600}
.act small{display:block;color:var(--mute);font:12px var(--mono);margin-top:2px}
.act kbd{position:absolute;top:6px;right:8px;font:11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.act.done{border-color:#2f5a46}
.act.done::after{content:"✓";position:absolute;bottom:6px;right:9px;color:var(--good);font:600 13px var(--mono)}
.act.main{border-color:#6b5420}

/* Modals */
.modal{position:fixed;inset:0;background:rgba(6,9,12,.74);display:grid;place-items:start center;overflow-y:auto;overscroll-behavior:contain;z-index:20;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(820px,100%);min-width:0;box-sizing:border-box;margin-block:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.sheet h2{font:700 25px/1.15 var(--display);margin:6px 0 6px;text-wrap:balance}
.sheet h3{font:600 15px var(--sans);margin:16px 0 6px}
.sheet p{line-height:1.55;max-width:70ch}
.lead{color:var(--mute);margin:0 0 12px}
.eb{font:500 11px var(--mono);letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;align-items:center}
.sheet .row .grow{margin-right:auto}
.x{position:absolute;top:14px;right:14px;background:transparent;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;color:var(--mute);cursor:pointer;font-size:18px}
.posbar{background:#0b1a16;color:#b9f3d3;font:13px/1.4 var(--mono);border-radius:6px;padding:10px 12px;margin:10px 0}
.posbar b{color:#e7fff2}
.warnbar{background:#3a2a0c;color:#ffd27a}

.ktp{background:linear-gradient(135deg,#bfe0f5,#7fb3dc);color:#10263a;border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr 96px;gap:4px 16px;max-width:460px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.ktp .hd{grid-column:1/-1;text-align:center;font:700 12px var(--sans);letter-spacing:.04em;margin-bottom:6px}
.ktp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.ktp dt{font:500 10.5px var(--mono);text-transform:uppercase;opacity:.75;padding-top:2px}
.ktp dd{margin:0;font-weight:600}
.ktp .foto{background:#d64545;border-radius:4px;overflow:hidden;align-self:start}
.ktp .foto svg{display:block;width:96px;height:112px}
.noid{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mute);max-width:460px}

.notes{display:grid;gap:14px}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.ncard svg{width:100%;max-width:400px;height:auto;display:block;border-radius:4px}
.ncard .ctl{display:grid;gap:8px;min-width:150px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:7px 8px;font:600 11.5px var(--mono);color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}
.st{font:600 12px var(--mono)}
.refbox{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 6px}
.refbox summary{cursor:pointer;padding:10px 14px;font:600 14px var(--sans);color:var(--amber)}
.refbox .refin{padding:0 14px 12px}
.refhd{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rf{margin:0;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--good);border-radius:6px;padding:10px}
.rf.bad{border-top-color:var(--bad)}
.rf figcaption{font:700 12px var(--mono);letter-spacing:.08em;color:#7fe0b0;margin-bottom:8px}
.rf.bad figcaption{color:#ff9c8c}
.rf svg{width:100%;height:auto;display:block;border-radius:4px}
.rf ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.crit{font-size:13px;color:var(--mute);line-height:1.5;margin:10px 0 0}
.st.ok{color:var(--good)} .st.rej{color:#ff9c8c}

.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin-top:10px}
.key{height:48px;border-radius:6px;border:1px solid var(--line);background:var(--card);font:600 18px var(--mono);cursor:pointer}
.key:hover{background:var(--card2)}
.readout{font:600 26px var(--mono);background:#0b1a16;color:#e7fff2;border-radius:6px;padding:10px 14px;min-width:240px;text-align:right;letter-spacing:.04em}
.padwrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.hand{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.hand .note{width:92px;height:44px;border-radius:3px;font:700 12px var(--mono);color:#fff;display:grid;place-items:center;border:2px solid rgba(255,255,255,.35)}
.coin{width:44px!important;height:44px!important;border-radius:50%!important}

.dens{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0}
.den{height:52px;border-radius:5px;border:2px solid rgba(255,255,255,.3);font:700 13px var(--mono);color:#fff;cursor:pointer}
.den.c{border-radius:26px}
.den:hover{filter:brightness(1.12)}
.given{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px;font:13px var(--mono);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.given span{background:var(--card2);border-radius:4px;padding:3px 7px}

.plus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.plu{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.plu:hover{background:var(--card2)}
.plu svg{width:44px;height:44px;flex:none}
.plu b{display:block;font-size:13.5px}
.plu small{font:12px var(--mono);color:var(--mute)}
.scalebox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.scalebox svg{width:220px;height:auto}

.phone{width:240px;background:#111;border-radius:28px;padding:14px 10px;margin:6px auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.phone .scr{background:#f4f7fb;color:#18222d;border-radius:18px;padding:22px 16px;text-align:center;font-size:13px;line-height:1.5}
.phone .ok{width:58px;height:58px;border-radius:50%;background:#22a565;color:#fff;font:700 30px/58px var(--sans);margin:0 auto 10px}
.phone .amt{font:700 24px var(--sans);margin:4px 0}
.mut{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.mut li{display:grid;grid-template-columns:110px 1fr auto;gap:10px;background:#0b1a16;color:#b9f3d3;border-radius:5px;padding:9px 12px;font:13px var(--mono)}
.mut li b{color:#e7fff2}
.mut li.new{outline:1px solid #2f8f63}
.mut .empty{grid-template-columns:1fr;color:#6f9483;text-align:center}

.steps{margin:6px 0;padding-left:22px;line-height:1.6}
.steps li{margin-bottom:6px}
.steps b{color:var(--ink)}
.no{background:#2a1714;border:1px solid #6b3029;border-radius:6px;padding:10px 14px;line-height:1.55;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.kpi .k{font:500 10.5px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.kpi .v{font:600 22px var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.grade{display:inline-block;font:600 12px var(--mono);letter-spacing:.08em;padding:4px 10px;border-radius:4px;margin-top:4px;color:#0d1115}
.box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:12px 14px;line-height:1.55;margin-top:10px}
.box.good{border-left-color:var(--good)}
.box b{display:block;margin-bottom:2px}
.served{display:grid;gap:6px;margin-top:8px}
.served div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13.5px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.served small{color:var(--mute);font:12px var(--mono)}

@media (max-width:720px){
  .hud h1{font-size:16px}
  .stats{gap:14px;margin-left:0}
  .saym{display:block}
  .stat .v{font-size:15px}
  .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .act{padding-right:32px}
  .ncard{grid-template-columns:1fr}
  .rgrid{grid-template-columns:1fr}
  .dens{grid-template-columns:repeat(4,minmax(0,1fr))}
  .plus{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:1fr 1fr}
  .mut li{grid-template-columns:80px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div>
      <div class="eyebrow" data-t="SOP-KSR-01 · Prosedur Transaksi Kasir|SOP-KSR-01 · Checkout Procedure">SOP-KSR-01 · Prosedur Transaksi Kasir</div>
      <h1 data-t="Sentosa Mart · Kasir 02|Sentosa Mart · Till 02">Sentosa Mart · Kasir 02</h1>
    </div>
    <div class="stats">
