<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1115">
<meta name="description" content="Pos Jaga Lobi: a first-person lobby security desk game for the visitor reception, access card, CCTV and patrol SOP (ISO/IEC 27001 A.7) by Ihsan Mahendra · Holy Doughnut Studio. English and Bahasa Indonesia.">
<meta name="author" content="Ihsan Mahendra">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pos Jaga Lobi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: first-person security desk. Dark HUD strip on top, illustrated lobby + desk scene in the middle, action panel with numbered cards at the bottom. Single dark look, by choice. */
:root{
  color-scheme:dark;
  --hud:#0d1115; --panel:#12171c; --card:#1a2128; --card2:#212a33; --line:#2f3a45;
  --ink:#e9edf0; --mute:#97a3ae;
  --amber:#f2b33d; --amber-ink:#1b1406;
  --good:#4cc38a; --bad:#e8604c;
  --paper:#f3efe6; --paper-ink:#1d2329; --rule:#d9d2c3;
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
html,body{height:100%}
body{background:var(--hud);color:var(--ink);font-family:var(--sans);overflow-x:hidden;overflow-y:auto}
#app{display:grid;grid-template-rows:auto minmax(200px,1fr) auto;height:100%}
button{font:inherit;color:inherit}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hud);border-bottom:1px solid #1c242c}
.eyebrow{font:500 11px/1.2 var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.hud h1{font:700 19px/1.2 var(--display);margin:3px 0 0;text-wrap:balance}
.stats{display:flex;gap:22px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat .k{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--mute)}
.stat .v{font:600 20px/1.25 var(--mono);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px;margin-top:5px;align-items:center}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid #9aa5b0}
.pip.on{background:var(--bad);border-color:var(--bad)}
.pips small{font:500 11px var(--mono);color:var(--bad)}
.btn{font:600 14px var(--sans);border-radius:6px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.bad{border-color:#7a3a33;color:#ff9c8c}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible,.act:focus-visible,.feed:focus-visible,.mk:focus-visible,.lang button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;border:0;padding:9px 11px;font:600 12px var(--mono);letter-spacing:.06em;color:var(--mute);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}

/* Scene */
.stage{position:relative;min-height:0;background:#232b34;overflow:hidden}
#scene{width:100%;height:100%;display:block}
#scene text{font-family:var(--mono)}
.obj{cursor:pointer;transition:filter .15s}
.obj:hover,.obj:focus{filter:drop-shadow(0 0 7px rgba(242,179,61,.95));outline:none}
.obj.attn{animation:attn 1.3s ease-in-out infinite}
@keyframes attn{0%,100%{filter:drop-shadow(0 0 2px rgba(242,179,61,.3))}50%{filter:drop-shadow(0 0 10px rgba(242,179,61,1))}}
#visitor{transition:transform 1.1s ease,opacity .45s}
.blink{animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.scan{animation:scan 3s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(138px)}}
.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:500 12px var(--mono);color:var(--amber);letter-spacing:.06em;background:rgba(13,17,21,.72);padding:4px 10px;border-radius:4px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toasts{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:grid;gap:8px;width:min(560px,calc(100% - 32px));z-index:5;pointer-events:none}
.toast{background:rgba(14,19,23,.96);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:6px;padding:10px 14px;font-size:13.5px;line-height:1.45;animation:tin .25s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.good{border-left-color:var(--good)}
.toast.bad{border-left-color:var(--bad)}
.toast.info{border-left-color:var(--amber)}
.toast b{display:block;font-size:14px;margin-bottom:2px}
.toast.bad b{color:#ff9c8c}.toast.good b{color:#7fe0b0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* Bottom panel */
.panel{background:var(--panel);border-top:1px solid #1c242c;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.info{display:flex;align-items:flex-start;gap:14px;min-height:44px}
.tag{font:600 11px var(--mono);letter-spacing:.1em;background:var(--amber);color:var(--amber-ink);padding:5px 8px;border-radius:3px;white-space:nowrap;margin-top:1px}
.info .txt{min-width:0}
.info .t{font:600 15px var(--sans)}
.info .d{color:var(--mute);font-size:13.5px;margin:3px 0 0;max-width:90ch;line-height:1.45}
.info .keys{margin-left:auto;font:12px var(--mono);color:var(--mute);white-space:nowrap}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.act{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 40px 10px 12px;cursor:pointer;min-height:56px}
.act:hover{border-color:#5a6875;background:var(--card2)}
.act b{display:block;font-size:14px;font-weight:600}
.act small{display:block;color:var(--mute);font:12px var(--mono);margin-top:2px}
.act kbd{position:absolute;top:6px;right:8px;font:11px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.act .chk{position:absolute;bottom:6px;right:8px;font:600 11px var(--mono);color:var(--good)}
.act.done{border-color:#2f5a46}
.act.danger b{color:#ff9c8c}
.act .chip{width:24px;height:34px;border-radius:3px;flex:none;box-shadow:inset 0 -8px 0 rgba(255,255,255,.25)}
.ico{width:38px;height:30px;flex:none;display:grid;place-items:center}
.ico svg{width:38px;height:30px}
.idle{color:var(--mute);font:13px var(--mono);padding:16px 0;grid-column:1/-1}

/* Modals */
.modal{position:fixed;inset:0;background:rgba(6,9,12,.74);display:grid;place-items:center;z-index:20;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(1000px,100%);max-height:100%;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h2{font:700 25px/1.15 var(--display);margin:6px 0 6px;text-wrap:balance}
.sheet h3{font:600 15px var(--sans);margin:0 0 6px}
.sheet p{line-height:1.55;max-width:70ch}
.lead{color:var(--mute);margin:0 0 16px}
.eb{font:500 11px var(--mono);letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;align-items:center}
.sheet .row .grow{margin-right:auto}
.x{float:right;margin-left:12px}

.docgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.ktp{background:linear-gradient(135deg,#c4def0,#8fbfe2);color:#11202c;border-radius:10px;padding:12px;font-size:12px;display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ktp .h{grid-column:1/-1;font:600 10.5px var(--mono);letter-spacing:.1em;border-bottom:1px solid rgba(17,32,44,.25);padding-bottom:5px}
.ktp dl{margin:0;display:grid;gap:3px}
.ktp dt{font:500 9.5px var(--mono);letter-spacing:.06em;opacity:.7;text-transform:uppercase}
.ktp dd{margin:0 0 3px;font-weight:600;overflow-wrap:anywhere}
.ktp .foto svg{width:76px;height:90px;border-radius:4px;display:block}
.compare{display:flex;gap:12px;margin-top:12px;align-items:flex-end}
.compare figure{margin:0;text-align:center;font:11px var(--mono);color:var(--mute)}
.compare svg{width:70px;height:82px;border-radius:4px;display:block;margin-bottom:4px}
.letter{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:16px 16px 22px;font-size:13px;line-height:1.5;position:relative;min-height:220px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.letter .lh{font:600 10.5px var(--mono);letter-spacing:.1em;border-bottom:2px solid var(--paper-ink);padding-bottom:6px;margin-bottom:10px}
.letter h4{font:700 15px var(--sans);margin:0}
.letter .no{font:11px var(--mono);color:#5d646b;margin-bottom:8px}
.letter ul{margin:0 0 10px;padding-left:18px}
.letter .sig{font:600 26px/1 var(--hand);color:#1f3a7a}
.letter .signer{font-size:11.5px;color:#4b5259}
.letter.empty{display:grid;place-items:center;color:#7c8288;font-style:italic}
.stamp{position:absolute;right:14px;bottom:16px;border:2px solid #b0362b;color:#b0362b;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;font:700 8.5px/1.2 var(--mono);transform:rotate(-14deg);opacity:.75;text-align:center}
.docgrid .ref{grid-column:1/-1}
.ref{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:12.5px;overflow-x:auto;display:grid;gap:8px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 10px var(--mono);color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.acc{font:600 10.5px var(--mono);padding:2px 6px;border-radius:3px;color:#fff;white-space:nowrap}

.book{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px;overflow-x:auto}
.book table{min-width:640px}
.book th{color:#6b6458;border-bottom:2px solid #c9c0ae}
.book td{border-bottom:1px solid var(--rule);font:600 21px/1.1 var(--hand);color:#1f3a7a;padding:7px 6px}
.book td.jam{font:12px var(--mono);color:var(--paper-ink)}
.book tr.cur{background:rgba(242,179,61,.18)}
.book td.miss{outline:2px dashed var(--bad);outline-offset:-3px;font:12px var(--mono);color:#b0362b}
.book .empty{font:13px var(--sans);color:#7c8288;font-style:italic}

.call{display:grid;gap:12px;font-size:15px}
.dial{font:13px var(--mono);color:var(--mute)}
.say{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;line-height:1.55}
.ring{font:13px var(--mono);color:var(--amber)}

.cctv{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.big{background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.big canvas,.feed canvas{display:block;width:100%;height:auto}
.bigcap{font:12px var(--mono);color:var(--mute);margin-top:8px}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.feed{position:relative;border:2px solid transparent;border-radius:5px;cursor:pointer;background:#000;padding:0;overflow:hidden}
.feed:hover{border-color:#5a6875}
.feed.sel{border-color:var(--amber)}
.report{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:6px;padding:12px 14px;margin-bottom:14px;line-height:1.5}

.patrol{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.plan{background:#0f1418;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.plan svg{display:block;width:100%;height:auto}
.mk{cursor:pointer}
.detail{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px}
.detail svg{width:100%;height:auto;border-radius:4px;display:block;background:#2a323a}
.crit{font-size:13px;color:var(--mute);line-height:1.5}
.crit b{color:var(--ink)}

/* Briefing */
.brief{min-height:360px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.flow div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13px;line-height:1.45;position:relative}
.flow div b{display:block;font-size:14px;margin:4px 0}
.flow .n{font:600 11px var(--mono);color:var(--amber)}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.tier{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13px;line-height:1.45;display:grid;gap:6px;align-content:start}
.tier .bar{height:6px;border-radius:3px}
.tier dt{font:500 10px var(--mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.tier dd{margin:0}
.tier dl{margin:0;display:grid;gap:3px}
.list{margin:10px 0;padding-left:20px;line-height:1.7}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
.cols>div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;line-height:1.5;font-size:14px}
.iso{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.iso div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13.5px}
.iso code{font:600 12px var(--mono);color:var(--amber);display:block}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--amber)}

/* Report */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.kpi .k{font:500 10.5px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.kpi .v{font:600 24px var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.grade{display:inline-block;font:600 12px var(--mono);letter-spacing:.08em;padding:4px 10px;border-radius:4px;margin-top:4px}
.vlist{display:grid;gap:8px;margin-top:8px}
.vlist div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.vlist div b{display:block}
.vlist .ok{border-left-color:var(--good)}

@media (max-width:820px){
  .docgrid,.cctv,.patrol,.cols,.iso{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)}
  .tiers,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{gap:14px;margin-left:0}
  .info .keys{display:none}
  .actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  /* compact controls so all five options fit on a phone screen */
  .hud{padding-block:8px;gap:6px 14px}
  .hud .eyebrow{display:none}
  .hud h1{font-size:16px}
  .stat .k{font-size:9.5px}
  .stat .v{font-size:16px}
  .pip{width:12px;height:12px}
  .lang button{padding:6px 9px}
  #btnSop{padding:7px 12px;font-size:13px}
  #app{grid-template-rows:auto minmax(150px,1fr) auto}
  .panel{padding-block:10px;gap:8px}
  .info{min-height:0;gap:10px}
  .info .t{font-size:14px}
  .info .d{display:none}
  .act{padding:8px 10px;gap:8px;min-height:46px}
  .act kbd{display:none}
  .act .chk{top:4px;bottom:auto;right:6px}
  .act b{font-size:13px;line-height:1.25}
  .act small{font-size:11px}
  .ico,.ico svg{width:28px;height:22px}
  .act .chip{width:16px;height:26px}
  .act:last-child:nth-child(odd){grid-column:1/-1}
}
/* short landscape phones: one row of options */
@media (max-height:520px) and (min-width:560px){
  .actions{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
  .act:last-child:nth-child(odd){grid-column:auto}
  .act small,.info .d{display:none}
  .info .keys{display:none}
  #app{grid-template-rows:auto minmax(120px,1fr) auto}
  .hud{padding-block:6px;gap:4px 16px;flex-wrap:nowrap}
  .hud .eyebrow{display:none}
  .hud h1{font-size:15px;margin:0}
  .stats{gap:14px;flex-wrap:nowrap}
  .stat .k{font-size:9px}
  .stat .v{font-size:15px}
  .pip{width:11px;height:11px}
  .lang button{padding:5px 8px}
  #btnSop{padding:6px 10px;font-size:12px}
  .panel{padding-block:8px;gap:6px}
  .info{min-height:0}
  .act{min-height:44px;padding-block:6px}
  .toast{font-size:12.5px;padding:7px 10px}
}
@media (max-width:440px){.tiers{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="hud">
    <div>
      <div class="eyebrow" data-t="SOP-SEC-03 · Penerimaan Tamu &amp; Patroli|SOP-SEC-03 · Visitor Reception &amp; Patrol">SOP-SEC-03 · Penerimaan Tamu &amp; Patroli</div>
      <h1 id="dayTitle">Hari 1 · Senin, 19 Okt 2026</h1>
    </div>
    <div class="stats">
      <div class="stat"><div class="k" data-t="JAM|TIME">JAM</div><div class="v" id="hClock">08:00</div></div>
      <div class="stat"><div class="k" data-t="TAMU|VISITORS">TAMU</div><div class="v" id="hGuests">0/4</div></div>
      <div class="stat"><div class="k" data-t="PELANGGARAN|VIOLATIONS">PELANGGARAN</div><div class="pips" id="hViol"></div></div>
      <div class="lang" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="id" aria-pressed="true">ID</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="btn primary" id="btnSop" type="button" data-t="Briefing SOP|SOP Briefing">Briefing SOP</button>
    </div>
  </header>

  <main class="stage">
    <svg id="scene" viewBox="0 0 1280 540" preserveAspectRatio="xMidYMid meet" aria-label="Security desk">
      <defs>
        <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3944"/><stop offset="1" stop-color="#232b34"/></linearGradient>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop id="sk1" offset="0" stop-color="#8fb7d9"/><stop id="sk2" offset="1" stop-color="#d9e6ee"/></linearGradient>
        <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9693e"/><stop offset="1" stop-color="#8a522e"/></linearGradient>
      </defs>
      <rect width="1280" height="300" fill="url(#wallG)"/>
      <rect y="286" width="1280" height="14" fill="#1a2027"/>

      <!-- entrance door -->
      <text x="465" y="44" text-anchor="middle" font-size="12" letter-spacing="3" fill="#8a97a5">NUSANTARA DATA PRIMA</text>
      <rect x="358" y="58" width="214" height="242" fill="#161c22"/>
      <rect x="368" y="68" width="94" height="228" fill="url(#skyG)"/>

function wrap(str, n){
  const words=str.split(' '), lines=[]; let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>n){ lines.push(cur.trim()); cur=w; } else cur+=' '+w; }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}

  const lines=wrap(tx(src),36), h=22+lines.length*20, x=772, y=Math.max(20, 120-h);
  g.innerHTML=`<path d="M${x+18},${y+h-4} L738,148 L${x+46},${y+h-4}Z" fill="#f3efe6"/>
    <rect x="${x}" y="${y}" width="340" height="${h}" rx="10" fill="#f3efe6"/>

}

function mix(a,b,k){ const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)); const A=p(a),B=p(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join(''); }
function hud(){
  const d=DAYS[S.day];
  $('#dayTitle').textContent=`${t('Hari','Day')} ${S.day+1} · ${tx(d.label)}`;
  $('#hClock').textContent=fmt(S.clock);
  const tot=d.steps.filter(s=>s.t==='v').length, done=S.res.filter(r=>r.kind==='tamu').length;
  $('#hGuests').textContent=`${done}/${tot}`;
  const n=S.viol.length;
  $('#hViol').innerHTML=[0,1,2].map(i=>`<span class="pip${i<n?' on':''}"></span>`).join('')+(n>3?`<small>+${n-3}</small>`:'');
  $('#hViol').setAttribute('aria-label', n+t(' pelanggaran',' violations'));
  const h=(S.clock/60)%12, m=S.clock%60;
  $('#hHand').setAttribute('transform',`rotate(${h*30+m/2})`);
  $('#mHand').setAttribute('transform',`rotate(${m*6})`);
  const k=Math.min(1,Math.max(0,(S.clock-480)/540));
  let top,bot;
  if(k<.5){ top=mix('#8fb7d9','#5f9bd4',k*2); bot=mix('#dfe9ef','#cfe3f1',k*2); }
  else { top=mix('#5f9bd4','#5b4b7a',(k-.5)*2); bot=mix('#cfe3f1','#f2a46b',(k-.5)*2); }
  $('#sk1').setAttribute('stop-color',top); $('#sk2').setAttribute('stop-color',bot);
}

function toast(kind,title,body,ms){
  const el=document.createElement('div');
  el.className='toast '+kind;
  el.innerHTML=`<b>${esc(tx(title))}</b>${esc(tx(body||''))}`;
  const box=$('#toasts'); box.prepend(el);
  while(box.children.length>3) box.lastChild.remove();
  setTimeout(()=>el.remove(), ms||(kind==='bad'?7500:5200));
}

function openModal(html, onClose, wide, reopen){

}

  const root=$('#modalRoot'); if(!root.innerHTML) return;

function startDay(d){

  hud(); render(); hint([`Hari ${d+1} dimulai · pos lobi dibuka`,`Day ${d+1} begins · lobby desk open`]);
  const n=DAYS[d].steps.filter(s=>s.t==='v').length;
  toast('info',[`Hari ${d+1} · ${DAYS[d].label[0]}`,`Day ${d+1} · ${DAYS[d].label[1]}`], [`${n} tamu akan datang. Periksa daftar janji temu di meja kanan bawah.`,`${n} visitors are coming. Check the appointment list at the bottom right of the desk.`]);
  setTimeout(next,1500);
}

function decide(choice){

    if(v.answer==='tolak'){ ok=false; viol(['Akses diberikan kepada pihak tak berwenang','Access given to an unauthorized person'], v.why); }
    else if(choice!==v.answer){ ok=false; viol(['Tingkat kartu salah: '+TIERS[choice].label[0],'Wrong card level: '+TIERS[choice].label[1]], v.why); }
    const miss=[]; if(!f.docs) miss.push(['periksa dokumen','document check']); if(!f.verify) miss.push(['verifikasi','verification']); if(!f.book) miss.push(['buku tamu','guest book']);
    if(miss.length){ ok=false; viol(['Langkah SOP terlewat','Skipped SOP step'],['Kartu diberikan sebelum: '+miss.map(m=>m[0]).join(', ')+'. Urutan SOP wajib diikuti untuk setiap tamu.','Card issued before: '+miss.map(m=>m[1]).join(', ')+'. The SOP sequence is required for every visitor.']); }
  }
  S.res.push({kind:'tamu', ok});
  if(ok) toast('good', choice==='tolak'?['Penolakan tepat','Correct refusal']:['Kartu tepat · '+TIERS[choice].label[0],'Correct card · '+TIERS[choice].label[1]], v.why);
  const granted=choice!=='tolak';
  bubble(granted?['Terima kasih, Pak.','Thank you, sir.']:(v.answer==='tolak'?(v.rejectLine||['Baik, Pak. Saya mengerti.','All right, I understand.']):['Lho, saya kan sudah ada janji…','But I do have an appointment…']));
  if(granted){ v.look.lanyard=TIERS[choice].color; $('#visitor').innerHTML=figure(v.look); }
  hud();
  setTimeout(()=>{
    bubble(null); $('#objDocs').style.display='none';
    if(granted) setGate(true);
    placeVisitor(granted?'gate':'door',0,true);
    setTimeout(()=>{ delete v.look.lanyard; setGate(false); S.v=null; S.mode='idle'; S.clock+=25; hud(); render(); hint(['Menunggu tamu berikutnya','Waiting for the next visitor']); setTimeout(next,700); },1250);
  },1700);
}

function judgePoint(k,saysBad,redraw){
  const P=S.patrol, isBad=!!P.issues[k], ok=saysBad===isBad, p=POINTS[k];

  if(ok) toast('good', isBad?['Temuan dicatat · '+p.name[0],'Finding logged · '+p.name[1]]:['Normal · '+p.name[0],'Normal · '+p.name[1]], isBad?p.issue:['Kondisi sesuai checklist.','Condition matches the checklist.']);
  else viol(isBad?['Temuan terlewat saat patroli','Finding missed on patrol']:['Temuan keliru saat patroli','False finding on patrol'], isBad?p.issue:[`${p.name[0]} dalam kondisi normal: ${p.crit[0]}`,`${p.name[1]} was normal: ${p.crit[1]}`]);
  S.res.push({kind:'patrol', ok});
  redraw();
}

  ()=>`<div class="eb">${t('Patroli &amp; CCTV','Patrol &amp; CCTV')}</div><h2>${t('Pemantauan sesuai kebutuhan','Monitoring when it is needed')}</h2>
    <div class="cols">
      <div><b>${t('Patroli titik vital','Vital point patrol')}</b><br>${t('Saat jadwal patroli, minta rekan menjaga pos lewat HT dulu. Pos tidak boleh kosong. Periksa ruang server, panel listrik, pintu darurat, ruang arsip, dan APAR, lalu tandai Normal atau Temuan.','At patrol time, first ask a colleague over the radio to cover the desk. The desk must never be empty. Check the server room, electrical panel, fire exit, archive room and extinguisher, then mark each Normal or Finding.')}</div>
      <div><b>${t('Pengecekan CCTV','CCTV checks')}</b><br>${t('Saat ada laporan lewat HT, buka monitor CCTV, pilih kamera yang sesuai laporan, lalu putuskan: laporkan temuan atau nyatakan aman. Jangan eskalasi tanpa bukti.','When a radio report comes in, open the CCTV monitor, pick the camera that matches the report, then decide: report a finding or declare all clear. Don\'t escalate without evidence.')}</div>
    </div>
    <p class="crit" style="margin-top:14px"><b>${t('Kontrol:','Controls:')}</b> ${t('klik benda di meja atau tekan angka 1–5 pada panel bawah. Esc untuk batal atau menutup jendela. Ganti bahasa dengan tombol ID/EN di kanan atas.','click objects on the desk or press 1–5 for the bottom panel. Esc cancels or closes a window. Switch language with the ID/EN buttons at the top right.')}</p>`
];
function openBrief(page){
  let i=typeof page==='number'?page:0;
  const sh=openModal('', ()=>{ if(!S.started){ S.started=true; startDay(0); } }, 980, ()=>openBrief(i));
  const draw=()=>{
    const lastPage=i===BRIEF.length-1;
    sh.innerHTML=`<div class="lang x" role="group" aria-label="Bahasa / Language">${['id','en'].map(l=>`<button type="button" data-lang="${l}" aria-pressed="${l===LANG}">${l.toUpperCase()}</button>`).join('')}</div>
      <div class="brief">${BRIEF[i]()}</div>
      <div class="row"><div class="dots grow">${BRIEF.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
      ${i?`<button class="btn" type="button" id="bfPrev">${t('Kembali','Back')}</button>`:''}
      <button class="btn primary" type="button" id="bfNext">${lastPage?(S.started?t('Tutup briefing','Close briefing'):t('Mulai shift · Hari 1','Start shift · Day 1')):t('Lanjut','Next')}</button></div>`;
    sh.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
    const pv=sh.querySelector('#bfPrev'); if(pv) pv.onclick=()=>{i--; draw();};
    sh.querySelector('#bfNext').onclick=()=>{ if(lastPage) closeModal(); else { i++; draw(); } };
    sh.querySelector('#bfNext').focus({preventScroll:true});
    sh.scrollTop=0;
  };
  draw();
}

/* ---------- Language switch ---------- */
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{ const [a,b]=el.dataset.t.split('|'); el.textContent=LANG==='en'?b:a; });
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===LANG)));
}
function setLang(l){
  if(l===LANG) return;
  LANG=l; try{ localStorage.setItem('posjaga-lang',l); }catch(e){}
  applyStatic(); hud(); render();
  if(S.bubble) bubble(S.bubble);
  if(S.hint) hint(S.hint);
  // rebuild an open window in the new language, keeping its close handler
  if(modalOpen() && modalReopen){ const r=modalReopen, c=modalClose; closeModal(true); r(); if(c) modalClose=c; }
}
document.querySelectorAll('.hud .lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* ---------- Scene object wiring ---------- */
const OBJ_ACT = {
  sop:()=>openBrief(0), list:openList, docs:()=>S.v&&openDocs(),
  book:openBook,
  phone:()=>S.mode==='visitor'?openPhone():toast('info',['Telepon internal','Internal phone'],['Tidak ada tamu yang perlu diverifikasi.','No visitor to verify.']),
  cards:()=>{ if(S.mode==='visitor'){ S.mode='cards'; render(); } else if(S.mode!=='cards') toast('info',['Rak kartu akses','Access card rack'],['Kartu hanya diberikan kepada tamu yang sudah diverifikasi.','Cards are only issued to verified visitors.']); },
  cctv:openCctv,
  ht:()=>S.mode==='alert'?replayRadio():handover(),
  patrol:startPatrol
};
document.querySelectorAll('#scene .obj').forEach(g=>{
  const k=g.dataset.obj;
  g.addEventListener('click',()=>{ if(!modalOpen()) OBJ_ACT[k](); });
  g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); OBJ_ACT[k](); } });
  g.addEventListener('mouseenter',()=>{ S.hover=k; showInfo(); });
  g.addEventListener('mouseleave',()=>{ S.hover=null; showInfo(); });
  g.addEventListener('focus',()=>{ S.hover=k; showInfo(); });
  g.addEventListener('blur',()=>{ S.hover=null; showInfo(); });
});
$('#btnSop').onclick=()=>openBrief(0);
document.addEventListener('keydown',e=>{
  if(modalOpen()){ if(e.key==='Escape') closeModal(); return; }
  if(e.key==='Escape' && S.mode==='cards'){ S.mode='visitor'; render(); return; }
  const n=parseInt(e.key,10);
  if(n>=1 && n<=9){ const a=actionsFor()[n-1]; if(a){ e.preventDefault(); a.fn(); } }
});

applyStatic(); hud(); render(); hint(['Briefing pagi sebelum shift','Morning briefing before your shift']); openBrief(0);
</script>
