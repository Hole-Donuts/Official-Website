<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulasi Audit Lapangan: a first-person field internal audit training game by Ihsan Mahendra · Holy Doughnut Studio. Enter each area with the right PPE and an escort, inspect fire extinguishers, exits, panels and more, photograph findings, confirm them on site and rate the area. English and Bahasa Indonesia.">
<meta name="author" content="Ihsan Mahendra">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Simulasi Audit Lapangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@700&display=swap">
<style>
/* Layout: first-person field auditor. The area in front of you on top, your clipboard below, the SOP on the side. */
:root{
  --wall:#dfe2d8; --wall-2:#c4c9bd; --floor:#9fa49a; --floor-2:#8b9087;
  --paper:#fbfaf4; --paper-2:#f1eee2; --paper-ink:#1f2638; --paper-mute:#5d6475; --paper-line:#d8d3c2;
  --board:#7c5a3a; --board-2:#694a2e;
  --ink:#1d2433; --mute:#535b6b; --surface:#f4f6f2; --line:#c3cabf;
  --accent:#2a4a8b; --accent-ink:#ffffff; --hi:#f3d54a;
  --ok:#2f7a4c; --ok-bg:#e3f1e7; --bad:#b0281f; --bad-bg:#f8e3e0;
  --shadow:0 1px 0 rgba(0,0,0,.08),0 6px 14px rgba(40,25,10,.22);
  --f-display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#2a302b; --wall-2:#222823; --floor:#3a3f39; --floor-2:#323731;
  --paper:#e8e4d6; --paper-2:#dcd7c6; --paper-ink:#1f2638; --paper-mute:#4f5566; --paper-line:#c4bea9;
  --board:#4a3523; --board-2:#3c2b1c;
  --ink:#e6eae4; --mute:#a3ab9f; --surface:#161b18; --line:#3a443e;
  --accent:#8fb0f0; --accent-ink:#0f1a30; --hi:#e8c93c;
  --ok:#7fd29d; --ok-bg:#1d3326; --bad:#ff8e84; --bad-bg:#3d1f1c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --wall:#2a302b; --wall-2:#222823; --floor:#3a3f39; --floor-2:#323731;
  --paper:#e8e4d6; --paper-2:#dcd7c6; --paper-ink:#1f2638; --paper-mute:#4f5566; --paper-line:#c4bea9;
  --board:#4a3523; --board-2:#3c2b1c;
  --ink:#e6eae4; --mute:#a3ab9f; --surface:#161b18; --line:#3a443e;
  --accent:#8fb0f0; --accent-ink:#0f1a30; --hi:#e8c93c;
  --ok:#7fd29d; --ok-bg:#1d3326; --bad:#ff8e84; --bad-bg:#3d1f1c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--surface);color:var(--ink);font:16px/1.45 var(--f-body);padding:0 16px 24px}
button{font:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible,.spot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;max-width:1180px;margin:0 auto}
.hud h1{font:700 1.35rem/1 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.hud .sp{flex:1}
.stat{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.lbl{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.qa{display:flex;gap:5px}
.qa i{width:14px;height:14px;border-radius:50%;border:2px solid var(--bad);display:block}
.qa i.on{background:var(--bad)}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:6px;font-size:.88rem}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--hi);color:#1d2433;border-color:var(--hi)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--mute);padding:6px 10px;font-size:.82rem;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.room{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
@media (max-width:900px){.room{grid-template-columns:minmax(0,1fr)}}
.view{align-self:start;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-width:0}

/* ---- The area in front of you ---- */
.scene{position:relative;height:360px;background:linear-gradient(var(--wall) 0 72%,var(--wall-2) 72% 73%,var(--floor) 73%);overflow:hidden}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:27%;background:repeating-linear-gradient(90deg,transparent 0 78px,var(--floor-2) 78px 80px);opacity:.6;pointer-events:none}
.plate{position:absolute;right:14px;top:12px;background:var(--accent);color:var(--accent-ink);font:700 .78rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:4px;box-shadow:var(--shadow);z-index:2}
.bubble{position:absolute;left:12px;top:12px;max-width:min(440px,calc(100% - 170px));background:var(--paper);color:var(--paper-ink);padding:9px 12px;border-radius:12px 12px 12px 2px;box-shadow:var(--shadow);font-size:.92rem;z-index:3}
.bubble small{display:block;font:600 .66rem var(--f-doc);color:var(--paper-mute);margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
.person{position:absolute;right:8px;bottom:0;width:140px;transition:transform .45s ease,opacity .45s ease;z-index:1}
.person.out{transform:translateX(140%);opacity:0}
.badge{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);font:600 .58rem/1.2 var(--f-doc);padding:3px 6px;border-radius:3px;white-space:nowrap;border-top:4px solid var(--accent);text-align:center;display:grid;gap:1px}
.badge b{font-size:.64rem}
.badge.guard{border-top-color:#333}
/* door view (step 1) */
.door{position:absolute;left:50%;bottom:27%;width:160px;height:180px;transform:translateX(-50%)}
.door svg{width:100%;height:100%;display:block}
.apd-sign{position:absolute;left:calc(50% - 230px);bottom:calc(27% + 20px);width:120px;background:#fff;color:#1d2433;border-radius:4px;box-shadow:var(--shadow);overflow:hidden;font:600 .66rem/1.25 var(--f-body)}
.apd-sign b{display:block;background:#1d5fae;color:#fff;font:700 .7rem var(--f-display);letter-spacing:.06em;text-align:center;padding:4px 2px}
.apd-sign ul{list-style:none;margin:0;padding:5px 6px;display:grid;gap:3px}
.apd-sign li{display:flex;gap:5px;align-items:center}
.apd-sign li i{font-style:normal;width:16px;height:16px;border-radius:50%;background:#1d5fae;color:#fff;display:inline-grid;place-items:center;font-size:.6rem;flex:0 0 16px}
/* inspection points (step 2+) */
.spots{position:absolute;left:8px;right:150px;bottom:8px;height:220px;display:flex;justify-content:space-around;align-items:flex-end;gap:4px;z-index:2}
.spot{all:unset;cursor:pointer;flex:1 1 0;max-width:118px;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;position:relative;border-radius:8px;padding:2px}
.spot svg{width:100%;flex:1 1 auto;min-height:0}
.spot .tag{font:600 .62rem/1.15 var(--f-doc);background:var(--paper);color:var(--paper-ink);padding:2px 5px;border-radius:3px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot:hover{background:color-mix(in srgb,var(--hi) 18%,transparent)}
.spot[aria-pressed="true"]{background:color-mix(in srgb,var(--hi) 30%,transparent);outline:3px solid var(--hi)}
.spot .st{position:absolute;bottom:26px;right:2px;z-index:1;min-width:22px;height:22px;border-radius:11px;padding:0 5px;display:grid;place-items:center;font:700 .72rem var(--f-doc);background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow)}
.spot .st.ok{background:var(--ok);color:#fff}.spot .st.bad{background:var(--bad);color:#fff}
.spot.disabled{cursor:default}
.spot.disabled:hover{background:transparent}
@media (max-width:640px){
  .scene{height:380px}
  .person{width:96px}
  .spots{right:0;left:0;height:200px}
  .scene.walk .person,.scene.conf .person,.scene.close .person{display:none}
  .bubble{max-width:calc(100% - 24px);top:44px}
  .door{transform:translateX(-50%);width:150px;height:180px}
  .apd-sign{left:10px;bottom:calc(27% + 10px);width:108px}
}

.desk{background:repeating-linear-gradient(92deg,var(--board) 0 38px,var(--board-2) 38px 40px,var(--board) 40px 96px);padding:18px 16px 16px;border-top:6px solid var(--board-2)}
.papers{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:3px;box-shadow:var(--shadow);padding:12px 14px;flex:1 1 250px;min-width:0;font-family:var(--f-doc);font-size:.8rem;position:relative}
.paper.wide{flex-basis:340px}
.paper h3{font:700 .95rem/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--paper-ink)}
.paper .row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:6px;padding:3px 0;border-bottom:1px dashed var(--paper-line)}
.paper .row span:first-child{color:var(--paper-mute)}
.paper .row span:last-child{overflow-wrap:anywhere}
.paper.tilt-l{transform:rotate(-.5deg)}.paper.tilt-r{transform:rotate(.6deg)}
.paper ul{margin:0;padding:0;list-style:none}
.paper li{padding:4px 0;border-bottom:1px dashed var(--paper-line);display:flex;gap:8px;align-items:baseline}
.paper p{margin:6px 0 0}
.std{margin-top:8px;padding:6px 8px;background:var(--paper-2);border-left:4px solid var(--accent);font-size:.74rem}
.std b{display:block;font-family:var(--f-body);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.std ul li{border:0;padding:1px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--paper-mute);background:transparent;color:var(--paper-ink);border-radius:99px;padding:4px 11px;font:600 .74rem var(--f-body)}
.chip[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.chip.okc[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.badc[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.cam[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cl button{all:unset;cursor:pointer;display:flex;gap:8px;width:100%;align-items:baseline}
.cl button:focus-visible{outline:2px solid var(--accent)}
.cl .mk{width:22px;flex:0 0 22px;text-align:center;font:700 1.15rem/1 var(--f-hand)}
.cl .mk.ok{color:var(--ok)}.cl .mk.bad{color:var(--bad)}
.cl li.cur{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.cl small{margin-left:auto;color:var(--paper-mute);white-space:nowrap}
.stamp{position:absolute;right:10px;top:8px;font:700 .78rem var(--f-display);letter-spacing:.1em;border:2px solid currentColor;padding:1px 6px;transform:rotate(-8deg);text-transform:uppercase;color:var(--accent)}
.sig{font:700 1.35rem/1 var(--f-hand);color:var(--accent)}
.sig.none{font:italic .8rem var(--f-doc);color:var(--paper-mute)}
.empty-note{font-family:var(--f-body);font-size:.9rem;color:var(--paper-mute)}

.bar{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.act{border:0;border-radius:7px;padding:11px 16px;font-weight:700;font-size:.93rem;background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow);text-align:left;flex:1 1 200px}
.act:hover:not(:disabled){outline:2px solid var(--hi)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act small{display:block;font-weight:400;font-size:.76rem;color:var(--paper-mute)}
.verdict{flex:1 1 100%;border-radius:8px;padding:12px 14px;background:var(--ok-bg);color:var(--ink);border-left:6px solid var(--ok)}
.verdict.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.verdict h4{margin:0 0 4px;font:700 1rem var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--ok)}
.verdict.bad h4{color:var(--bad)}
.verdict p{margin:4px 0;max-width:72ch}
.verdict ul{margin:6px 0 0;padding-left:18px}
.next{border:0;border-radius:7px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}

.sop{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-self:start;min-width:0}
.sop h2{font:700 1.05rem var(--f-display);margin:0 0 4px;letter-spacing:.02em}
.sop p{margin:0 0 10px;font-size:.84rem;color:var(--mute)}
.sop ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.sop li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:.86rem;padding:7px 8px;border-radius:6px}
.sop li::before{content:counter(s);font:700 .85rem/24px var(--f-display);text-align:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);color:var(--mute)}
.sop li.cur{background:color-mix(in srgb,var(--hi) 28%,transparent)}
.sop li.cur::before{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sop li.done::before{content:"✓";color:var(--ok);border-color:var(--ok)}
.sop li span{color:var(--mute)}
.sop li span b{display:block;color:var(--ink)}
.queue{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.queue i{font-style:normal;font:600 .72rem var(--f-doc);padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.queue i.ok{border-color:var(--ok);color:var(--ok)}
.queue i.bad{border-color:var(--bad);color:var(--bad)}
.queue i.now{border-color:var(--ink);color:var(--ink);background:color-mix(in srgb,var(--hi) 30%,transparent)}

.hint{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:10px 12px 10px 44px;margin-bottom:14px;position:relative;font-size:.9rem;box-shadow:var(--shadow);border:2px dashed var(--hi)}
.hint::before{content:"?";position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--hi);color:#1d2433;font:700 .95rem/24px var(--f-display);text-align:center}
.hint>b{display:block;font-family:var(--f-display);letter-spacing:.03em;text-transform:uppercase;font-size:.8rem;margin-bottom:2px}
.hint ol{margin:4px 0 0;padding-left:18px}
.hint p{margin:2px 0;max-width:80ch}
.hint-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hint-acts button{border:1px solid var(--paper-ink);background:var(--paper-ink);color:var(--paper);border-radius:6px;padding:5px 10px;font-weight:600;font-size:.8rem}

.end{position:fixed;inset:0;background:rgba(10,14,12,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.end .card{background:var(--paper);color:var(--paper-ink);max-width:620px;width:100%;max-height:calc(100% - 32px);overflow:auto;border-radius:6px;padding:22px;box-shadow:var(--shadow);font-family:var(--f-body)}
.end h2{font:700 1.8rem/1.1 var(--f-display);margin:0 0 6px;text-wrap:balance}
.end .big{font:700 1.1rem var(--f-doc);margin:0 0 12px}
.end ol{padding-left:20px;font-size:.88rem;margin:10px 0 16px}
.end li{margin-bottom:6px}
.end .x{color:var(--bad);font-weight:700}.end .v{color:var(--ok);font-weight:700}
.end .next{background:var(--paper-ink);color:var(--paper)}

.tour{position:fixed;inset:0;z-index:10}
.tour .dim{position:fixed;inset:0;background:rgba(8,12,10,.62)}
.tour .spotl{position:fixed;border-radius:10px;box-shadow:0 0 0 4px var(--hi),0 0 0 9999px rgba(8,12,10,.62);pointer-events:none;transition:all .25s ease}
.tour .tip{position:fixed;width:min(380px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:16px 18px;box-shadow:0 12px 30px rgba(0,0,0,.4);border-top:6px solid var(--hi)}
.tour .tip.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px))}
.tour .tip h3{font:700 1.25rem/1.15 var(--f-display);margin:0 0 6px;text-wrap:balance}
.tour .tip p{margin:0 0 8px;font-size:.93rem}
.tour .nav{display:flex;align-items:center;gap:8px;margin-top:10px}
.tour .nav .count{flex:1;font:600 .75rem var(--f-doc);color:var(--paper-mute)}
.tour .nav button{border:1px solid var(--paper-mute);background:transparent;color:var(--paper-ink);border-radius:6px;padding:7px 12px;font-weight:600}
.tour .nav button.pri{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.tour .tip ol,.gbody ol{margin:0 0 8px;padding-left:20px;font-size:.9rem}
.tour .tip li,.gbody li{margin-bottom:3px}
.mx{border-collapse:collapse;width:100%;font-size:.82rem;margin:6px 0 10px}
.mx th,.mx td{border:1px solid var(--paper-line);padding:5px 7px;text-align:left;vertical-align:top}
.mx th{background:var(--paper-2);font-weight:700}
.mx ul{margin:0;padding-left:16px}
.gwrap{position:fixed;inset:0;z-index:9;background:rgba(8,12,10,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.gcard{background:var(--paper);color:var(--paper-ink);width:100%;max-width:760px;max-height:calc(100% - 32px);display:flex;flex-direction:column;border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.4);border-top:6px solid var(--accent);overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.ghead h2{flex:1;margin:0;font:700 1.35rem/1.1 var(--f-display)}
.gx{border:1px solid var(--paper-mute);background:transparent;color:var(--paper-ink);border-radius:6px;padding:5px 10px;font-weight:600}
.gtabs{display:flex;gap:4px;padding:6px 18px 0;overflow-x:auto;border-bottom:1px solid var(--paper-line)}
.gtabs button{border:0;background:transparent;color:var(--paper-mute);padding:8px 10px;font-weight:700;font-size:.84rem;white-space:nowrap;border-bottom:3px solid transparent}
.gtabs button[aria-selected="true"]{color:var(--paper-ink);border-bottom-color:var(--hi)}
.gbody{padding:12px 18px 20px;overflow:auto;font-size:.92rem}
.gbody h3{font:700 .95rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
.gbody h3:first-child{margin-top:4px}
.gbody p{margin:0 0 8px;max-width:70ch}
.gbody dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:0 0 8px;font-size:.88rem}
.gbody dt{font-weight:700}.gbody dd{margin:0}
@media (max-width:520px){.gbody dl{grid-template-columns:minmax(0,1fr)}.gbody dd{margin-bottom:6px}}
@media (prefers-reduced-motion:reduce){.person,.tour .spotl{transition:none}}
</style>
</head>
<body>
<header class="hud">
  <h1 id="t-h1">Simulasi Audit Lapangan</h1>
  <div class="stat"><span class="lbl" id="t-area">Area</span><b id="hud-n">1/4</b></div>
  <div class="stat"><span class="lbl" id="t-date">Tanggal</span><b id="hud-date"></b></div>
  <div class="stat" id="qa-stat"><span class="lbl" id="t-qa">Catatan QA</span><div class="qa" id="hud-qa"></div></div>
  <div class="sp"></div>
  <button class="btn" id="tour-btn" type="button">Tutorial</button>
  <button class="btn" id="guide-btn" type="button">Panduan</button>
  <button class="btn" id="hint-btn" type="button" aria-pressed="true">Petunjuk</button>
  <button class="btn" id="restart" type="button">Ulang dengan skenario baru</button>
  <div class="lang" role="group" aria-label="Bahasa / Language"><button type="button" data-lang="id" aria-pressed="true" lang="id">ID</button><button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button></div>
</header>

<main class="room">
  <section class="view" aria-live="polite">

function itemTable(){
  const h=LANG==='en'?['Point','Risk','Standard']:['Titik','Risiko','Standar'];
  return `<table class="mx"><tr><th>${h[0]}</th><th>${h[1]}</th><th>${h[2]}</th></tr>${Object.values(ITEMS).map(it=>`<tr><td>${tx(it.n)}</td><td>${L().risk[it.risk]}</td><td><ul>${it.std.map(s=>`<li>${tx(s)}</li>`).join('')}</ul></td></tr>`).join('')}</table>`;
}
function apdTable(){
  const h=LANG==='en'?['Area','Required PPE (base)']:['Area','APD wajib (dasar)'];
  return `<table class="mx"><tr><th>${h[0]}</th><th>${h[1]}</th></tr>${Object.values(AREAS).map(a=>`<tr><td>${tx(a.n)}</td><td>${a.apd.length?a.apd.map(k=>tx(APD[k].n)).join(', '):tx(['Tidak ada','None'])}</td></tr>`).join('')}</table>`;
}
ID.guide=()=>[
 ['Alur audit lapangan',`<h3>Apa itu audit lapangan?</h3><p>Audit lapangan (<i>field audit</i> atau inspeksi) adalah bagian audit internal yang memeriksa <b>kondisi fisik</b> langsung di lokasi: peralatan keselamatan, jalur evakuasi, instalasi listrik, penyimpanan barang dan bahan kimia. Dokumen bisa bilang "APAR diperiksa rutin", tapi hanya kunjungan ke lapangan yang membuktikannya.</p>
  <h3>Alur lengkap</h3><ol><li><b>Perencanaan.</b> SPI memilih area berisiko dan menyiapkan checklist.</li><li><b>Penugasan.</b> Kepala SPI menerbitkan surat tugas. Audit lapangan biasanya <b>tanpa pemberitahuan</b>.</li><li><b>Masuk area.</b> Auditor memakai APD sesuai rambu dan didampingi PIC.</li><li><b>Observasi &amp; dokumentasi.</b> Setiap titik dibandingkan dengan standar, temuan difoto.</li><li><b>Konfirmasi.</b> Temuan ditunjukkan ke PIC dan ditandatangani di berita acara.</li><li><b>Simpulan &amp; exit meeting.</b> Temuan dinilai risikonya, area diberi rating.</li><li><b>Tindak lanjut.</b> PIC memperbaiki sesuai tenggat; SPI memeriksa ulang.</li></ol><p>Game ini melatih langkah 3 sampai 6.</p>
  <h3>Siapa saja yang terlibat</h3><dl><dt>Auditor (kamu)</dt><dd>Memeriksa kondisi nyata dan menyimpulkan berdasarkan bukti.</dd><dt>PIC area</dt><dd>Penanggung jawab area. Mendampingi, menjelaskan, dan menandatangani berita acara.</dd><dt>Kepala SPI</dt><dd>Menugaskan auditor.</dd><dt>QA</dt><dd>Memeriksa apakah auditor mengikuti prosedur. 3 catatan QA berarti audit dihentikan.</dd></dl>`],
 ['1 · Masuk area',`<h3>APD sesuai rambu</h3><p>Auditor tunduk pada aturan K3 area yang diperiksa, sama seperti karyawan dan tamu. Rambu WAJIB APD di setiap pintu bisa berbeda dari hari ke hari, jadi selalu baca rambunya.</p>${apdTable()}<h3>Didampingi PIC</h3><p>PIC tahu bahaya di areanya, bisa langsung menjelaskan kondisi, dan menjadi saksi temuan. Kalau PIC tidak ada, minta pendamping pengganti. Jangan masuk sendiri.</p><h3>Tanpa pemberitahuan</h3><p>Tujuan audit lapangan adalah melihat kondisi sehari-hari. Permintaan menunda supaya "dirapikan dulu" ditolak dengan sopan. Penundaan hanya untuk alasan sah, misalnya keadaan darurat di area.</p>`],
 ['2 · Observasi',`<h3>Cara kerja</h3><ol><li>Periksa <b>setiap</b> titik di checklist. Jangan melewatkan titik karena PIC bilang "sudah dicek".</li><li>Bandingkan setiap baris dengan standar. Satu baris tidak sesuai sudah cukup menjadi temuan.</li><li>Foto setiap temuan. Foto adalah bukti kondisi saat itu.</li><li>Jangan mencatat temuan tanpa dasar. Temuan yang salah merugikan auditee.</li></ol><h3>Standar setiap titik</h3>${itemTable()}`],
 ['3 · Konfirmasi',`<h3>Berita acara observasi</h3><p>Temuan ditunjukkan ke PIC dengan fotonya, lalu ditandatangani kedua pihak <b>di lokasi</b>. Ini mencegah bantahan di kemudian hari.</p><table class="mx"><tr><th>Situasi</th><th>Sikap benar</th></tr><tr><td>PIC langsung memperbaiki dan minta tidak dicatat</td><td>Tetap catat, beri keterangan "sudah diperbaiki di tempat"</td></tr><tr><td>PIC menolak tanda tangan</td><td>Catat penolakan di berita acara, temuan tetap</td></tr><tr><td>PIC menawarkan makanan, voucher, atau hadiah</td><td>Tolak dengan sopan dan laporkan ke Unit Pengendalian Gratifikasi</td></tr></table>`],
 ['4 · Simpulan',`<h3>Kelas risiko</h3><dl><dt>Tinggi</dt><dd>Bisa langsung memicu kebakaran, ledakan, sengatan listrik, atau menghambat evakuasi: APAR, pintu darurat, panel listrik, stopkontak, detektor asap, tabung gas.</dd><dt>Sedang</dt><dd>Lainnya: P3K, rak barang, bahan kimia, rak server.</dd></dl><h3>Rating area</h3><table class="mx"><tr><th>Temuan</th><th>Rating</th><th>Tenggat tindak lanjut</th></tr><tr><td>Tidak ada</td><td>Memadai</td><td>—</td></tr><tr><td>Hanya risiko Sedang</td><td>Perlu perbaikan</td><td>30 hari</td></tr><tr><td>Ada risiko Tinggi</td><td>Tidak memadai</td><td>7 hari</td></tr></table><h3>Isi temuan di laporan</h3><dl><dt>Kondisi</dt><dd>Apa yang dilihat (dengan foto).</dd><dt>Kriteria</dt><dd>Standar yang berlaku.</dd><dt>Akibat</dt><dd>Risikonya.</dd><dt>Rekomendasi</dt><dd>Perbaikan dan tenggatnya.</dd></dl>`]
];
EN.guide=()=>[
 ['Field audit flow',`<h3>What is a field audit?</h3><p>A field audit (or inspection) is the part of internal audit that checks <b>physical conditions</b> on site: safety equipment, escape routes, electrical installations, storage of goods and chemicals. A document can say "extinguishers are checked regularly", but only a visit proves it.</p>
  <h3>The full flow</h3><ol><li><b>Planning.</b> Internal Audit picks risky areas and prepares a checklist.</li><li><b>Assignment.</b> The Head of Internal Audit issues an assignment letter. Field audits are usually <b>unannounced</b>.</li><li><b>Entering the area.</b> The auditor wears the PPE on the sign and is escorted by the PIC.</li><li><b>Observation &amp; documentation.</b> Every point is compared with the standard and findings are photographed.</li><li><b>Confirmation.</b> Findings are shown to the PIC and signed on an observation record.</li><li><b>Conclusion &amp; closing meeting.</b> Findings are weighed by risk and the area is rated.</li><li><b>Follow-up.</b> The PIC fixes the issues by the deadline; Internal Audit checks again.</li></ol><p>This game trains steps 3 to 6.</p>
  <h3>Who is involved</h3><dl><dt>Auditor (you)</dt><dd>Checks real conditions and concludes on evidence.</dd><dt>Area PIC</dt><dd>The person in charge of the area. Escorts you, explains, and signs the record.</dd><dt>Head of Internal Audit</dt><dd>Assigns auditors.</dd><dt>QA</dt><dd>Checks that auditors follow procedure. 3 QA notes stop the audit.</dd></dl>`],
 ['1 · Entering',`<h3>PPE per the sign</h3><p>Auditors follow the safety rules of the area they inspect, like employees and visitors. The PPE REQUIRED sign at each door can change from day to day, so always read it.</p>${apdTable()}<h3>Escorted by the PIC</h3><p>The PIC knows the hazards of the area, can explain conditions on the spot and witnesses the findings. If the PIC is away, ask for a stand-in. Never go in alone.</p><h3>Unannounced</h3><p>A field audit aims to see everyday conditions. A request to postpone "so we can tidy up" is politely declined. Postpone only for a valid reason, such as an emergency in the area.</p>`],
 ['2 · Observing',`<h3>How to work</h3><ol><li>Inspect <b>every</b> point on the checklist. Don't skip one because the PIC says "it's been checked".</li><li>Compare each line with the standard. One line out of standard is enough for a finding.</li><li>Photograph every finding. The photo is evidence of the condition at that moment.</li><li>Don't record findings without grounds. A wrong finding is unfair to the auditee.</li></ol><h3>Standard for each point</h3>${itemTable()}`],
 ['3 · Confirming',`<h3>Observation record</h3><p>Findings are shown to the PIC with their photos and signed by both sides <b>on site</b>. This prevents disputes later.</p><table class="mx"><tr><th>Situation</th><th>Right response</th></tr><tr><td>The PIC fixes it on the spot and asks you not to record it</td><td>Record it anyway, noted "fixed on the spot"</td></tr><tr><td>The PIC refuses to sign</td><td>Record the refusal on the record; the finding stays</td></tr><tr><td>The PIC offers food, vouchers or gifts</td><td>Politely refuse and report it to the Ethics Officer</td></tr></table>`],
 ['4 · Concluding',`<h3>Risk classes</h3><dl><dt>High</dt><dd>Can directly cause a fire, explosion or electric shock, or block an evacuation: extinguishers, emergency exits, electrical panels, power outlets, smoke detectors, gas cylinders.</dd><dt>Medium</dt><dd>Everything else: first aid boxes, storage racks, chemicals, server racks.</dd></dl><h3>Area rating</h3><table class="mx"><tr><th>Findings</th><th>Rating</th><th>Follow-up deadline</th></tr><tr><td>None</td><td>Satisfactory</td><td>—</td></tr><tr><td>Medium risk only</td><td>Needs improvement</td><td>30 days</td></tr><tr><td>Any High risk</td><td>Unsatisfactory</td><td>7 days</td></tr></table><h3>What a finding contains</h3><dl><dt>Condition</dt><dd>What you saw (with a photo).</dd><dt>Criteria</dt><dd>The standard that applies.</dd><dt>Effect</dt><dd>The risk.</dd><dt>Recommendation</dt><dd>The fix and its deadline.</dd></dl>`]
];

function makeArea(k,t,taken){
  const A=AREAS[k];
  let nm; do{nm=pick(NAMES)}while(taken.has(nm[0])); taken.add(nm[0]);
  const items=A.items.map(type=>{const it=ITEMS[type], f=chance(.35)?pick(it.faults):null; return {t:type,f,p:it.make(f,t,k)};});
  // most areas should have something to find; the extinguisher is the usual suspect
  if(items.every(i=>!i.f)&&chance(.7)){ const i=chance(.5)?0:1+rnd(items.length-1), it=ITEMS[items[i].t]; items[i].f=pick(it.faults); items[i].p=it.make(items[i].f,t,k); }
  const apd=A.apd.slice(); if(chance(.3)){ const extra=APD_KEYS.filter(x=>!apd.includes(x)); apd.push(pick(extra)); }
  const scen=pick(['normal','normal','normal','short','postpone','absent']);
  return {k,pic:{name:nm[0],look:{skin:pick(SKIN),shirt:pick(SHIRT),hair:pick(HAIR),hijab:nm[1]==='f'&&chance(.5),glasses:chance(.3)}},
    guard:{skin:pick(SKIN),shirt:'#2b2f38',hair:pick(HAIR),hijab:false,glasses:false},
    items:shuffle(items), apd, scen, ev:pick(['none','none','fix','refuse','gift','gift']), stN:String(rnd(80)+10).padStart(3,'0')};
}
function newRun(){
  let today; do{ today={y:2026,m:pick([8,9,10]),d:1+rnd(28)}; }while([0,6].includes(new Date(today.y,today.m-1,today.d).getDay()));  // audits happen on working days
  const taken=new Set();
  const areas=shuffle(AREA_KEYS).slice(0,N_AREA).map(k=>makeArea(k,today,taken));
  return {v:1,today,areas,idx:0,phase:'brief',qa:0,apd:[],escort:false,sel:-1,marks:[],photos:[],recorded:[],fb:null,log:[],results:[],over:null};
}

let tour=null, guideTab=-1;

  const all=L().tour; const idx=all.map((x,i)=>i).filter(i=>!all[i].t||document.querySelector(all[i].t)); if(!idx.length) return;

function drawTour(){
  const T=L().ui, st=L().tour[tour.idx[tour.i]], last=tour.i===tour.idx.length-1;
  if(st.t==='#hint'&&!HINT_ON){HINT_ON=true;applyHint();}

}
function placeTour(){
  if(!tour) return; const st=L().tour[tour.idx[tour.i]]; if(!st.t) return;
  const el=document.querySelector(st.t); if(!el) return; const r=el.getBoundingClientRect();
  const sp=$('tour').querySelector('.spotl'), tip=$('tour').querySelector('.tip'); if(!sp||!tip) return;
  const pad=6; Object.assign(sp.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
  const th=tip.offsetHeight, tw=tip.offsetWidth, vh=innerHeight, vw=innerWidth;
  let top=r.bottom+14+th<vh?r.bottom+14:r.top-14-th>0?r.top-14-th:vh-th-16; top=Math.max(16,top);
  tip.style.top=top+'px'; tip.style.left=Math.min(Math.max(16,(r.left+r.right)/2-tw/2),vw-tw-16)+'px';
}
function openGuide(i){
  guideTab=i; const T=L().ui, G=L().guide();
  const tabs=G.map(([t],j)=>`<button type="button" role="tab" aria-selected="${j===i}" data-gtab="${j}">${t}</button>`).join('');
  $('guide').innerHTML=`<div class="gwrap" data-gclose="1"><div class="gcard" role="dialog" aria-modal="true" aria-labelledby="g-h"><div class="ghead"><h2 id="g-h">${T.gHead}</h2><button type="button" class="gx" data-gclose="1" aria-label="${T.gCloseAria}">${T.gClose}</button></div><div class="gtabs" role="tablist">${tabs}</div><div class="gbody" tabindex="-1">${G[i][1]}</div></div></div>`;
  $('guide').querySelector('.gbody').focus({preventScroll:true});
}
function closeGuide(){ guideTab=-1; $('guide').innerHTML=''; }
function applyHint(){$('hint').hidden=!HINT_ON;$('hint-btn').setAttribute('aria-pressed',String(HINT_ON));store.set('al-hints',HINT_ON?'on':'off')}

/* ======================= RENDER ======================= */
function applyStatic(){
  const X=L(), B=X.lbl;
  document.documentElement.lang=LANG; document.title=X.title;
  $('t-h1').textContent=X.title; $('t-area').textContent=B.area; $('t-date').textContent=B.date; $('t-qa').textContent=B.qa; $('hud-qa').setAttribute('aria-label',B.qaAria);
  $('tour-btn').textContent=B.tour; $('guide-btn').textContent=B.guide; $('hint-btn').textContent=B.hint; $('restart').textContent=B.restart;
  $('t-sopH').textContent=B.sopH; $('t-sopP').textContent=B.sopP;
  $('steps').innerHTML=X.steps.map(([b,t])=>`<li><span><b>${b}</b>${t}</span></li>`).join('');
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
}
function paper(title,body,cls='',key){return `<article class="paper ${cls}"${key?` data-k="${key}"`:''}><h3>${title}</h3>${body}</article>`}
function row(k,v){return `<div class="row"><span>${k}</span><span>${v}</span></div>`}
function act(id,label,sub,dis){return `<button class="act" type="button" data-act="${id}" ${dis?'disabled':''}>${label}<small>${sub}</small></button>`}
const acts=list=>list.map(([id,l,s])=>act(id,l,s)).join('');

function renderHud(){
  const X=L(), t=S.today, dt=new Date(t.y,t.m-1,t.d);
  $('hud-n').textContent=Math.min(S.idx+1,N_AREA)+'/'+N_AREA;
  $('hud-date').textContent=`${X.DAY[dt.getDay()]}, ${t.d} ${X.MON[t.m-1]} ${t.y}`;
  $('hud-qa').innerHTML=Array.from({length:MAX_QA},(_,i)=>`<i class="${i<S.qa?'on':''}"></i>`).join('');
  const cur=STEP_OF[S.phase]??-1;
  [...$('steps').children].forEach((li,i)=>{li.className=i===cur?'cur':i<cur?'done':''});
  $('queue').innerHTML=S.areas.map((a,i)=>{const r=S.results[i];return `<i class="${i===S.idx&&!S.over?'now':r===true?'ok':r===false?'bad':''}">${esc(aN(a.k))}</i>`}).join('');
}
function picPresent(a){return !(a.scen==='absent'&&!S.escort)}
function speaker(a){ return picPresent(a)?`${esc(a.pic.name)} · ${esc(tx(AREAS[a.k].pic))}`:L().guard; }
function bubble(a,text){return `<div class="bubble" id="bubble"><small>${speaker(a)}</small>${text}</div>`}
function personHTML(a){
  if(picPresent(a)) return `<div class="person" id="person">${personSVG(a.pic.look)}<div class="badge"><b>${esc(a.pic.name)}</b><span>${esc(tx(AREAS[a.k].pic))}</span></div></div>`;
  return `<div class="person" id="person">${personSVG(a.guard,true)}<div class="badge guard"><b>${L().guard}</b><span>Security</span></div></div>`;
}

function render(){
  renderHud();
  const X=L(), T=X.ui, a=area(), A=AREAS[a.k], pic=a.pic.name, job=tx(A.pic), an=aN(a.k);
  let scene='', papers='', bar='';
  const plate=`<div class="plate">${esc(an)}</div>`;
  if(S.phase==='brief'){
    const P=T.brief, sc=a.scen;
    const line=!picPresent(a)?P.say.absent():a.scen==='absent'?P.say.arrived(pic,job):P.say[sc](pic,job,an);
    const sign=`<div class="apd-sign" data-k="sign"><b>${P.sign}</b><ul>${a.apd.length?a.apd.map(k=>`<li><i>${APD[k].i}</i>${esc(tx(APD[k].n))}</li>`).join(''):`<li>${P.signNone}</li>`}</ul></div>`;
    scene=`<div class="door">${doorSVG(a)}</div>${sign}${personHTML(a)}${bubble(a,esc(line))}`;
    const t=S.today;
    papers+=paper(P.st,row(P.stNo,`ST-${a.stN}/SPI/${['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][t.m-1]}/${t.y}`)+row(P.stTo,P.stToV)+row(P.stArea,esc(an))+row(P.stType,P.stTypeV)+row(P.stDate,`${t.d} ${X.MON[t.m-1]} ${t.y}`)+row(P.stHead,'<span class="sig">H. Siregar</span>'),'tilt-l');
    const chips=APD_KEYS.map(k=>`<button type="button" class="chip" data-apd="${k}" aria-pressed="${S.apd.includes(k)}">${APD[k].i} ${esc(tx(APD[k].n))}</button>`).join('');
    papers+=paper(P.rack,`<p class="empty-note" style="margin:0">${P.rackNote}</p><div class="chips">${chips}</div>`,'tilt-r wide');
    bar=acts(P.acts);
  }
  if(S.phase==='walk'){
    const P=T.walk;
    const spots=a.items.map((it,i)=>{const m=S.marks[i]; const st=m?`<span class="st ${m}">${m==='ok'?'✓':'!'}${m==='bad'&&S.photos[i]?' 📷':''}</span>`:'';
      return `<button type="button" class="spot" data-spot="${i}" aria-pressed="${S.sel===i}" aria-label="${esc(tx(ITEMS[it.t].n))}">${st}${itemSVG(it)}<span class="tag">${esc(tx(ITEMS[it.t].n))}</span></button>`}).join('');
    scene=`<div class="spots">${spots}</div>${personHTML(a)}${bubble(a,esc(P.say(a.items.length)))}`;
    const cl=a.items.map((it,i)=>{const m=S.marks[i];return `<li class="${S.sel===i?'cur':''}"><button type="button" data-spot="${i}"><span class="mk ${m||''}">${m==='ok'?'✓':m==='bad'?'ⓧ':'□'}</span><span>${esc(tx(ITEMS[it.t].n))}</span>${m==='bad'&&S.photos[i]?`<small>📷 ${P.photo}</small>`:''}</button></li>`}).join('');
    papers+=paper(P.cl,`<ul class="cl">${cl}</ul>`,'tilt-l');
    if(S.sel>=0){
      const i=S.sel, it=a.items[i], D=ITEMS[it.t];
      const rows=D.r(it.p,it.f).map(([k,v])=>row(esc(tx(k)),esc(tx(v)))).join('');
      papers+=paper(`${P.insp} · ${esc(tx(D.n))}`,rows+`<div class="std"><b>${P.std}</b><ul>${D.std.map(s=>`<li>• ${esc(tx(s))}</li>`).join('')}</ul></div>`+
        `<div class="chips"><button type="button" class="chip okc" data-mark="${i}:ok" aria-pressed="${S.marks[i]==='ok'}">${P.ok}</button><button type="button" class="chip badc" data-mark="${i}:bad" aria-pressed="${S.marks[i]==='bad'}">${P.bad}</button><button type="button" class="chip cam" data-photo="${i}" aria-pressed="${!!S.photos[i]}">${S.photos[i]?P.camOn:P.cam}</button></div>`,'tilt-r wide','insp');
    } else papers+=paper(P.insp,`<p class="empty-note">${P.pick}</p>`,'tilt-r wide','insp');
    const left=a.items.filter((_,i)=>!S.marks[i]).length;
    bar=act('save',P.save,left?P.left(left):P.ready,!!left);
  }
  if(S.phase==='conf'){
    const P=T.conf, ev=a.ev, recs=S.recorded;
    const fixIt=recs.length?tx(ITEMS[a.items[recs[0]].t].n).toLowerCase():'';
    const line=ev==='fix'?P.say.fix(fixIt):P.say[ev];
    scene=`<div class="spots">${a.items.map((it,i)=>`<div class="spot disabled">${S.marks[i]?`<span class="st ${S.marks[i]}">${S.marks[i]==='ok'?'✓':'!'}</span>`:''}${itemSVG(it)}<span class="tag">${esc(tx(ITEMS[it.t].n))}</span></div>`).join('')}</div>${personHTML(a)}${bubble(a,esc(line))}`;
    const list=recs.length?`<ul>${recs.map(i=>`<li><span class="mk bad" style="color:var(--bad);font:700 1.1rem var(--f-hand)">ⓧ</span><span>${esc(tx(ITEMS[a.items[i].t].n))}${S.photos[i]?` · 📷 ${P.baPhoto}`:''}</span></li>`).join('')}</ul>`:`<p class="empty-note">${P.baNone}</p>`;
    papers+=paper(P.ba,row(X.lbl.area,esc(an))+row('PIC',esc(pic))+`<p><b>${P.baF}</b></p>${list}`+row(P.baPic,`<span class="sig none">${P.baPending}</span>`),'tilt-l wide');
    if(ev==='gift') papers+=paper(P.desk,`<p style="margin:0">${P.giftTxt}</p>`,'tilt-r');
    bar=acts(P.acts[ev]);
  }
  if(S.phase==='close'){
    const P=T.close;
    scene=`<div class="spots">${a.items.map((it,i)=>`<div class="spot disabled"><span class="st ${S.marks[i]}">${S.marks[i]==='ok'?'✓':'!'}</span>${itemSVG(it)}<span class="tag">${esc(tx(ITEMS[it.t].n))}</span></div>`).join('')}</div>${personHTML(a)}${bubble(a,esc(P.say))}`;
    const list=a.items.map((it,i)=>`<li><span style="font:700 1.1rem var(--f-hand);color:${S.marks[i]==='bad'?'var(--bad)':'var(--ok)'};min-width:22px">${S.marks[i]==='bad'?'ⓧ':'✓'}</span><span>${esc(tx(ITEMS[it.t].n))}</span></li>`).join('');
    papers+=paper(P.sum,`<ul data-k="sum">${list}</ul><p>${P.count(S.recorded.length)}</p>`,'tilt-l');
    const byRisk=r=>Object.keys(ITEMS).filter(k=>ITEMS[k].risk===r).map(k=>esc(tx(ITEMS[k].n))).join(', ');
    papers+=paper(P.riskT,`<p style="margin:0"><b>${P.riskHi}</b></p><p>${P.items}: ${byRisk('hi')}</p><p><b>${P.riskMd}</b></p><p>${P.items}: ${byRisk('md')}</p>`,'');
    papers+=paper(P.guide,P.rows.map(([x,y])=>row(x,y)).join(''),'tilt-r');
    bar=acts(P.acts);
  }
  $('scene').className='scene '+S.phase; $('scene').innerHTML=plate+scene;
  const H=X.hints[S.phase];
  $('hint').hidden=!HINT_ON;
  if(H) $('hint').innerHTML=`<b>${H[0]}</b>${H[1]}<div class="hint-acts"><button type="button" data-hint="guide">${T.hintFull}</button></div>`;
  $('papers').innerHTML=papers;
  $('bar').innerHTML=S.fb?verdictHTML():bar;
  if(S.over) renderEnd(); else $('end').innerHTML='';
}
const msgHTML=(key,args)=>L().msg[key](args||{});
function verdictHTML(){
  const f=S.fb, T=L().ui;
  return `<div class="verdict ${f.ok?'':'bad'}"><h4>${f.ok?T.vOk:T.vBad}</h4>${msgHTML(f.key,f.args)}</div><button class="next" type="button" data-act="next">${T[f.label||'next']}</button>`;
}

/* ======================= RULES ======================= */
function fb(ok,key,args,then,label){
  S.fb={ok,key,args,then,label};
  if(!ok){ S.qa++; S.results[S.idx]=false; }
  S.log.push({a:S.idx,step:STEP_OF[S.phase],ok,key,args});
}
function finishArea(){ if(S.results[S.idx]!==false) S.results[S.idx]=true; return 'leave'; }
const lastLbl=()=>S.idx+1<N_AREA?'call':'results';
function afterWalk(a){
  if(a.ev==='gift') return 'conf';
  return S.recorded.length?'conf':'close';
}

function decide(act){
  const a=area();
  if(S.phase==='brief'){
    const needEscort=!picPresent(a);
    if(act==='escort'){
      if(needEscort){ S.escort=true; return fb(true,'escort_ok',{},'brief'); }
      return fb(false,'escort_false',{},'brief');
    }
    if(act==='postpone') return fb(false,a.scen==='postpone'?'post_bad':'post_false',{},finishArea(),lastLbl());
    // act === 'go'
    if(needEscort){ S.escort=true; return fb(false,'alone',{},'walk'); }
    const miss=a.apd.filter(k=>!S.apd.includes(k));
    if(miss.length) return fb(false,'apd_miss',{miss:miss,short:a.scen==='short'},'walk');
    return fb(true,a.scen==='postpone'?'brief_stay':'brief_ok',{short:a.scen==='short'},'walk');
  }
  if(S.phase==='walk'){
    S.recorded=a.items.map((_,i)=>i).filter(i=>S.marks[i]==='bad');
    const wrong=a.items.map((it,i)=>({t:it.t,f:it.f,truth:!!it.f,m:S.marks[i]})).filter(x=>(x.m==='bad')!==x.truth);
    const nophoto=a.items.map((it,i)=>i).filter(i=>S.marks[i]==='bad'&&!S.photos[i]).map(i=>a.items[i].t);
    const then=afterWalk(a);
    if(!wrong.length&&!nophoto.length) return fb(true,'walk_ok',{n:S.recorded.length},then);
    return fb(false,'walk_bad',{wrong,nophoto},then);
  }
  if(S.phase==='conf'){
    const ev=a.ev;
    if(ev==='gift') return act==='refuse'?fb(true,'gift_ok',{},'close'):fb(false,'gift_bad',{},'close');
    if(ev==='fix') return act==='keep'?fb(true,'fix_ok',{},'close'):fb(false,'fix_bad',{},'close');
    if(ev==='refuse') return act==='note'?fb(true,'ref_ok',{},'close'):fb(false,act==='drop'?'ref_drop':'ref_hold',{},'close');
    return act==='sign'?fb(true,'sign_ok',{},'close'):fb(false,act==='email'?'sign_email':'sign_fix',{},'close');
  }
  if(S.phase==='close'){
    const recs=S.recorded, right=!recs.length?0:recs.some(i=>ITEMS[a.items[i].t].risk==='hi')?2:1, r=+act.slice(1), end=finishArea();
    return r===right?fb(true,'close_ok',{r},end,lastLbl()):fb(false,'close_bad',{right},end,lastLbl());
  }
}

function next(){
  const then=S.fb.then; S.fb=null;
  if(S.qa>=MAX_QA){ S.over='lose'; render(); return; }
  if(then==='leave'){
    if(S.idx+1>=N_AREA){ S.over='win'; render(); return; }
    const p=$('person'); if(p) p.classList.add('out');
    $('bar').innerHTML='';
    setTimeout(()=>{ S.idx++; S.phase='brief'; S.apd=[]; S.escort=false; S.sel=-1; S.marks=[]; S.photos=[]; S.recorded=[]; render(); },matchMedia('(prefers-reduced-motion: reduce)').matches?0:420);
    return;
  }
  // events that only make sense when something was recorded fall back to a plain confirmation
  if(then==='conf'){ const a=area(); if((a.ev==='fix'||a.ev==='refuse')&&!S.recorded.length) a.ev='none'; }
  S.phase=then; render();
}

function renderEnd(){
  const X=L(), T=X.ui, win=S.over==='win', okN=S.results.filter(r=>r===true).length;
  const strip=h=>h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const items=S.log.map(l=>`<li><span class="${l.ok?'v':'x'}">${l.ok?'✓':'✗'} ${X.stepNames[l.step]}</span> · ${esc(aN(S.areas[l.a].k))}. ${esc(strip(msgHTML(l.key,l.args)))}</li>`).join('');
  $('end').innerHTML=`<div class="end" role="dialog" aria-modal="true" aria-labelledby="end-h"><div class="card"><h2 id="end-h">${win?T.endWin:T.endLose}</h2><p class="big">${T.endBig(okN,N_AREA,S.qa)}</p><p>${win?T.endPWin:T.endPLose}</p><ol>${items}</ol><button class="next" type="button" data-act="restart">${T.again}</button></div></div>`;
}

function setLang(l){
  if(l===LANG) return; LANG=l; store.set('al-lang',l);
  applyStatic(); render(); applyHint();
  if(tour) drawTour();
  if(guideTab>=0) openGuide(guideTab);
}

/* ======================= EVENTS ======================= */
document.addEventListener('click',e=>{
  const lb=e.target.closest('[data-lang]'); if(lb){ setLang(lb.dataset.lang); return; }
  const g=e.target.closest('[data-gtab],[data-gclose]');
  if(g){ if(g.dataset.gtab!==undefined){ openGuide(+g.dataset.gtab); return; } if(e.target===g){ closeGuide(); return; } }
  const h=e.target.closest('[data-hint]'); if(h){ openGuide((STEP_OF[S.phase]??-1)+1); return; }
  const b=e.target.closest('[data-tour]');
  if(b&&tour){ const t=b.dataset.tour;
    if(t==='skip') return closeTour(); if(t==='prev'){tour.i--;return drawTour()}
    if(tour.i===tour.idx.length-1) return closeTour(); tour.i++; return drawTour(); }
  const t=e.target.closest('[data-act],[data-mark],[data-spot],[data-photo],[data-apd]'); if(!t) return;
  if(t.dataset.act==='restart'){ S=newRun(); render(); return; }
  if(t.dataset.act==='next'){ next(); return; }
  if(S.fb||S.over) return;
  if(t.dataset.apd){ const k=t.dataset.apd; S.apd=S.apd.includes(k)?S.apd.filter(x=>x!==k):S.apd.concat(k); render(); return; }
  if(t.dataset.spot!==undefined){ S.sel=+t.dataset.spot; render(); return; }
  if(t.dataset.mark){ const [i,k]=t.dataset.mark.split(':'); S.marks[+i]=k; render(); return; }
  if(t.dataset.photo!==undefined){ const i=+t.dataset.photo; S.photos[i]=!S.photos[i]; render(); return; }
  if(t.dataset.act){ decide(t.dataset.act); render(); }
});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(tour) closeTour(); else if(guideTab>=0) closeGuide(); });
addEventListener('resize',placeTour); addEventListener('scroll',placeTour,{passive:true});
$('restart').addEventListener('click',()=>{S=newRun();render()});
$('tour-btn').addEventListener('click',openTour);
$('guide-btn').addEventListener('click',()=>openGuide(0));
$('hint-btn').addEventListener('click',()=>{HINT_ON=!HINT_ON;applyHint()});

/* Straight into the game: no menu. The tour is one click away in the HUD. */
S=newRun(); applyStatic(); render(); applyHint();
})();
</script>
</body>
</html>
