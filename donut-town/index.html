<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e8">
<meta name="description" content="Donut Town: a life sim by Holy Doughnut Studio.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>html,body{margin:0;padding:0}</style>
<title>Donut Town</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/*
 * Donut Town styles. Inlined into <style> by build.js.
 * Two layers: the base UI first, then the "board" skin (thick outlines, cream boards) that restyles it.
 * Godot: use these colours/radii/outlines as the reference for a Theme resource.
 */
/* Layout: full screen. HUD (top) → side-scrolling town street (canvas) → controls (bottom).
   Building panels appear as sheets over the canvas. */
:root {
  --bg: #fff6e8;
  --panel: #ffffff;
  --sunken: #f3e6cf;
  --ink: #2b2d42;
  --muted: #6f6a7d;
  --line: #e3d3b8;
  --glaze: #e0457b;
  --glaze-soft: #ffe1ec;
  --on-glaze: #ffffff;
  --dough: #e2ac6c;
  --sun: #b7791f;
  --good: #1d7a63;
  --bad: #c0392b;
  --info: #2251a3;
  --tower: #9aa6bd;
  --window: #f4c458;
  --f-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #fff6e8;
    --panel: #ffffff;
    --sunken: #f3e6cf;
    --ink: #2b2d42;
    --muted: #6f6a7d;
    --line: #e3d3b8;
    --glaze: #e0457b;
    --glaze-soft: #ffe1ec;
    --on-glaze: #ffffff;
    --dough: #e2ac6c;
    --sun: #b7791f;
    --good: #1d7a63;
    --bad: #c0392b;
    --info: #2251a3;
    --tower: #9aa6bd;
    --window: #f4c458;
    color-scheme: light;
  }
}
:root[data-theme='dark'] {
  --bg: #fff6e8;
  --panel: #ffffff;
  --sunken: #f3e6cf;
  --ink: #2b2d42;
  --muted: #6f6a7d;
  --line: #e3d3b8;
  --glaze: #e0457b;
  --glaze-soft: #ffe1ec;
  --on-glaze: #ffffff;
  --dough: #e2ac6c;
  --sun: #b7791f;
  --good: #1d7a63;
  --bad: #c0392b;
  --info: #2251a3;
  --tower: #9aa6bd;
  --window: #f4c458;
  color-scheme: light;
}

html {
  font-size: calc(15px * var(--scale));
}
html,
body {
  height: 100%;
}
body {
  margin: 0; /* the game fills the window exactly; the browser's default 8px made every page scroll */
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1rem;
  line-height: 1.5;
  overscroll-behavior: none;
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button,
select {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--glaze);
  outline-offset: 2px;
}
#app {
  min-height: 100%;
}
[hidden] {
  display: none !important;
}
.gut {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap {
  max-width: 46rem;
  margin: 0 auto;
  width: 100%;
}
h1,
h2,
h3 {
  font-family: var(--f-display);
  text-wrap: balance;
  margin: 0;
  line-height: 1.15;
}
.mono {
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
}
.label {
  font-family: var(--f-mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.note {
  font-size: 0.88rem;
  color: var(--muted);
  margin: 0;
}
.donut {
  width: 1.6rem;
  height: 1.6rem;
  border-radius: 50%;
  flex: none;
  background: radial-gradient(circle, transparent 0 27%, var(--glaze) 28% 58%, var(--dough) 60% 100%);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 0.65rem 1.1rem;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
}
.btn:hover {
  border-color: var(--glaze);
}
.btn.primary {
  background: var(--glaze);
  color: var(--on-glaze);
  border-color: var(--glaze);
}
.btn.ghost {
  background: transparent;
}
.btn.small {
  padding: 0.35rem 0.8rem;
  font-size: 0.85rem;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  align-items: center;
}
.confirm {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  padding: 0.6rem 0.8rem;
  border: 1px dashed var(--bad);
  border-radius: 10px;
  font-size: 0.9rem;
}

/* menu & pages */
.menu {
  min-height: 100vh;
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 1.5rem;
  padding-block: 2rem 0;
}
.menu-body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.3rem;
}
.studio {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--f-mono);
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.menu h1 {
  font-size: clamp(3.2rem, 12vw, 6.5rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 0.9;
}
.menu h1 span {
  color: var(--glaze);
}
.lede {
  font-size: 1.15rem;
  max-width: 32rem;
  margin: 0;
}
.keys {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.9rem;
  font-size: 0.85rem;
  color: var(--muted);
}
kbd {
  font-family: var(--f-mono);
  font-size: 0.75rem;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 0 0.35rem;
  background: var(--panel);
  color: var(--ink);
}
canvas.skyline {
  display: block;
  width: 100%;
  height: 150px;
  max-width: 100%;
}
.page {
  padding-block: 1.5rem 2.5rem;
  display: grid;
  gap: 1.4rem;
}
.page h2 {
  font-size: clamp(1.7rem, 5vw, 2.4rem);
  font-weight: 800;
  letter-spacing: -0.02em;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem 1.1rem;
  display: grid;
  gap: 0.8rem;
}
.field {
  display: grid;
  gap: 0.15rem;
}
.field input {
  font: inherit;
  padding: 0.5rem 0.65rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  width: 100%;
  min-width: 0;
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}
.kv {
  display: grid;
  grid-template-columns: 7rem minmax(0, 1fr);
  gap: 0.25rem 0.6rem;
  font-size: 0.93rem;
  margin: 0;
}
.kv dt {
  color: var(--muted);
}
.kv dd {
  margin: 0;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.chip {
  display: inline-flex;
  font-size: 0.8rem;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  background: var(--glaze-soft);
  color: var(--glaze);
  font-weight: 700;
}
.trait {
  padding: 0.5rem 0.75rem;
  border-left: 3px solid var(--glaze);
  background: var(--bg);
  font-size: 0.9rem;
}
.trait b {
  font-family: var(--f-display);
}
.choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 0.6rem;
}
.choice {
  display: grid;
  gap: 0.2rem;
  text-align: left;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  cursor: pointer;
}
.choice:hover {
  border-color: var(--glaze);
}
.choice b {
  font-family: var(--f-display);
  font-size: 1.1rem;
}
.choice span {
  font-size: 0.85rem;
  color: var(--muted);
}
.track {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}
.track i {
  height: 6px;
  border-radius: 3px;
  background: var(--sunken);
}
.track i.done {
  background: var(--glaze);
}
.track i.now {
  background: var(--ink);
}
.memories {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.4rem;
  font-size: 0.95rem;
}
.mini {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 7px;
  padding: 0.3rem 0.65rem;
  font-size: 0.82rem;
  cursor: pointer;
}
.mini:hover:not(:disabled) {
  border-color: var(--glaze);
}
.mini:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.mini.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* ---------- game screen ---------- */
#app.playing {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.hud {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 0.5rem;
  display: grid;
  grid-template-columns: minmax(0, 1fr); /* never wider than the screen: long names shrink with … */
  gap: 0.45rem;
  flex: none;
}
.hud-top {
  display: flex;
  align-items: center;
  gap: 0.4rem 0.8rem;
  flex-wrap: wrap;
}
.who {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
  flex: 1 1 9rem;
}
@media (max-width: 560px) {
  .loc-name {
    display: none;
  }
  .hud .btn.small {
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
  }
  .speed .mini {
    padding: 0.25rem 0.45rem;
    font-size: 0.75rem;
  }
  .hud-top {
    gap: 0.35rem 0.5rem;
  }
}
.who b {
  font-family: var(--f-display);
  font-size: 1.05rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.clock {
  font-family: var(--f-mono);
  display: flex;
  gap: 0.5rem;
  align-items: baseline;
  font-size: 0.82rem;
}
.clock .t {
  font-weight: 700;
  font-size: 1.25rem;
}
.speed {
  display: flex;
  gap: 0.2rem;
}
.cash {
  font-family: var(--f-mono);
  font-weight: 700;
  color: var(--sun);
  font-size: 1rem;
}
.cash.neg {
  color: var(--bad);
}
.needs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.3rem 0.9rem;
}
@media (max-width: 520px) {
  .needs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.need {
  display: grid;
  gap: 0.15rem;
  min-width: 0;
}
.need-top {
  display: flex;
  justify-content: space-between;
  font-size: 0.76rem;
  gap: 0.3rem;
  font-weight: 700;
}
.bar {
  height: 7px;
  border-radius: 4px;
  background: var(--sunken);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  border-radius: 4px;
  background: var(--c, var(--glaze));
}
.need.low .need-top {
  color: var(--bad);
}
.need.low .bar > i {
  background: var(--bad);
}
@media (prefers-reduced-motion: no-preference) {
  .need.low .bar {
    animation: pulse 1.2s ease-in-out infinite;
  }
}
@keyframes pulse {
  50% {
    opacity: 0.45;
  }
}

.stage {
  position: relative;
  flex: 1;
  min-height: 260px;
  overflow: hidden;
  background: #0b1026;
  touch-action: none;
}
.stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}
.feed {
  position: absolute;
  left: max(12px, env(safe-area-inset-left, 0px));
  top: 10px;
  display: grid;
  gap: 0.3rem;
  max-width: min(26rem, 52%);
  pointer-events: none;
}
.feed > p {
  margin: 0;
  background: rgba(12, 16, 30, 0.72);
  color: #f3f4f8;
  padding: 0.3rem 0.6rem;
  border-radius: 8px;
  font-size: 0.85rem;
  transition: opacity 0.6s;
}
.anote {
  background: rgba(12, 16, 30, 0.84);
  color: #f3f4f8;
  border-radius: 10px;
  border-left: 3px solid var(--glaze);
  padding: 0.45rem 0.65rem 0.5rem;
  display: grid;
  gap: 0.25rem;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  animation: anote-in 0.35s ease-out;
}
.anote-h {
  display: flex;
  align-items: baseline;
  gap: 0.4rem;
  flex-wrap: wrap;
}
.anote-h b {
  font-size: 0.9rem;
}
.anote-h small {
  font-size: 0.72rem;
  opacity: 0.7;
}
.anote-ic {
  font-size: 0.95rem;
}
.anote-m {
  margin: 0;
  font-size: 0.8rem;
  opacity: 0.85;
  line-height: 1.35;
}
.anote-c {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
}
.anote-c i {
  font-style: normal;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.08rem 0.45rem;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.1);
}
.anote-c i.up {
  color: #8ff0cf;
}
.anote-c i.dn {
  color: #ffb4a3;
}
.anote-c i.money {
  font-family: var(--f-mono);
}
@keyframes anote-in {
  from {
    opacity: 0;
    transform: translateX(-14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .anote {
    animation: none;
  }
}
.feed > p.good {
  color: #8ff0cf;
}
.feed > p.bad {
  color: #ffb4a3;
}
.feed > p.mile {
  color: #ffc1d6;
  font-weight: 700;
}
.feed > p.tip {
  color: #bcd0ff;
}
.task {
  position: absolute;
  right: max(12px, env(safe-area-inset-right, 0px));
  top: 10px;
  max-width: min(17rem, 45%);
  background: rgba(12, 16, 30, 0.78);
  color: #f3f4f8;
  padding: 0.4rem 0.65rem;
  border-radius: 8px;
  font-size: 0.82rem;
  pointer-events: none;
}
.task:empty {
  display: none;
}
.task b {
  color: #9ff0c9;
}
.actbar {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(22rem, calc(100% - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem;
  display: grid;
  gap: 0.6rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.actbar b {
  font-family: var(--f-display);
  font-size: 1.1rem;
}
.panel {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 72%;
  overflow: auto;
  background: var(--panel);
  border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
  padding-block: 0.9rem 1rem;
}
.panel-in {
  max-width: 40rem;
  margin: 0 auto;
  display: grid;
  gap: 0.5rem;
}
.panel-h {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.6rem;
}
.panel-h h3 {
  font-size: 1.25rem;
}
.status {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 0.1rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--good) 15%, transparent);
  color: var(--good);
}
.status.off {
  background: color-mix(in srgb, var(--bad) 15%, transparent);
  color: var(--bad);
}
.x {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 999px;
  width: 2.2rem;
  height: 2.2rem;
  cursor: pointer;
  flex: none;
  font-size: 1.1rem;
  line-height: 1;
}
.sub {
  margin-top: 0.3rem;
}
.opt {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.8rem;
  text-align: left;
  padding: 0.65rem 0.8rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  cursor: pointer;
  width: 100%;
}
.opt:hover:not(:disabled) {
  border-color: var(--glaze);
  background: var(--panel);
}
.opt-main {
  min-width: 0;
  display: grid;
  gap: 0.05rem;
}
.opt-main b {
  font-weight: 700;
}
.opt-main small {
  font-size: 0.82rem;
  color: var(--good);
}
.opt:disabled {
  cursor: not-allowed;
  background: transparent;
}
.opt:disabled b {
  color: var(--muted);
}
.opt:disabled small {
  color: var(--bad);
}
.opt-meta {
  font-family: var(--f-mono);
  font-size: 0.76rem;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
  display: grid;
}
.opt-meta .cost {
  color: var(--sun);
  font-weight: 700;
}
.box {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.6rem 0.8rem;
  display: grid;
  gap: 0.35rem;
  background: var(--bg);
}
.wk {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0.25rem;
}
.wk span {
  text-align: center;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.3rem 0;
  border-radius: 7px;
  border: 1px dashed var(--line);
  color: var(--muted);
}
.wk span.on {
  background: var(--glaze-soft);
  color: var(--glaze);
  border: 1px solid transparent;
}
.wk span.now {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}
.box-h {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  flex-wrap: wrap;
  align-items: baseline;
}
.box-h b {
  font-family: var(--f-display);
}
.sheet.wide {
  width: min(46rem, 100%);
}
.tree {
  display: grid;
  gap: 1.1rem;
}
.gen {
  display: grid;
  gap: 0.4rem;
  position: relative;
}
.gen + .gen::before {
  content: '';
  position: absolute;
  left: 50%;
  top: -1.1rem;
  height: 1.1rem;
  border-left: 2px solid var(--line);
}
.nodes {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  justify-content: center;
}
.node {
  display: grid;
  gap: 0.05rem;
  min-width: 7.5rem;
  max-width: 11rem;
  padding: 0.45rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg);
  text-align: center;
  font-size: 0.85rem;
}
.node b {
  font-family: var(--f-display);
  font-size: 0.92rem;
}
.node small {
  color: var(--muted);
  font-size: 0.74rem;
}
.node.self {
  border-color: var(--glaze);
  background: var(--glaze-soft);
}
.node.dead {
  opacity: 0.55;
}
.node.unknown {
  border-style: dashed;
  color: var(--muted);
}
.node .tag {
  justify-self: center;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0 0.4rem;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  margin-top: 0.15rem;
}
.gen .label {
  text-align: center;
}
.chat {
  display: grid;
  gap: 0.4rem;
  max-height: 13rem;
  overflow: auto;
  padding: 0.2rem 0;
}
@media (max-height: 860px) {
  .chat {
    max-height: 8.5rem;
  }
}
.bub {
  max-width: 85%;
  padding: 0.45rem 0.7rem;
  border-radius: 12px;
  font-size: 0.92rem;
  background: var(--bg);
  border: 1px solid var(--line);
  justify-self: start;
}
.bub span {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
}
.bub.me {
  justify-self: end;
  background: var(--glaze-soft);
  border-color: transparent;
}
.choices-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.mini.say {
  padding: 0.45rem 0.75rem;
  font-size: 0.85rem;
}
.sel {
  font: inherit;
  padding: 0.55rem 0.65rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  width: 100%;
  min-width: 0;
}

.controls {
  flex: none;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding-block: 0.55rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
}
.controls-in {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 0.6rem;
  align-items: center;
}
.pad {
  width: 3.4rem;
  height: 3.4rem;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 1.4rem;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
.pad:active {
  background: var(--sunken);
}
.prompt {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: center;
  align-items: center;
  min-height: 3.4rem;
  text-align: center;
}
.prompt .hint {
  font-size: 0.85rem;
  color: var(--muted);
}
.go {
  border: 0;
  background: var(--glaze);
  color: var(--on-glaze);
  border-radius: 999px;
  padding: 0.6rem 1.1rem;
  font-weight: 700;
  cursor: pointer;
}
.go.alt {
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
}

/* ---------- in-game phone ---------- */
.phone-wrap {
  position: absolute;
  inset: 0;
  z-index: 9;
  display: grid;
  place-items: center;
  padding: 10px;
}
.ph-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(8, 12, 28, 0.45);
}
.phone {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(360px, calc(100% - 20px));
  height: min(720px, calc(100% - 20px));
  background: #0c0e13;
  border-radius: 44px;
  padding: 9px;
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.5),
    inset 0 0 0 2px #2b303b,
    inset 0 0 0 4px #0c0e13,
    inset 0 0 0 5px #3a404c;
}
.phone::before {
  content: '';
  position: absolute;
  right: -3px;
  top: 110px;
  width: 3px;
  height: 56px;
  border-radius: 0 3px 3px 0;
  background: #2b303b;
}
.phone::after {
  content: '';
  position: absolute;
  left: -3px;
  top: 90px;
  width: 3px;
  height: 36px;
  border-radius: 3px 0 0 3px;
  background: #2b303b;
  box-shadow: 0 50px 0 #2b303b;
}
.ph-screen {
  position: relative;
  height: 100%;
  border-radius: 36px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
}
.ph-screen.home {
  background:
    radial-gradient(120% 70% at 20% 0%, #ff9ab8 0%, transparent 60%),
    linear-gradient(165deg, #ff6d98 0%, #8a5cf6 55%, #24206b 100%);
  color: #fff;
}
.ph-notch {
  position: absolute;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 92px;
  height: 26px;
  border-radius: 16px;
  background: #0c0e13;
  z-index: 3;
}
.ph-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 22px 6px;
  font-size: 0.74rem;
  font-weight: 700;
  flex: none;
  position: relative;
  z-index: 2;
}
.ph-sig {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.68rem;
}
.ph-bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 1px;
  height: 10px;
}
.ph-bars i {
  width: 3px;
  background: currentColor;
  border-radius: 1px;
}
.ph-bars i:nth-child(1) {
  height: 3px;
}
.ph-bars i:nth-child(2) {
  height: 5px;
}
.ph-bars i:nth-child(3) {
  height: 7px;
}
.ph-bars i:nth-child(4) {
  height: 10px;
}
.ph-batt {
  display: inline-block;
  width: 20px;
  height: 10px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  padding: 1px;
  position: relative;
  margin-right: 3px; /* room for the battery tip before the percentage */
}
.ph-batt::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 2px;
  width: 2px;
  height: 4px;
  background: currentColor;
  border-radius: 0 1px 1px 0;
}
.ph-batt i {
  display: block;
  height: 100%;
  background: currentColor;
  border-radius: 1px;
}
.ph-body {
  flex: 1;
  overflow: auto;
  padding: 4px 14px 8px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.ph-homebar {
  flex: none;
  height: 24px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  cursor: pointer;
}
.ph-homebar i {
  width: 118px;
  height: 5px;
  border-radius: 3px;
  background: currentColor;
  opacity: 0.55;
}
.ph-hero {
  text-align: center;
  padding: 0.8rem 0 0.3rem;
}
.ph-bigclock {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 3rem;
  line-height: 1;
  letter-spacing: -0.02em;
}
.ph-date {
  font-size: 0.85rem;
  opacity: 0.9;
  margin-top: 0.25rem;
}
.ph-widget {
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(8px);
  border-radius: 18px;
  padding: 0.6rem 0.8rem;
  display: grid;
  gap: 0.25rem;
}
.ph-widget p {
  margin: 0;
  font-size: 0.8rem;
  line-height: 1.35;
}
.ph-wlabel {
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.8;
}
.ph-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.6rem 0.2rem;
  margin-top: auto;
  padding: 0.5rem 0.2rem 0.4rem;
}
.ph-app {
  display: grid;
  justify-items: center;
  gap: 0.3rem;
  background: none;
  border: 0;
  color: inherit;
  cursor: pointer;
  font-size: 0.7rem;
  font-weight: 700;
  min-width: 0;
}
.ph-app span {
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ph-app i {
  position: relative;
  width: 54px;
  height: 54px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: var(--c);
  box-shadow:
    0 6px 14px rgba(0, 0, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.ph-app svg,
.ph-appbar svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: #fff;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ph-app em {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: #ff3b30;
  color: #fff;
  font-style: normal;
  font-size: 0.68rem;
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.15);
}
.ph-appbar {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.2rem 0 0.35rem;
  position: sticky;
  top: -4px;
  background: var(--bg);
  z-index: 1;
  border-bottom: 1px solid var(--line);
}
.ph-appbar b {
  font-family: var(--f-display);
  font-size: 1.25rem;
  flex: 1;
}
.ph-appbar i {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--c);
  display: grid;
  place-items: center;
}
.ph-appbar i svg {
  width: 20px;
  height: 20px;
}
.ph-back {
  border: 0;
  background: none;
  font-size: 2rem;
  line-height: 1;
  color: var(--info);
  cursor: pointer;
  padding: 0 0.3rem;
  min-width: 2.2rem;
  min-height: 2.2rem;
}
.ph-appbody {
  display: grid;
  gap: 0.5rem;
  padding-bottom: 0.4rem;
}
.ph-ava {
  width: var(--s);
  height: var(--s);
  flex: none;
  border-radius: 50%;
  background: var(--a);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: calc(var(--s) * 0.36);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
}
.ph-list {
  display: grid;
}
.ph-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 3.4rem;
  align-items: center;
  gap: 0.65rem;
  padding: 0.55rem 0.2rem;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
  position: relative;
}
.ph-rmain {
  display: grid;
  min-width: 0;
}
.ph-rmain b {
  font-size: 0.92rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ph-rmain small {
  font-size: 0.74rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ph-bond {
  height: 5px;
  border-radius: 3px;
  background: var(--sunken);
  overflow: hidden;
}
.ph-bond i {
  display: block;
  height: 100%;
  background: var(--glaze);
}
.ph-dot {
  position: absolute;
  right: 0;
  top: 0.35rem;
  font-style: normal;
  font-size: 0.62rem;
  font-weight: 700;
  color: #fff;
  background: #ff8a3d;
  border-radius: 999px;
  padding: 0 0.4rem;
}
.ph-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.8rem;
  align-items: center;
  padding: 0.6rem 0;
}
.ph-card > div {
  display: grid;
  gap: 0.25rem;
  min-width: 0;
}
.ph-name {
  font-family: var(--f-display);
  font-size: 1.15rem;
}
.ph-card small {
  color: var(--muted);
  font-size: 0.78rem;
}
.ph-balance {
  display: grid;
  justify-items: center;
  gap: 0.1rem;
  padding: 1rem;
  border-radius: 18px;
  background: linear-gradient(135deg, #e9a400, #f4c458);
  color: #2b1d00;
}
.ph-balance b {
  font-family: var(--f-mono);
  font-size: 1.7rem;
}
.ph-balance b.neg {
  color: #8b0000;
}
.ph-balance small {
  font-size: 0.78rem;
  opacity: 0.85;
}
.phone .opt {
  background: var(--panel);
}
.ph-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.3rem 0 0;
}
.ph-paused {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  background: rgba(255, 255, 255, 0.18);
  padding: 0.25rem 0.55rem;
  border-radius: 99px;
}
.ph-x {
  border: 0;
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  font-size: 0.85rem;
  border-radius: 99px;
  min-height: 2.1rem;
  padding: 0 0.8rem;
  background: rgba(255, 255, 255, 0.22);
  color: #fff;
}
.ph-appbar .ph-x {
  background: var(--line);
  color: var(--ink);
  padding: 0;
  width: 2.2rem;
  font-size: 1rem;
}
.ph-seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.35rem;
}
.ph-seg .mini {
  display: grid;
  padding: 0.45rem 0.2rem;
  font-weight: 700;
}
.ph-seg small {
  font-weight: 400;
  font-size: 0.68rem;
  opacity: 0.8;
}
.ph-prof {
  display: grid;
  gap: 0.8rem;
}
.ph-vol {
  display: grid;
  grid-template-columns: 5.5rem minmax(0, 1fr);
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  margin: 0.2rem 0 0.5rem;
}
.ph-vol input {
  width: 100%;
  accent-color: var(--glaze);
}
.hp-btn {
  position: relative;
}
.hp-btn kbd {
  margin-left: 0.25rem;
  color: var(--ink);
}
.hp-dot {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 99px;
  background: #ff3b30;
  color: #fff;
  font-style: normal;
  font-size: 0.68rem;
  font-weight: 700;
  display: grid;
  place-items: center;
  line-height: 1;
}
.dock-hp {
  position: relative;
}
.ph-notif {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 0.55rem;
  align-items: center;
  width: 100%;
  text-align: left;
  border: 0;
  background: rgba(255, 255, 255, 0.14);
  color: inherit;
  font: inherit;
  border-radius: 14px;
  padding: 0.45rem 0.55rem;
  margin-top: 0.35rem;
  cursor: pointer;
}
.ph-notif b {
  display: block;
  font-size: 0.85rem;
}
.ph-notif b em {
  font-style: normal;
  background: #ff3b30;
  border-radius: 99px;
  padding: 0 0.35rem;
  font-size: 0.68rem;
  margin-left: 0.2rem;
}
.ph-notif small {
  display: block;
  font-size: 0.78rem;
  opacity: 0.9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ph-notif time {
  font-size: 0.68rem;
  opacity: 0.75;
  align-self: start;
}
.ph-tname {
  display: grid;
  line-height: 1.1;
  font-size: 1rem !important;
  min-width: 0;
}
.ph-tname small {
  font-family: var(--f-body);
  font-weight: 400;
  font-size: 0.72rem;
  color: var(--muted);
}
.ph-chat {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.ph-thread {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  padding: 0.4rem 0;
  flex: 1;
}
.ph-day {
  align-self: center;
  font-size: 0.68rem;
  color: var(--muted);
  background: var(--line);
  border-radius: 99px;
  padding: 0.1rem 0.6rem;
  margin: 0.3rem 0;
}
.ph-msg {
  max-width: 82%;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.ph-msg span {
  padding: 0.45rem 0.7rem;
  border-radius: 16px;
  font-size: 0.88rem;
  line-height: 1.35;
}
.ph-msg time {
  font-size: 0.62rem;
  color: var(--muted);
  padding: 0 0.4rem;
}
.ph-msg.n {
  align-self: flex-start;
}
.ph-msg.n span {
  background: var(--panel);
  border: 1px solid var(--line);
  border-bottom-left-radius: 5px;
}
.ph-msg.m {
  align-self: flex-end;
  align-items: flex-end;
}
.ph-msg.m span {
  background: #2f7cf6;
  color: #fff;
  border-bottom-right-radius: 5px;
}
.ph-msg.typing span {
  color: var(--muted);
  font-style: italic;
}
.ph-sys {
  align-self: center;
  font-size: 0.72rem;
  color: var(--muted);
}
.ph-compose {
  position: sticky;
  bottom: -8px;
  background: var(--bg);
  padding: 0.45rem 0 0.5rem;
  border-top: 1px solid var(--line);
}
.ph-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.ph-chip {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  border-radius: 99px;
  padding: 0.45rem 0.8rem;
  cursor: pointer;
  min-height: 2.3rem;
}
.ph-chip.pri {
  border-color: #2f7cf6;
  color: #2f7cf6;
}
.ph-chip:disabled {
  opacity: 0.45;
  cursor: default;
}
.ph-cta {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}
.ph-rmeta {
  display: grid;
  justify-items: end;
  gap: 0.2rem;
  font-size: 0.68rem;
  color: var(--muted);
}
.ph-unread {
  font-style: normal;
  background: #2fb35a;
  color: #fff;
  border-radius: 99px;
  min-width: 1.2rem;
  padding: 0 0.3rem;
  text-align: center;
  font-weight: 700;
}
.ph-list .ph-row {
  grid-template-columns: auto minmax(0, 1fr) auto;
}
.ph-row small {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ph-screen.call {
  background: linear-gradient(180deg, #1d2b4a, #0e1424 70%);
  color: #fff;
}
.ph-call {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  gap: 0.6rem;
  padding: 0.6rem 0 0.4rem;
}
.ph-call-top {
  display: grid;
  justify-items: center;
  gap: 0.3rem;
  text-align: center;
  padding-top: 1.4rem;
}
.ph-call-top b {
  font-family: var(--f-display);
  font-size: 1.45rem;
}
.ph-call-top small {
  opacity: 0.75;
}
.ph-call-st {
  font-size: 0.85rem;
  opacity: 0.85;
  display: flex;
  gap: 0.4rem;
}
.ph-call.ring .ph-ava {
  animation: ring 1s ease-in-out infinite;
}
@keyframes ring {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(47, 179, 90, 0.6);
  }
  50% {
    box-shadow: 0 0 0 16px rgba(47, 179, 90, 0);
  }
}
@media (prefers-reduced-motion: reduce) {
  .ph-call.ring .ph-ava {
    animation: none;
  }
}
.ph-call-lines {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  justify-content: flex-end;
}
.ph-call-lines p {
  margin: 0;
  max-width: 85%;
  padding: 0.45rem 0.7rem;
  border-radius: 14px;
  font-size: 0.86rem;
  background: rgba(255, 255, 255, 0.12);
}
.ph-call-lines p.m {
  align-self: flex-end;
  background: #2f7cf6;
}
.ph-call-lines p.s {
  align-self: center;
  background: none;
  opacity: 0.7;
}
.ph-call-act {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  align-items: center;
  gap: 0.6rem;
  padding-bottom: 0.6rem;
}
.ph-call-act .ph-replies {
  width: 100%;
  justify-content: center;
}
.ph-call-act .ph-chip {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.25);
  color: #fff;
}
.ph-cbtn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  display: grid;
  place-items: center;
  align-content: center;
  position: relative;
  margin-bottom: 1rem;
}
.ph-cbtn small {
  position: absolute;
  top: 100%;
  margin-top: 0.3rem;
  font-size: 0.72rem;
  white-space: nowrap;
}
.ph-cbtn.no {
  background: #ff3b30;
}
.ph-cbtn.yes {
  background: #2fb35a;
}
@media (max-width: 700px) {
  .phone-wrap {

/* ================= visual polish ================= */
:root {
  --sky1: #ffd9c7;
  --sky2: #f9c6d6;
  --sky3: #eceff4;
  --lift: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 2px 6px rgba(25, 32, 45, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --sky1: #2a1f4f;
    --sky2: #3a2350;
    --sky3: #11151e;
    --lift: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 2px 8px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme='dark'] {
  --sky1: #2a1f4f;
  --sky2: #3a2350;
  --sky3: #11151e;
  --lift: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 2px 8px rgba(0, 0, 0, 0.35);
}

/* buttons: slightly raised, lift on hover, press down on click */
.btn,
.go,
.mini,
.pad,
.x,
.dock button {
  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease,
    border-color 0.12s,
    background 0.12s;
}
.btn {
  box-shadow: var(--lift);
}
.btn:hover {
  transform: translateY(-1px);
}
.btn:active,
.go:active,
.pad:active,
.dock button:active {
  transform: translateY(1px) scale(0.98);
}
.btn.primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--glaze) 82%, #fff), var(--glaze));
  box-shadow:
    0 4px 14px color-mix(in srgb, var(--glaze) 35%, transparent),
    0 1px 0 rgba(255, 255, 255, 0.35) inset;
}
.go {
  background: linear-gradient(180deg, color-mix(in srgb, var(--glaze) 82%, #fff), var(--glaze));
  box-shadow:
    0 4px 14px color-mix(in srgb, var(--glaze) 35%, transparent),
    0 1px 0 rgba(255, 255, 255, 0.35) inset;
}
.go:hover {
  transform: translateY(-1px);
}
.go.alt {
  background: var(--panel);
  box-shadow: var(--lift);
}
.pad {
  border-radius: 50%;
  background: linear-gradient(180deg, var(--panel), var(--sunken));
  box-shadow: var(--lift);
}
.x {
  box-shadow: var(--lift);
}
.x:hover {
  border-color: var(--glaze);
  color: var(--glaze);
}

/* menu: title screen with a dusk sky and clouds */
.menu-scene {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 78% 18%, color-mix(in srgb, var(--glaze) 22%, transparent), transparent 45%),
    linear-gradient(180deg, var(--sky1), var(--sky2) 55%, var(--sky3));
}
.menu-scene::before,
.menu-scene::after {
  content: '';
  position: absolute;
  width: 260px;
  height: 70px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  filter: blur(2px);
  box-shadow:
    60px -22px 0 -6px rgba(255, 255, 255, 0.55),
    130px 4px 0 -10px rgba(255, 255, 255, 0.5);
  animation: cloud 60s linear infinite;
}
.menu-scene::before {
  top: 14%;
  left: -300px;
}
.menu-scene::after {
  top: 34%;
  left: -300px;
  transform: scale(0.7);
  animation-duration: 85s;
  animation-delay: -40s;
  opacity: 0.7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .menu-scene::before,
  :root:not([data-theme='light']) .menu-scene::after {
    opacity: 0.12;
  }
}
@keyframes cloud {
  to {
    left: 110%;
  }
}
.menu-scene > .gut {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.menu-scene .menu {
  min-height: 0;
  flex: 1;
  padding-block: 3rem 1rem;
  position: relative;
  z-index: 1;
}
.menu h1 {
  text-shadow:
    0 3px 0 rgba(255, 255, 255, 0.5),
    0 14px 30px color-mix(in srgb, var(--glaze) 25%, transparent);
}
.menu h1 span {
  background: linear-gradient(180deg, color-mix(in srgb, var(--glaze) 75%, #fff), var(--glaze));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--glaze) 30%, transparent));
}
.menu .studio .donut {
  animation: spin 8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.menu-scene canvas.skyline {
  position: relative;
  z-index: 1;
  height: clamp(140px, 26vh, 230px);
  flex: none;
}
@media (prefers-reduced-motion: reduce) {
  .menu-scene::before,
  .menu-scene::after,
  .menu .studio .donut {
    animation: none;
  }
}

/* HUD: soft top card, glossy need bars with icons */
.hud {
  box-shadow: 0 2px 10px rgba(25, 32, 45, 0.06);
  position: relative;
  z-index: 2;
}
.need-top {
  align-items: center;
}
.need-top .nic {
  font-style: normal;
  font-size: 0.8rem;
  line-height: 1;
  margin-right: 0.3rem;
}
.need-top span:first-of-type {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar {
  height: 8px;
  border-radius: 99px;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
}
.bar > i {
  border-radius: 99px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 60%), var(--c, var(--glaze));
  transition: width 0.4s ease;
}
.need.low .bar > i {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 60%), var(--bad);
}
.speed {
  background: var(--sunken);
  border-radius: 9px;
  padding: 2px;
  gap: 2px;
}
.speed .mini {
  border-color: transparent;
  background: transparent;
}
.speed .mini.on {
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--lift);
  border-color: transparent;
}
.cash {
  padding: 0.1rem 0.5rem;
  border-radius: 8px;
  background: color-mix(in srgb, var(--sun) 12%, transparent);
}
.controls {
  box-shadow: 0 -2px 10px rgba(25, 32, 45, 0.06);
  position: relative;
  z-index: 2;
}

/* info cards over the canvas: frosted glass */
.feed > p,
.task,
.anote,
.toast {
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.feed > p,
.task {
  border-radius: 10px;
}
.toast {
  border-radius: 12px;
}

/* building panel: a sheet with a handle */
.panel {
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -14px 34px rgba(0, 0, 0, 0.22);
  padding-top: 1.3rem;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0.5rem;
  left: 50%;
  width: 42px;
  height: 4px;
  margin-left: -21px;
  border-radius: 99px;
  background: var(--line);
}
.opt {
  box-shadow: var(--lift);
  transition:
    transform 0.12s,
    border-color 0.12s,
    background 0.12s;
}
.opt:hover:not(:disabled) {
  transform: translateY(-1px);
}
.opt:disabled {
  box-shadow: none;
}
.opt-meta .cost {
  padding: 0.05rem 0.4rem;
  border-radius: 6px;
  background: color-mix(in srgb, var(--sun) 12%, transparent);
}
.sheet {
  border-radius: 18px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
}
.overlay {
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.actbar {
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
  border-radius: 18px;
}
.actbar .bar {
  height: 10px;
}
.dock button {
  box-shadow: var(--lift);
}
.choice,
.card {
  box-shadow: var(--lift);
}
.choice {
  transition:
    transform 0.12s,
    border-color 0.12s;
}
.choice:hover {
  transform: translateY(-2px);
}

/* bottom action bar: always one row with a fixed height; secondary actions become icon buttons on narrow screens */
.prompt {
  flex-wrap: nowrap;
  min-width: 0;
}
.go {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  white-space: nowrap;
  min-width: 0;
  flex: 0 1 auto;
}
.go .gl {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.go .gi {
  font-size: 1.05rem;
  line-height: 1;
}
.go .gd {
  display: none;
}
.prompt .hint {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 700px), (max-height: 520px) {
  .prompt {
    height: 3.6rem;
    gap: 0.4rem;
  }
  .prompt .go:not(.alt) ~ .go.ic {
    flex: none;
    width: 2.9rem;
    height: 2.9rem;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
  }
  .prompt .go:not(.alt) ~ .go.ic .gl {
    display: none;
  }
  .prompt .go.ic ~ .go.ic {
    width: 2.9rem;
    height: 2.9rem;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
  }
  .prompt .go.ic ~ .go.ic .gl {
    display: none;
  }
  .go .gi {
    font-size: 1.25rem;
  }
  .go .gd {
    display: inline;
    font-size: 1rem;
  }
  .go .gv {
    display: none;
  }

@media (max-height: 520px) and (min-width: 600px) {
  .prompt {
    height: 3rem;
  }
  .prompt .go:not(.alt) ~ .go.ic,
  .prompt .go.ic ~ .go.ic {
    width: 2.6rem;
    height: 2.6rem;
  }

@media (max-width: 380px) {
  .pad {
    width: 3rem;
    height: 3rem;
    font-size: 1.2rem;
  }
  .controls-in {
    gap: 0.3rem;
  }
  .prompt {
    gap: 0.3rem;
  }
  .prompt .go {
    padding: 0.5rem 0.7rem;
    font-size: 0.85rem;
  }

/* studio logo on the main menu */

/* ---------- title screen ---------- */
.ts {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background: #7fb8e6;
  display: flex;
  flex-direction: column;
}
#tscene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.ts-studio {
  position: absolute;
  z-index: 2;
  top: max(12px, env(safe-area-inset-top, 0px));
  left: max(14px, env(safe-area-inset-left, 0px));
  height: clamp(58px, 11vh, 92px);
  width: auto;
  aspect-ratio: 220/411;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
}
.ts-main {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
  flex: 1;
}
.ts-sign {
  position: relative;
  margin-top: clamp(2.6rem, 9vh, 5.5rem);
  padding: 0.7rem 1.5rem 0.9rem;
  background: #fff6e8;
  border: 3px solid #2b2d42;
  border-radius: 16px;
  box-shadow:
    0 6px 0 #2b2d42,
    0 16px 30px rgba(0, 0, 0, 0.22);
  transform: rotate(-2deg);
  transform-origin: 50% -60px;
  animation: sway 6s ease-in-out infinite;
}
.ts-sign::after {
  content: '';
  position: absolute;
  inset: 6px;
  border: 2px dashed #e2ac6c;
  border-radius: 10px;
  pointer-events: none;
}
.ts-rope {
  position: absolute;
  bottom: 100%;
  width: 3px;
  height: 100vh;
  background: #2b2d42;
}
.ts-rope.l {

/* ================= "board" skin: same style as the title screen ================= */
:root {
  --ol: #2b2d42;
  --board: #fff6e8;
  --btn: #ffffff;
  --sel: #ffe1ec;
  --hard: 0 4px 0 var(--ol);
  --hard-s: 0 3px 0 var(--ol);
}

/* pages (birth, childhood, obituary) over the town scene */
.ts-page {
  overflow: visible;
  min-height: 100dvh;
}
.ts-page #tscene {
  position: fixed;
}
.ts-page > .gut {
  position: relative;
  z-index: 1;
  padding-block: clamp(1rem, 5vh, 3rem);
}
.ts-page .page {
  background: var(--board);
  border: 3px solid var(--ol);
  border-radius: 20px;
  box-shadow:
    0 6px 0 var(--ol),
    0 18px 34px rgba(0, 0, 0, 0.22);
  padding: 1.4rem clamp(1rem, 4vw, 1.8rem) 1.6rem;
  position: relative;
}
.ts-page .page::after {
  content: '';
  position: absolute;
  inset: 7px;
  border: 2px dashed var(--dough);
  border-radius: 14px;
  pointer-events: none;
}
.page h2,
.sheet h3,
.panel-h h3,
.actbar b {
  font-weight: 800;
  color: var(--ol);
}
.studio {
  font-weight: 700;
}
.card {
  background: var(--btn);
  border: 2.5px solid var(--ol);
  border-radius: 14px;
  box-shadow: var(--hard-s);
}
.choice {
  background: var(--btn);
  border: 2.5px solid var(--ol);
  border-radius: 14px;
  box-shadow: var(--hard);
  transition:
    transform 0.1s,
    box-shadow 0.1s,
    background 0.1s;
}
.choice:hover,
.choice:focus-visible {
  background: var(--sel);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--ol);
  border-color: var(--ol);
}
.choice:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ol);
}
.track i {
  border: 2px solid var(--ol);
  height: 10px;
  border-radius: 99px;
  background: var(--btn);
}
.track i.done {
  background: var(--glaze);
}
.track i.now {
  background: var(--dough);
}
.trait {
  background: var(--sel);
  border-left: 4px solid var(--glaze);
  border-radius: 8px;
}

/* buttons */
.btn,
.go,
.mini,
.opt,
.x,
.pad,
.dock button {
  border: 2.5px solid var(--ol) !important;
  color: var(--ol);
}
.btn {
  background: var(--btn);
  border-radius: 12px;
  box-shadow: var(--hard-s);
  font-weight: 800;
}
.btn:hover {
  background: var(--sel);
  transform: translateY(-1px);
}
.btn.primary,
.go {
  background: var(--glaze) !important;
  color: #fff !important;
  box-shadow: var(--hard-s) !important;
  font-weight: 800;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
}
.btn.primary:hover,
.go:hover {
  background: #ec5a8e !important;
}
.btn.ghost {
  background: var(--btn);
}
.btn:active,
.go:active,
.mini:active,
.opt:active:not(:disabled),
.pad:active,
.dock button:active {
  transform: translateY(3px) !important;
  box-shadow: 0 0 0 var(--ol) !important;
}
.go.alt {
  background: var(--btn) !important;
  color: var(--ol) !important;
  text-shadow: none;
}
/* ride button: filled green while you are on a vehicle, white while on foot */
.go.alt.ride.on {
  background: var(--good) !important;
  color: #fff !important;
}
.go.alt.ride.on:hover {
  background: #23916f !important;
}
.go kbd,
.btn kbd {
  border-color: currentColor;
  background: transparent;
  color: inherit;
}
/* round icon-only buttons on small screens: the key hint becomes a small badge on the corner */
@media (max-width: 700px), (max-height: 520px) {
  .prompt .go.ic {
    position: relative;
  }
  .prompt .go:not(.alt) ~ .go.ic kbd,
  .prompt .go.ic ~ .go.ic kbd {
    position: absolute;
    right: -0.3rem;
    bottom: -0.3rem;
    font-size: 0.6rem;
    line-height: 1.15;
    padding: 0 0.22rem;
    border: 1.5px solid var(--ol);
    border-radius: 5px;
    background: var(--btn);
    color: var(--ol);
  }
}
.mini {
  background: var(--btn);
  border-radius: 9px;
  box-shadow: 0 2px 0 var(--ol);
  font-weight: 800;
}
.mini.on {
  background: var(--ol);
  color: #fff;
}
.mini:hover:not(:disabled) {
  background: var(--sel);
}
.mini.on:hover {
  background: var(--ol);
}
.x {
  background: var(--btn);
  border-radius: 50%;
  box-shadow: var(--hard-s);
  font-weight: 800;
}
.x:hover {
  background: var(--sel);
  color: var(--ol);
}
.pad {
  background: var(--btn);
  border-radius: 50%;
  box-shadow: var(--hard);
  color: var(--ol);
}
.pad:hover {
  background: var(--sel);
}

/* HUD */
.hud {
  background: var(--board);
  border-bottom: 3px solid var(--ol);
  box-shadow: none;
}
.who b {
  font-weight: 800;
  color: var(--ol);
}
.who .donut {

}
.clock .t {

}
.clock {

  background: var(--btn);
  box-shadow: 0 2px 0 var(--ol);

.cash {

.bar {

/* bottom controls */
.controls {

.dock button {

.dock small {

/* building panel & sheets */
.panel {
  background: var(--board);

  box-shadow: 0 -6px 0 rgba(43, 45, 66, 0.12);
}
.panel::before {
  background: var(--ol);

}
.opt {
  background: var(--btn);

.opt-main b {

.opt-meta .cost {

.box {

  border-radius: 12px;

.status {

.label.sub {

.overlay {

.sheet {
  background: var(--board);
  border: 3px solid var(--ol);
  border-radius: 18px;

    0 20px 40px rgba(0, 0, 0, 0.25);

.sel,
.field input {
  border: 2px solid var(--ol);
  border-radius: 10px;
  background: var(--btn);
  color: var(--ol);
}
.node {
  background: var(--btn);
  border: 2px solid var(--ol);
  box-shadow: 0 2px 0 var(--ol);
}
.node.self {
  background: var(--sel);
}
.chip {
  border: 1.5px solid var(--ol);
  background: var(--sel);
  color: var(--ol);
}
.confirm {
  border: 2.5px solid var(--ol);
  background: var(--btn);
  border-radius: 12px;
  box-shadow: var(--hard-s);
}

/* cards over the canvas: framed white boards */
.feed > p,
.task,
.anote,
.toast,
.actbar {
  background: var(--btn);

.feed > p.bad {

}
.feed > p.tip {
  color: #2251a3;
}
.task b {
  color: #1d7a63;
}
.anote {
  border-left: 6px solid var(--glaze);
}
.anote-h small,
.anote-m {
  opacity: 1;
  color: #5b5670;
}
.anote-c i {
  background: var(--board);
  border: 1.5px solid var(--ol);
}
.anote-c i.up {
  color: #1d7a63;
}
.anote-c i.dn {
  color: #c0392b;
}
.toast b {
  color: var(--glaze);
}
.actbar {
  border-radius: 18px;
  box-shadow:
    var(--hard),
    0 16px 30px rgba(0, 0, 0, 0.25);
}
.bub {
  background: var(--btn);
  border: 2px solid var(--ol);
}
.bub.me {
  background: var(--sel);
  border: 2px solid var(--ol);
}

/* phone: keeps a phone frame, app content uses the board style */
.ph-screen {
  background: var(--board);
}
.ph-appbar {
  background: var(--board);
  border-bottom: 2.5px solid var(--ol);
}
.ph-appbar b {
  font-weight: 800;
  color: var(--ol);
}
.ph-back {
  color: var(--glaze);
}
.ph-x {
  border: 2px solid rgba(255, 255, 255, 0.9);
}
.ph-appbar .ph-x {
  background: var(--btn);
  border: 2px solid var(--ol);
  color: var(--ol);
  box-shadow: 0 2px 0 var(--ol);
}
.ph-row {
  border-bottom: 1.5px dashed #d9c9ad;
}
.ph-chip {
  border: 2px solid var(--ol);
  box-shadow: 0 2px 0 var(--ol);
  background: var(--btn);
  color: var(--ol);
}
.ph-chip.pri {
  background: var(--sel);
  color: var(--ol);
  border-color: var(--ol);
}
.ph-msg.n span {
  background: var(--btn);
  border: 2px solid var(--ol);
}
.ph-msg.m span {
  background: var(--glaze);
  border: 2px solid var(--ol);
}
.ph-compose {
  background: var(--board);
  border-top: 2.5px solid var(--ol);
}
.ph-balance {
  border: 2.5px solid var(--ol);
  box-shadow: var(--hard-s);
}
.ph-app i {
  border: 2.5px solid var(--ol);
  box-shadow: 0 3px 0 var(--ol);
}
.ph-unread {
  border: 1.5px solid var(--ol);
}
.wk span {
  border: 2px dashed #cdbb9b;
}
.wk span.on {
  border: 2px solid var(--ol);
  background: var(--sel);
  color: var(--ol);
}
.wk span.now {
  outline: 2.5px solid var(--glaze);
}

.dock button {
  align-content: center;
}
.card .mini:disabled {
  background: var(--ol);
  color: #fff;
  opacity: 1;
  cursor: default;
}

.go svg.gi {
  width: 1.25rem;
  height: 1.25rem;
  flex: none;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.go .gd {
  display: none;
}
@media (max-width: 700px), (max-height: 520px) {
  .go svg.gi {
    width: 1.4rem;
    height: 1.4rem;
  }
  .go svg.gd {
    display: block;
    width: 1.15rem;
    height: 1.15rem;
  }
  /* only the round icon-only buttons centre their icon; an icon button that comes first keeps icon + label in a row */
  .prompt .go:not(.alt) ~ .go.ic,
  .prompt .go.ic ~ .go.ic {
    display: grid;
    place-items: center;
  }
}

/* inside the Holy Doughnut website player: the fullscreen button sits bottom-left, leave room for the ◀ button */
.embedded .controls-in {
  padding-left: 52px;
}
.embedded .dock {
  padding-left: 52px;
}
/* very narrow screens (e.g. the website player on a phone): compact HUD so the money is never cut off */
@media (max-width: 400px) {
  .hud-top > * {
    min-width: 0;
  }
  .who {
    flex: 1 1 0;
  }
  .who b {
    font-size: 0.9rem;
  }
  .clock {
    padding: 0.1rem 0.4rem;
  }
  .clock .t {
    font-size: 1rem;
  }
  .clock #h-day {
    font-size: 0.6rem;
  }
  .cash {
    font-size: 0.8rem;
    padding: 0.05rem 0.35rem;
    flex: none;
  }
  /* HUD needs show only their icon here; profile skill rows (no icon) keep their names */
  .need-top .nic + span {
    display: none;
  }
  .need-top {
    justify-content: space-between;
  }
  .need-top .nic {
    font-size: 0.9rem;
  }
}

/* studio splash (28-splash.js): animated Holy Doughnut Studio logo over the title screen at start */
.splash {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse 60% 55% at 50% 44%, #ffffff 0%, transparent 70%), #edf5f6;
  cursor: pointer;
  transition: opacity 0.45s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.splash.out {
  opacity: 0;
}
.splash svg {
  width: min(70vw, 44vh);
  height: auto;
  max-height: 80vh;
  overflow: visible;
}
.splash-go {
  position: absolute;
  left: 0;
  right: 0;
  bottom: max(9vh, calc(env(safe-area-inset-bottom, 0px) + 24px));
  text-align: center;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #2b2d42;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.splash.ready .splash-go {
  opacity: 1;
  animation: splash-go 1.6s ease-in-out 0.6s infinite;
}
@keyframes splash-go {
  50% {
    opacity: 0.35;
  }
}
@media (prefers-reduced-motion: reduce) {
  .splash.ready .splash-go {
    animation: none;
  }
}
</style>

</head>
