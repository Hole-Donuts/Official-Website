<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e8">
<meta name="description" content="Donut Town: a life sim by Holy Doughnut Studio.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>html,body{margin:0;padding:0}</style>
<title>Donut Town</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: layar penuh. HUD (atas) → dunia jalan kota side-scrolling (canvas) → kontrol (bawah).
   Panel gedung muncul sebagai lembar di atas kanvas. */
:root{
  --bg:#fff6e8; --panel:#ffffff; --sunken:#f3e6cf; --ink:#2b2d42; --muted:#6f6a7d; --line:#e3d3b8;
  --glaze:#e0457b; --glaze-soft:#ffe1ec; --on-glaze:#ffffff; --dough:#e2ac6c;
  --sun:#b7791f; --good:#1d7a63; --bad:#c0392b; --info:#2251a3; --tower:#9aa6bd; --window:#f4c458;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --scale:1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#fff6e8; --panel:#ffffff; --sunken:#f3e6cf; --ink:#2b2d42; --muted:#6f6a7d; --line:#e3d3b8;
  --glaze:#e0457b; --glaze-soft:#ffe1ec; --on-glaze:#ffffff; --dough:#e2ac6c;
  --sun:#b7791f; --good:#1d7a63; --bad:#c0392b; --info:#2251a3; --tower:#9aa6bd; --window:#f4c458; color-scheme:light; } }
:root[data-theme="dark"]{
  --bg:#fff6e8; --panel:#ffffff; --sunken:#f3e6cf; --ink:#2b2d42; --muted:#6f6a7d; --line:#e3d3b8;
  --glaze:#e0457b; --glaze-soft:#ffe1ec; --on-glaze:#ffffff; --dough:#e2ac6c;
  --sun:#b7791f; --good:#1d7a63; --bad:#c0392b; --info:#2251a3; --tower:#9aa6bd; --window:#f4c458; color-scheme:light; }

html{font-size:calc(15px * var(--scale))}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glaze);outline-offset:2px}
#app{min-height:100%}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:46rem;margin:0 auto;width:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);margin:0}
.donut{width:1.6rem;height:1.6rem;border-radius:50%;flex:none;background:radial-gradient(circle,transparent 0 27%,var(--glaze) 28% 58%,var(--dough) 60% 100%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid var(--line);background:var(--panel);padding:.65rem 1.1rem;border-radius:999px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--glaze)}
.btn.primary{background:var(--glaze);color:var(--on-glaze);border-color:var(--glaze)}
.btn.ghost{background:transparent}
.btn.small{padding:.35rem .8rem;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem .8rem;border:1px dashed var(--bad);border-radius:10px;font-size:.9rem}

/* menu & halaman */
.menu{min-height:100vh;display:grid;grid-template-rows:1fr auto;gap:1.5rem;padding-block:2rem 0}
.menu-body{display:flex;flex-direction:column;justify-content:center;gap:1.3rem}
.studio{display:flex;align-items:center;gap:.6rem;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.menu h1{font-size:clamp(3.2rem,12vw,6.5rem);font-weight:800;letter-spacing:-.04em;line-height:.9}
.menu h1 span{color:var(--glaze)}
.lede{font-size:1.15rem;max-width:32rem;margin:0}
.keys{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.85rem;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;background:var(--panel);color:var(--ink)}
canvas.skyline{display:block;width:100%;height:150px;max-width:100%}
.page{padding-block:1.5rem 2.5rem;display:grid;gap:1.4rem}
.page h2{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;display:grid;gap:.8rem}
.field{display:grid;gap:.15rem}
.field input{font:inherit;padding:.5rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.kv{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:.25rem .6rem;font-size:.93rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;font-size:.8rem;padding:.15rem .6rem;border-radius:999px;background:var(--glaze-soft);color:var(--glaze);font-weight:700}
.trait{padding:.5rem .75rem;border-left:3px solid var(--glaze);background:var(--bg);font-size:.9rem}
.trait b{font-family:var(--f-display)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem}
.choice{display:grid;gap:.2rem;text-align:left;padding:1rem;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.choice:hover{border-color:var(--glaze)}
.choice b{font-family:var(--f-display);font-size:1.1rem}
.choice span{font-size:.85rem;color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.track i{height:6px;border-radius:3px;background:var(--sunken)} .track i.done{background:var(--glaze)} .track i.now{background:var(--ink)}
.memories{list-style:none;margin:0;padding:0;display:grid;gap:.4rem;font-size:.95rem}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:.3rem .65rem;font-size:.82rem;cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--glaze)} .mini:disabled{opacity:.45;cursor:not-allowed}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- layar permainan ---------- */
#app.playing{height:100%;display:flex;flex-direction:column}
.hud{background:var(--bg);border-bottom:1px solid var(--line);padding-block:.5rem;display:grid;gap:.45rem;flex:none}
.hud-top{display:flex;align-items:center;gap:.4rem .8rem;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:.5rem;min-width:0;flex:1 1 9rem}
@media (max-width:560px){.loc-name{display:none}.hud .btn.small{padding:.3rem .6rem;font-size:.8rem}.speed .mini{padding:.25rem .45rem;font-size:.75rem}.hud-top{gap:.35rem .5rem}}
.who b{font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-mono);display:flex;gap:.5rem;align-items:baseline;font-size:.82rem}
.clock .t{font-weight:700;font-size:1.25rem}
.speed{display:flex;gap:.2rem}
.cash{font-family:var(--f-mono);font-weight:700;color:var(--sun);font-size:1rem}
.cash.neg{color:var(--bad)}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem .9rem}
@media (max-width:520px){.needs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.need{display:grid;gap:.15rem;min-width:0}
.need-top{display:flex;justify-content:space-between;font-size:.76rem;gap:.3rem;font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--c,var(--glaze))}
.need.low .need-top{color:var(--bad)} .need.low .bar>i{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.need.low .bar{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.45}}

.stage{position:relative;flex:1;min-height:260px;overflow:hidden;background:#0b1026;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.feed{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;display:grid;gap:.3rem;max-width:min(26rem,52%);pointer-events:none}
.feed>p{margin:0;background:rgba(12,16,30,.72);color:#f3f4f8;padding:.3rem .6rem;border-radius:8px;font-size:.85rem;transition:opacity .6s}
.anote{background:rgba(12,16,30,.84);color:#f3f4f8;border-radius:10px;border-left:3px solid var(--glaze);padding:.45rem .65rem .5rem;display:grid;gap:.25rem;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:anote-in .35s ease-out}
.anote-h{display:flex;align-items:baseline;gap:.4rem;flex-wrap:wrap}.anote-h b{font-size:.9rem}.anote-h small{font-size:.72rem;opacity:.7}
.anote-ic{font-size:.95rem}.anote-m{margin:0;font-size:.8rem;opacity:.85;line-height:1.35}
.anote-c{display:flex;flex-wrap:wrap;gap:.25rem}.anote-c i{font-style:normal;font-size:.72rem;font-weight:700;padding:.08rem .45rem;border-radius:99px;background:rgba(255,255,255,.1)}
.anote-c i.up{color:#8ff0cf}.anote-c i.dn{color:#ffb4a3}.anote-c i.money{font-family:var(--f-mono)}
@keyframes anote-in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anote{animation:none}}
.feed>p.good{color:#8ff0cf} .feed>p.bad{color:#ffb4a3} .feed>p.mile{color:#ffc1d6;font-weight:700} .feed>p.tip{color:#bcd0ff}
.task{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;max-width:min(17rem,45%);background:rgba(12,16,30,.78);color:#f3f4f8;padding:.4rem .65rem;border-radius:8px;font-size:.82rem;pointer-events:none}
.task:empty{display:none}
.task b{color:#9ff0c9}
.actbar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(22rem,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;display:grid;gap:.6rem;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.actbar b{font-family:var(--f-display);font-size:1.1rem}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding-block:.9rem 1rem}
.panel-in{max-width:40rem;margin:0 auto;display:grid;gap:.5rem}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.panel-h h3{font-size:1.25rem}
.status{font-size:.75rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.status.off{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.x{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:2.2rem;height:2.2rem;cursor:pointer;flex:none;font-size:1.1rem;line-height:1}
.sub{margin-top:.3rem}
.opt{display:flex;justify-content:space-between;align-items:center;gap:.8rem;text-align:left;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--glaze);background:var(--panel)}
.opt-main{min-width:0;display:grid;gap:.05rem}
.opt-main b{font-weight:700}
.opt-main small{font-size:.82rem;color:var(--good)}
.opt:disabled{cursor:not-allowed;background:transparent}
.opt:disabled b{color:var(--muted)} .opt:disabled small{color:var(--bad)}
.opt-meta{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);text-align:right;white-space:nowrap;display:grid}
.opt-meta .cost{color:var(--sun);font-weight:700}
.box{border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;display:grid;gap:.35rem;background:var(--bg)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}.wk span{text-align:center;font-size:.72rem;font-weight:700;padding:.3rem 0;border-radius:7px;border:1px dashed var(--line);color:var(--muted)}
.wk span.on{background:var(--glaze-soft);color:var(--glaze);border:1px solid transparent}.wk span.now{outline:2px solid var(--ink);outline-offset:1px}
.box-h{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;align-items:baseline}
.box-h b{font-family:var(--f-display)}
.sheet.wide{width:min(46rem,100%)}
.tree{display:grid;gap:1.1rem}
.gen{display:grid;gap:.4rem;position:relative}
.gen+.gen::before{content:"";position:absolute;left:50%;top:-1.1rem;height:1.1rem;border-left:2px solid var(--line)}
.nodes{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.node{display:grid;gap:.05rem;min-width:7.5rem;max-width:11rem;padding:.45rem .6rem;border:1px solid var(--line);border-radius:9px;background:var(--bg);text-align:center;font-size:.85rem}
.node b{font-family:var(--f-display);font-size:.92rem}
.node small{color:var(--muted);font-size:.74rem}
.node.self{border-color:var(--glaze);background:var(--glaze-soft)}
.node.dead{opacity:.55}
.node.unknown{border-style:dashed;color:var(--muted)}
.node .tag{justify-self:center;font-size:.68rem;font-weight:700;padding:0 .4rem;border-radius:999px;background:var(--ink);color:var(--bg);margin-top:.15rem}
.gen .label{text-align:center}
.chat{display:grid;gap:.4rem;max-height:13rem;overflow:auto;padding:.2rem 0}
@media (max-height:860px){.chat{max-height:8.5rem}}
.bub{max-width:85%;padding:.45rem .7rem;border-radius:12px;font-size:.92rem;background:var(--bg);border:1px solid var(--line);justify-self:start}
.bub span{display:block;font-size:.7rem;font-weight:700;color:var(--muted)}
.bub.me{justify-self:end;background:var(--glaze-soft);border-color:transparent}
.choices-row{display:flex;flex-wrap:wrap;gap:.35rem}
.mini.say{padding:.45rem .75rem;font-size:.85rem}
.sel{font:inherit;padding:.55rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}

.controls{flex:none;background:var(--bg);border-top:1px solid var(--line);padding-block:.55rem calc(.55rem + env(safe-area-inset-bottom,0px))}
.controls-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center}
.pad{width:3.4rem;height:3.4rem;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:1.4rem;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.pad:active{background:var(--sunken)}
.prompt{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;align-items:center;min-height:3.4rem;text-align:center}
.prompt .hint{font-size:.85rem;color:var(--muted)}
.go{border:0;background:var(--glaze);color:var(--on-glaze);border-radius:999px;padding:.6rem 1.1rem;font-weight:700;cursor:pointer}
.go.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}

/* ---------- HP dalam game ---------- */
.phone-wrap{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:10px}
.ph-backdrop{position:absolute;inset:0;background:rgba(8,12,28,.45)}
.phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 20px));height:min(720px,calc(100% - 20px));background:#0c0e13;border-radius:44px;padding:9px;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 2px #2b303b,inset 0 0 0 4px #0c0e13,inset 0 0 0 5px #3a404c}
.phone::before{content:"";position:absolute;right:-3px;top:110px;width:3px;height:56px;border-radius:0 3px 3px 0;background:#2b303b}
.phone::after{content:"";position:absolute;left:-3px;top:90px;width:3px;height:36px;border-radius:3px 0 0 3px;background:#2b303b;box-shadow:0 50px 0 #2b303b}
.ph-screen{position:relative;height:100%;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.ph-screen.home{background:radial-gradient(120% 70% at 20% 0%,#ff9ab8 0%,transparent 60%),linear-gradient(165deg,#ff6d98 0%,#8a5cf6 55%,#24206b 100%);color:#fff}
.ph-notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:16px;background:#0c0e13;z-index:3}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;font-size:.74rem;font-weight:700;flex:none;position:relative;z-index:2}
.ph-sig{display:flex;align-items:center;gap:.3rem;font-size:.68rem}
.ph-bars{display:inline-flex;align-items:flex-end;gap:1px;height:10px}.ph-bars i{width:3px;background:currentColor;border-radius:1px}
.ph-bars i:nth-child(1){height:3px}.ph-bars i:nth-child(2){height:5px}.ph-bars i:nth-child(3){height:7px}.ph-bars i:nth-child(4){height:10px}
.ph-batt{display:inline-block;width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;padding:1px;position:relative}
.ph-batt::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.ph-batt i{display:block;height:100%;background:currentColor;border-radius:1px}
.ph-body{flex:1;overflow:auto;padding:4px 14px 8px;min-height:0;display:flex;flex-direction:column;gap:.55rem}
.ph-homebar{flex:none;height:24px;display:grid;place-items:center;background:none;border:0;cursor:pointer}
.ph-homebar i{width:118px;height:5px;border-radius:3px;background:currentColor;opacity:.55}
.ph-hero{text-align:center;padding:.8rem 0 .3rem}
.ph-bigclock{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;letter-spacing:-.02em}
.ph-date{font-size:.85rem;opacity:.9;margin-top:.25rem}
.ph-widget{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:18px;padding:.6rem .8rem;display:grid;gap:.25rem}
.ph-widget p{margin:0;font-size:.8rem;line-height:1.35}
.ph-wlabel{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.ph-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem .2rem;margin-top:auto;padding:.5rem .2rem .4rem}
.ph-app{display:grid;justify-items:center;gap:.3rem;background:none;border:0;color:inherit;cursor:pointer;font-size:.7rem;font-weight:700;min-width:0}.ph-app span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-app i{position:relative;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c);box-shadow:0 6px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.ph-app svg,.ph-appbar svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ph-app em{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#ff3b30;color:#fff;font-style:normal;font-size:.68rem;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.ph-appbar{display:flex;align-items:center;gap:.4rem;padding:.2rem 0 .35rem;position:sticky;top:-4px;background:var(--bg);z-index:1;border-bottom:1px solid var(--line)}
.ph-appbar b{font-family:var(--f-display);font-size:1.25rem;flex:1}
.ph-appbar i{width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center}.ph-appbar i svg{width:20px;height:20px}
.ph-back{border:0;background:none;font-size:2rem;line-height:1;color:var(--info);cursor:pointer;padding:0 .3rem;min-width:2.2rem;min-height:2.2rem}
.ph-appbody{display:grid;gap:.5rem;padding-bottom:.4rem}

/* ================= polish visual ================= */
:root{--sky1:#ffd9c7;--sky2:#f9c6d6;--sky3:#eceff4;--lift:0 1px 0 rgba(255,255,255,.6) inset,0 2px 6px rgba(25,32,45,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky1:#2a1f4f;--sky2:#3a2350;--sky3:#11151e;--lift:0 1px 0 rgba(255,255,255,.05) inset,0 2px 8px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--sky1:#2a1f4f;--sky2:#3a2350;--sky3:#11151e;--lift:0 1px 0 rgba(255,255,255,.05) inset,0 2px 8px rgba(0,0,0,.35)}

/* tombol: sedikit timbul, terangkat saat hover, tertekan saat diklik */
.btn,.go,.mini,.pad,.x,.dock button{transition:transform .12s ease,box-shadow .12s ease,border-color .12s,background .12s}
.btn{box-shadow:var(--lift)}
.btn:hover{transform:translateY(-1px)}
.btn:active,.go:active,.pad:active,.dock button:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--glaze) 82%,#fff),var(--glaze));box-shadow:0 4px 14px color-mix(in srgb,var(--glaze) 35%,transparent),0 1px 0 rgba(255,255,255,.35) inset}
.go{background:linear-gradient(180deg,color-mix(in srgb,var(--glaze) 82%,#fff),var(--glaze));box-shadow:0 4px 14px color-mix(in srgb,var(--glaze) 35%,transparent),0 1px 0 rgba(255,255,255,.35) inset}
.go:hover{transform:translateY(-1px)}
.go.alt{background:var(--panel);box-shadow:var(--lift)}
.pad{border-radius:50%;background:linear-gradient(180deg,var(--panel),var(--sunken));box-shadow:var(--lift)}
.x{box-shadow:var(--lift)}
.x:hover{border-color:var(--glaze);color:var(--glaze)}

/* menu: layar judul dengan langit senja & awan */
.menu-scene{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse at 78% 18%,color-mix(in srgb,var(--glaze) 22%,transparent),transparent 45%),linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3))}
.menu-scene::before,.menu-scene::after{content:"";position:absolute;width:260px;height:70px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(2px);
  box-shadow:60px -22px 0 -6px rgba(255,255,255,.55),130px 4px 0 -10px rgba(255,255,255,.5);animation:cloud 60s linear infinite}
.menu-scene::before{top:14%;left:-300px}
.menu-scene::after{top:34%;left:-300px;transform:scale(.7);animation-duration:85s;animation-delay:-40s;opacity:.7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .menu-scene::before,:root:not([data-theme="light"]) .menu-scene::after{opacity:.12}}
@keyframes cloud{to{left:110%}}
.menu-scene>.gut{flex:1;display:flex;flex-direction:column;position:relative;z-index:1}
.menu-scene .menu{min-height:0;flex:1;padding-block:3rem 1rem;position:relative;z-index:1}
.menu h1{text-shadow:0 3px 0 rgba(255,255,255,.5),0 14px 30px color-mix(in srgb,var(--glaze) 25%,transparent)}
.menu h1 span{background:linear-gradient(180deg,color-mix(in srgb,var(--glaze) 75%,#fff),var(--glaze));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--glaze) 30%,transparent))}
.menu .studio .donut{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-scene canvas.skyline{position:relative;z-index:1;height:clamp(140px,26vh,230px);flex:none}
@media (prefers-reduced-motion:reduce){.menu-scene::before,.menu-scene::after,.menu .studio .donut{animation:none}}

/* HUD: kartu atas yang lembut, bar kebutuhan berkilau dengan ikon */
.hud{box-shadow:0 2px 10px rgba(25,32,45,.06);position:relative;z-index:2}
.need-top{align-items:center}
.need-top .nic{font-style:normal;font-size:.8rem;line-height:1;margin-right:.3rem}
.need-top span:first-of-type{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.bar>i{border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 60%),var(--c,var(--glaze));transition:width .4s ease}
.need.low .bar>i{background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 60%),var(--bad)}
.speed{background:var(--sunken);border-radius:9px;padding:2px;gap:2px}
.speed .mini{border-color:transparent;background:transparent}
.speed .mini.on{background:var(--panel);color:var(--ink);box-shadow:var(--lift);border-color:transparent}
.cash{padding:.1rem .5rem;border-radius:8px;background:color-mix(in srgb,var(--sun) 12%,transparent)}
.controls{box-shadow:0 -2px 10px rgba(25,32,45,.06);position:relative;z-index:2}

/* kartu info di atas kanvas: kaca buram */
.feed>p,.task,.anote,.toast{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08)}
.feed>p,.task{border-radius:10px}
.toast{border-radius:12px}

/* panel gedung: lembar dengan pegangan */
.panel{border-radius:20px 20px 0 0;box-shadow:0 -14px 34px rgba(0,0,0,.22);padding-top:1.3rem}
.panel::before{content:"";position:absolute;top:.5rem;left:50%;width:42px;height:4px;margin-left:-21px;border-radius:99px;background:var(--line)}
.opt{box-shadow:var(--lift);transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateY(-1px)}
.opt:disabled{box-shadow:none}
.opt-meta .cost{padding:.05rem .4rem;border-radius:6px;background:color-mix(in srgb,var(--sun) 12%,transparent)}
.sheet{border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.overlay{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.actbar{box-shadow:0 16px 40px rgba(0,0,0,.3);border-radius:18px}
.actbar .bar{height:10px}
.dock button{box-shadow:var(--lift)}
.choice,.card{box-shadow:var(--lift)}
.choice{transition:transform .12s,border-color .12s}.choice:hover{transform:translateY(-2px)}

.ts{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#7fb8e6;display:flex;flex-direction:column}
#tscene{position:absolute;inset:0;width:100%;height:100%;display:block}
.ts-studio{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));height:clamp(58px,11vh,92px);width:auto;aspect-ratio:220/411;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.ts-main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:0 16px;flex:1}
.ts-sign{position:relative;margin-top:clamp(2.6rem,9vh,5.5rem);padding:.7rem 1.5rem .9rem;background:#fff6e8;border:3px solid #2b2d42;border-radius:16px;
  box-shadow:0 6px 0 #2b2d42,0 16px 30px rgba(0,0,0,.22);transform:rotate(-2deg);transform-origin:50% -60px;animation:sway 6s ease-in-out infinite}
.ts-sign::after{content:"";position:absolute;inset:6px;border:2px dashed #e2ac6c;border-radius:10px;pointer-events:none}
.ts-rope{position:absolute;bottom:100%;width:3px;height:100vh;background:#2b2d42}.ts-rope.l{left:22%}.ts-rope.r{right:22%}
@keyframes sway{50%{transform:rotate(1.5deg)}}
.ts-logo{font-family:var(--f-display);font-weight:800;font-size:clamp(2.7rem,10vw,4.8rem);line-height:.88;letter-spacing:-.03em;color:#2b2d42;text-align:center;display:grid}
.ts-town{color:#e0457b}
.ts-o{display:inline-block;width:.74em;height:.74em;margin:0 .02em;vertical-align:-.02em;border-radius:50%;border:.06em solid #2b2d42;
  background:radial-gradient(circle,transparent 0 23%,#2b2d42 24% 27%,#f06292 28% 56%,#e2ac6c 58%);animation:spin 9s linear infinite;position:relative}
.ts-o::after{content:"";position:absolute;inset:16%;border-radius:50%;background:conic-gradient(from 10deg,#ffd166 0 4deg,transparent 4deg 40deg,#06d6a0 40deg 44deg,transparent 44deg 95deg,#fff 95deg 99deg,transparent 99deg 150deg,#118ab2 150deg 154deg,transparent 154deg 210deg,#ffd166 210deg 214deg,transparent 214deg 270deg,#06d6a0 270deg 274deg,transparent 274deg 320deg,#fff 320deg 324deg,transparent 324deg);
  -webkit-mask:radial-gradient(circle,transparent 0 38%,#000 40%);mask:radial-gradient(circle,transparent 0 38%,#000 40%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ts-menu{display:grid;gap:.6rem;width:min(16rem,100%);margin-top:clamp(1.4rem,5vh,2.6rem)}
.ts-item{position:relative;display:grid;justify-items:center;gap:0;padding:.65rem 1rem;border:3px solid #2b2d42;border-radius:14px;background:#fff;color:#2b2d42;font:inherit;
  box-shadow:0 4px 0 #2b2d42;cursor:pointer;transition:transform .1s,box-shadow .1s,background .1s;touch-action:manipulation}
.ts-item b{font-family:var(--f-display);font-weight:800;font-size:1.12rem;line-height:1.1}
.ts-item small{font-size:.75rem;font-weight:700;color:#7a6f86}
.ts-item.sel{background:#ffe1ec;transform:translateY(-2px);box-shadow:0 6px 0 #2b2d42}
.ts-item.sel::before{content:"";position:absolute;left:-2.2rem;top:50%;width:1.5rem;height:1.5rem;margin-top:-.75rem;border-radius:50%;border:2.5px solid #2b2d42;
  background:radial-gradient(circle,transparent 0 26%,#2b2d42 27% 32%,#f06292 33% 60%,#e2ac6c 62%);animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateX(5px)}}
.ts-item:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2d42}
.ts-item:focus-visible{outline:3px solid #118ab2;outline-offset:3px}
.ts-confirm{display:grid;gap:.6rem;justify-items:center;padding:.9rem;border:3px solid #2b2d42;border-radius:14px;background:#fff;color:#2b2d42;box-shadow:0 4px 0 #2b2d42;text-align:center}
.ts-confirm div{display:flex;gap:.5rem}.ts-item.sm{padding:.45rem .8rem}.ts-item.sm b,.ts-item.sm{font-size:.9rem;font-weight:800}
.ts-ver{position:absolute;z-index:1;right:max(12px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));font-size:.72rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@media (max-height:560px) and (orientation:landscape){
  .ts-main{flex-direction:row;justify-content:center;align-items:flex-start;gap:3rem}
  .ts-sign{margin-top:2.6rem}.ts-logo{font-size:2.6rem}.ts-menu{margin-top:1.6rem;gap:.45rem;width:13rem}.ts-item{padding:.45rem .8rem}.ts-item b{font-size:1rem}
  .ts-studio{height:56px}}
@media (prefers-reduced-motion:reduce){.ts-sign,.ts-o,.ts-item.sel::before{animation:none}}

/* bar aktivitas di atas, agar animasi pemain di bawah tetap terlihat */
.actbar{top:72px!important;transform:translateX(-50%)!important}@media (max-width:700px){.actbar{top:52px!important}}
.prolog-x{font-size:1.2rem;line-height:1.55;margin:0;max-width:34rem}
/* renovasi: lembar di bawah agar ruangan tetap terlihat */
.reno-ov{place-items:end center;background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.sheet.reno{width:min(46rem,100%);max-height:52vh}.reno-grid{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:.35rem .6rem;align-items:center}
@media (max-width:560px){.reno-grid{grid-template-columns:1fr}}
/* barbershop & butik */
.wardrobe{width:min(34rem,100%)}
.wd-body{display:grid;grid-template-columns:150px minmax(0,1fr);gap:1rem;align-items:start}
#wd-prev{width:150px;height:180px;border:2.5px solid var(--ol);border-radius:14px;background:linear-gradient(#cfe8f7,#fff6e8)}
.wd-opts{display:grid;gap:.4rem}.wd-row{gap:.3rem}
.wd-sw{display:flex;flex-wrap:wrap;gap:.35rem}.wd-c{width:1.9rem;height:1.9rem;border-radius:50%;border:2.5px solid var(--ol);background:var(--c);cursor:pointer;box-shadow:0 2px 0 var(--ol)}
.wd-c.on{outline:3px solid var(--glaze);outline-offset:2px}
@media (max-width:520px){.wd-body{grid-template-columns:1fr;justify-items:center}.wd-opts{width:100%}}
/* ================= skin "papan" — satu gaya dengan layar judul ================= */
:root{--ol:#2b2d42;--board:#fff6e8;--btn:#ffffff;--sel:#ffe1ec;--hard:0 4px 0 var(--ol);--hard-s:0 3px 0 var(--ol)}

/* halaman (lahir, masa kecil, obituari) di atas pemandangan kota */
.ts-page{overflow:visible;min-height:100dvh}
.ts-page #tscene{position:fixed}
.ts-page>.gut{position:relative;z-index:1;padding-block:clamp(1rem,5vh,3rem)}
.ts-page .page{background:var(--board);border:3px solid var(--ol);border-radius:20px;box-shadow:0 6px 0 var(--ol),0 18px 34px rgba(0,0,0,.22);padding:1.4rem clamp(1rem,4vw,1.8rem) 1.6rem;position:relative}
.ts-page .page::after{content:"";position:absolute;inset:7px;border:2px dashed var(--dough);border-radius:14px;pointer-events:none}
.page h2,.sheet h3,.panel-h h3,.actbar b{font-weight:800;color:var(--ol)}
.studio{font-weight:700}
.card{background:var(--btn);border:2.5px solid var(--ol);border-radius:14px;box-shadow:var(--hard-s)}
.choice{background:var(--btn);border:2.5px solid var(--ol);border-radius:14px;box-shadow:var(--hard);transition:transform .1s,box-shadow .1s,background .1s}
.choice:hover,.choice:focus-visible{background:var(--sel);transform:translateY(-2px);box-shadow:0 6px 0 var(--ol);border-color:var(--ol)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.track i{border:2px solid var(--ol);height:10px;border-radius:99px;background:var(--btn)} .track i.done{background:var(--glaze)} .track i.now{background:var(--dough)}
.trait{background:var(--sel);border-left:4px solid var(--glaze);border-radius:8px}

/* tombol */
.btn,.go,.mini,.opt,.x,.pad,.dock button{border:2.5px solid var(--ol)!important;color:var(--ol)}
.btn{background:var(--btn);border-radius:12px;box-shadow:var(--hard-s);font-weight:800}
.btn:hover{background:var(--sel);transform:translateY(-1px)}
.btn.primary,.go{background:var(--glaze)!important;color:#fff!important;box-shadow:var(--hard-s)!important;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.primary:hover,.go:hover{background:#ec5a8e!important}
.btn.ghost{background:var(--btn)}
.btn:active,.go:active,.mini:active,.opt:active:not(:disabled),.pad:active,.dock button:active{transform:translateY(3px)!important;box-shadow:0 0 0 var(--ol)!important}
.go.alt{background:var(--btn)!important;color:var(--ol)!important;text-shadow:none}
.go kbd,.btn kbd{border-color:currentColor;background:transparent;color:inherit}
.mini{background:var(--btn);border-radius:9px;box-shadow:0 2px 0 var(--ol);font-weight:800}
.mini.on{background:var(--ol);color:#fff}
.mini:hover:not(:disabled){background:var(--sel)}.mini.on:hover{background:var(--ol)}
.x{background:var(--btn);border-radius:50%;box-shadow:var(--hard-s);font-weight:800}
.x:hover{background:var(--sel);color:var(--ol)}
.pad{background:var(--btn);border-radius:50%;box-shadow:var(--hard);color:var(--ol)}
.pad:hover{background:var(--sel)}

/* HUD */
.hud{background:var(--board);border-bottom:3px solid var(--ol);box-shadow:none}
.who b{font-weight:800;color:var(--ol)}
.who .donut{box-shadow:0 0 0 2px var(--ol)}
.clock .t{font-family:var(--f-display);font-weight:800;color:var(--ol)}
.clock{padding:.1rem .55rem;border:2px solid var(--ol);border-radius:10px;background:var(--btn);box-shadow:0 2px 0 var(--ol)}
.cash{border:2px solid var(--ol);background:#fff3c4;color:#8a5a00;box-shadow:0 2px 0 var(--ol);font-family:var(--f-display);font-weight:800}
.speed{background:var(--btn);border:2px solid var(--ol);border-radius:11px;box-shadow:0 2px 0 var(--ol);padding:2px}
.speed .mini{border:0!important;box-shadow:none;background:transparent}
.speed .mini.on{background:var(--ol);color:#fff;box-shadow:none}
.hud .hp-btn{border:2.5px solid var(--ol)!important;box-shadow:var(--hard-s)!important}
.need-top{color:var(--ol)}
.bar{height:11px;background:var(--btn);border:2px solid var(--ol);box-shadow:none}
.bar>i{border-radius:99px 0 0 99px}
.need.low .need-top{color:var(--bad)}

/* kontrol bawah */
.controls{background:var(--board);border-top:3px solid var(--ol);box-shadow:none}
.dock button{background:var(--btn);border-radius:13px;box-shadow:var(--hard-s)}
.dock .dock-hp{background:var(--glaze)!important;color:#fff!important}
.dock small{color:inherit;opacity:.8}

/* panel gedung & lembar */
.panel{background:var(--board);border-top:3px solid var(--ol);box-shadow:0 -6px 0 rgba(43,45,66,.12)}
.panel::before{background:var(--ol);opacity:.25}
.opt{background:var(--btn);border-radius:13px;box-shadow:var(--hard-s)}
.opt:hover:not(:disabled){background:var(--sel);transform:translateY(-1px)}
.opt:disabled{background:transparent;border-style:dashed!important;box-shadow:none;opacity:.8}
.opt-main b{color:var(--ol)}
.opt-meta .cost{background:#fff3c4;color:#8a5a00;border:1.5px solid var(--ol)}
.box{background:var(--btn);border:2px solid var(--ol);border-radius:12px}
.status{border:1.5px solid currentColor}
.label.sub{color:var(--ol)}
.overlay{background:rgba(43,45,66,.45)}
.sheet{background:var(--board);border:3px solid var(--ol);border-radius:18px;box-shadow:0 6px 0 var(--ol),0 20px 40px rgba(0,0,0,.25)}
.sel,.field input{border:2px solid var(--ol);border-radius:10px;background:var(--btn);color:var(--ol)}
.node{background:var(--btn);border:2px solid var(--ol);box-shadow:0 2px 0 var(--ol)}
.node.self{background:var(--sel)}
.chip{border:1.5px solid var(--ol);background:var(--sel);color:var(--ol)}
.confirm{border:2.5px solid var(--ol);background:var(--btn);border-radius:12px;box-shadow:var(--hard-s)}

/* kartu di atas kanvas: papan putih berbingkai */
.feed>p,.task,.anote,.toast,.actbar{background:var(--btn);color:var(--ol);border:2.5px solid var(--ol);box-shadow:var(--hard-s);backdrop-filter:none;-webkit-backdrop-filter:none}
.feed>p.good{color:#1d7a63} .feed>p.bad{color:#c0392b} .feed>p.mile{color:#c2185b} .feed>p.tip{color:#2251a3}
.task b{color:#1d7a63}
.anote{border-left:6px solid var(--glaze)}
.anote-h small,.anote-m{opacity:1;color:#5b5670}
.anote-c i{background:var(--board);border:1.5px solid var(--ol)}
.anote-c i.up{color:#1d7a63}.anote-c i.dn{color:#c0392b}
.toast b{color:var(--glaze)}
.actbar{border-radius:18px;box-shadow:var(--hard),0 16px 30px rgba(0,0,0,.25)}
.bub{background:var(--btn);border:2px solid var(--ol)}.bub.me{background:var(--sel);border:2px solid var(--ol)}

/* HP: bingkai tetap ponsel, isi aplikasi ikut gaya papan */
.ph-screen{background:var(--board)}
.ph-appbar{background:var(--board);border-bottom:2.5px solid var(--ol)}
.ph-appbar b{font-weight:800;color:var(--ol)}
.ph-back{color:var(--glaze)}
.ph-x{border:2px solid rgba(255,255,255,.9)}
.ph-appbar .ph-x{background:var(--btn);border:2px solid var(--ol);color:var(--ol);box-shadow:0 2px 0 var(--ol)}
.ph-row{border-bottom:1.5px dashed #d9c9ad}
.ph-chip{border:2px solid var(--ol);box-shadow:0 2px 0 var(--ol);background:var(--btn);color:var(--ol)}
.ph-chip.pri{background:var(--sel);color:var(--ol);border-color:var(--ol)}
.ph-msg.n span{background:var(--btn);border:2px solid var(--ol)}
.ph-msg.m span{background:var(--glaze);border:2px solid var(--ol)}
.ph-compose{background:var(--board);border-top:2.5px solid var(--ol)}
.ph-balance{border:2.5px solid var(--ol);box-shadow:var(--hard-s)}
.ph-app i{border:2.5px solid var(--ol);box-shadow:0 3px 0 var(--ol)}
.ph-unread{border:1.5px solid var(--ol)}
.wk span{border:2px dashed #cdbb9b}.wk span.on{border:2px solid var(--ol);background:var(--sel);color:var(--ol)}.wk span.now{outline:2.5px solid var(--glaze)}

.dock button{align-content:center}
.card .mini:disabled{background:var(--ol);color:#fff;opacity:1;cursor:default}

.go svg.gi{width:1.25rem;height:1.25rem;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.go .gd{display:none}
@media (max-width:700px),(max-height:520px){.go svg.gi{width:1.4rem;height:1.4rem}.go svg.gd{display:block;width:1.15rem;height:1.15rem}.prompt .go.ic{display:grid;place-items:center}}

/* di dalam pemutar website Holy Doughnut: tombol layar penuh ada di pojok kiri bawah, beri ruang untuk tombol ◀ */
.embedded .controls-in{padding-left:52px}
.embedded .dock{padding-left:52px}
/* layar sangat sempit (mis. pemutar website di HP): HUD dipadatkan agar uang tidak terpotong */
@media (max-width:400px){.hud-top>*{min-width:0}.who{flex:1 1 0}.who b{font-size:.9rem}.clock{padding:.1rem .4rem}.clock .t{font-size:1rem}.clock #h-day{font-size:.6rem}.cash{font-size:.8rem;padding:.05rem .35rem;flex:none}
  .need-top span:first-of-type{display:none}.need-top{justify-content:space-between}.need-top .nic{font-size:.9rem}}
</style>

</head>
