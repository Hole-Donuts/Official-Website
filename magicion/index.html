<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120a2e">
<meta name="description" content="Magicion: an action roguelite of cards, spells and elemental reactions by Holy Doughnut Studio.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Magicion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed game canvas; menus are centred "card table" overlays; HUD hugs the safe-area edges. */
:root{
  --void:#120a2e;      /* deep stage purple */
  --ink:#1f1250;       /* panel */
  --ink-2:#2b1a6b;     /* raised panel */
  --violet:#8b3dff;    /* Magicion purple */
  --cyan:#2ee6ff;      /* spotlight cyan */
  --gold:#ffd166;      /* sparkle gold */
  --rose:#ff4d7e;      /* card red / damage */
  --text:#f1ecff;
  --muted:#b3a6e0;
  --line:rgba(190,170,255,.22);
  --fire:#ff7a3d; --frost:#7fe3ff; --storm:#ffe66d; --arcane:#d08bff;
  --paper:#fffaf3;   /* playing-card face */
  --cink:#2a1a5e;    /* ink on cards */
  --cpink:#f0507f;   /* card trim pink from the menu mockup */
  --fd:'Bungee','Impact','Arial Black',sans-serif;
  --fb:'Chakra Petch','Trebuchet MS','Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--fb);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void)}
#safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none!important}
button{font-family:var(--fb);color:var(--text);cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- overlays ---------- */
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 35%,rgba(46,230,255,.10),transparent 60%),rgba(12,6,32,.82);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));touch-action:pan-y}
#ov.clear{background:transparent}
.panel{width:100%;max-width:880px;margin:auto;display:flex;flex-direction:column;gap:16px;align-items:stretch;padding-block:8px}
.panel.narrow{max-width:460px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:clamp(22px,5vw,34px);text-align:center;color:var(--text)}
h2 small{display:block;font-family:var(--fb);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.sub{color:var(--muted);text-align:center;margin:0;font-size:15px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.card{position:relative;--gold:#c26a00;--cyan:#0e86b0;--arcane:#7d36e6;--rose:#e0335f;--muted:#6d5f98;--fire:#d9481f;--frost:#1590c4;--storm:#a87d00;
  background:repeating-conic-gradient(from 0deg at 50% 44%,rgba(124,92,214,.065) 0 5deg,transparent 5deg 10deg),var(--paper);color:var(--cink);
  border:0;border-radius:16px;padding:40px 22px 40px;text-align:center;align-items:center;display:flex;flex-direction:column;gap:8px;min-width:0;
  box-shadow:0 5px 0 #b9a9e6,0 14px 28px rgba(5,0,20,.5);transition:transform .14s}
.card::before{content:"";position:absolute;inset:7px;border:2px dashed var(--cdash,var(--cpink));border-radius:11px;opacity:.75;pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-6px) rotate(-.6deg)}
.card:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.card .suit{position:absolute;top:12px;left:14px;font-size:17px;line-height:1;display:flex;flex-direction:column;align-items:center;font-weight:700;font-family:var(--fb)}
.card .suit i{font-style:normal;font-family:var(--fd);font-size:15px;margin-bottom:1px}
.card .suit.br{top:auto;left:auto;bottom:12px;right:14px;transform:rotate(180deg)}
.card .nm{font-family:var(--fd);font-size:18px;line-height:1.15;color:var(--cink);text-wrap:balance}
.card .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .ds{font-size:14px;line-height:1.5;color:var(--cink)}
.card .ds b{color:#d2410c;font-weight:700}
.card .cmp{font-size:12px;color:var(--muted);border-top:1px dashed #d5c9f2;padding-top:7px;line-height:1.5;align-self:stretch}
.card .price{font-family:var(--fd);color:#c26a00;font-size:16px}
.card .prev{width:112px;height:112px;max-width:100%}
.cards.two{grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.cards.two .card{padding:34px 12px 30px}
.cards.two .nm{font-size:15px}
.card[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.badge{position:absolute;top:12px;right:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--cpink);color:#fff;font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;letter-spacing:.04em}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:linear-gradient(180deg,#9d55ff,#6a22e0);border-color:transparent;font-family:var(--fd);font-weight:400;font-size:18px;padding:14px 28px;box-shadow:0 6px 0 #3d1290,0 0 30px rgba(139,61,255,.45)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #3d1290}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.logo{margin:0;line-height:0}
.logo img{display:block;width:min(70vw,340px,36vh);max-width:100%;height:auto;filter:drop-shadow(0 12px 32px rgba(46,230,255,.35));animation:hatfloat 4.5s ease-in-out infinite}
.logo.sm img{width:min(52vw,190px,26vh);animation:none}
@keyframes hatfloat{50%{transform:translateY(-7px) rotate(-1.2deg)}}
.title.stage{gap:8px;padding-block:0}
#hero{display:block;width:clamp(76px,15vh,140px);height:clamp(76px,15vh,140px);margin-top:-4px}
.deck{display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,1.6vw,14px);padding-top:6px}
.pcard{position:relative;width:clamp(80px,min(24vw,15vh),124px);aspect-ratio:5/7;border:0;border-radius:14px;padding:0;
  background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(240,80,127,.08) 0 5deg,transparent 5deg 10deg),var(--paper);color:var(--cpink);
  box-shadow:0 6px 0 #c9b8ef,0 16px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8%;transition:transform .15s}
.pcard::before{content:"";position:absolute;inset:6px;border:2px dashed var(--cpink);border-radius:9px;opacity:.75}
.pcard.l{transform:rotate(-9deg) translateY(12px)} .pcard.r{transform:rotate(9deg) translateY(12px)}
.pcard.m{width:clamp(96px,min(28vw,18vh),144px);z-index:1;transform:translateY(-4px)}
.pcard.l:hover,.pcard.l:focus-visible{transform:rotate(-6deg) translateY(2px)} .pcard.r:hover,.pcard.r:focus-visible{transform:rotate(6deg) translateY(2px)}
.pcard.m:hover,.pcard.m:focus-visible{transform:translateY(-12px)}
.pcard:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.pcard .cn{position:absolute;top:9px;left:10px;font-size:15px;font-weight:700;line-height:1}
.pcard .cn.br{top:auto;left:auto;bottom:9px;right:10px;transform:rotate(180deg)}
.pcard .ic{width:50%;line-height:0} .pcard .ic svg{width:100%;height:auto}
.pcard .lb{font-family:var(--fd);font-size:clamp(10px,2.6vw,13px);color:var(--cink)}
.pcard .play{width:54%;aspect-ratio:1;border-radius:50%;background:var(--cpink);outline:3px dashed var(--cyan);outline-offset:3px;display:grid;place-items:center}
.pcard .play::after{content:"";width:0;height:0;border-left:clamp(13px,3.6vw,20px) solid #fff;border-top:clamp(8px,2.3vw,13px) solid transparent;border-bottom:clamp(8px,2.3vw,13px) solid transparent;margin-left:12%}
.rbtns{position:fixed;z-index:21;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--cpink);border:3px solid #fff;display:grid;place-items:center;color:#fff;font-family:var(--fd);font-size:18px;box-shadow:0 4px 0 #8a1238;padding:0}
.rbtn svg{width:22px;height:22px;display:block}
.studio-badge{position:fixed;z-index:21;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:clamp(40px,7vw,64px);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.tagline{color:var(--muted);font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin:0}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu .btn{width:100%}
.dust{font-family:var(--fd);color:var(--gold);font-size:16px}
.studio{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);opacity:.7}
.arcana{display:flex;align-items:center;justify-content:center;gap:10px}
.arcana span{min-width:120px;text-align:center;font-weight:600}

/* sanctum / stats */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{background:rgba(31,18,80,.7);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h3{font-size:15px;color:var(--cyan)}
.li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .l{min-width:0;flex:1}
.li .l b{display:block;font-weight:600}
.li .l i{font-style:normal;font-size:12px;color:var(--muted)}
.li .btn{padding:7px 12px;font-size:13px;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.kv span:nth-child(even){text-align:right;color:var(--gold)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.table td:first-child{white-space:nowrap;font-weight:700}
.scroll{overflow-x:auto}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- touch controls: purple chips with white rims, as in the in-game mockup ---------- */
#pad{position:fixed;z-index:10;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:236px;height:200px;pointer-events:none}
#pad button{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid #fff;touch-action:none;color:#fff;
  display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#9a52ff,#6a22e0);box-shadow:0 4px 0 #3a1290;overflow:hidden;padding:0}
#pad .sp{width:60px;height:60px;font-size:27px;text-shadow:0 2px 0 rgba(20,0,50,.45)}
#pad .sp::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,4,30,.72) calc(var(--cd,0)*360deg),transparent 0)}
#pad .sp.nomana{filter:saturate(.25) brightness(.7)}
#pad .sp.empty{opacity:.35;background:rgba(40,20,80,.55);border-color:rgba(255,255,255,.55);box-shadow:none}
#pad .sp .lv{position:absolute;bottom:5px;font-size:10px;font-weight:700;letter-spacing:.05em;z-index:1;color:#fff}
#pad .key{position:absolute;top:4px;font-size:9px;color:rgba(255,255,255,.75);z-index:1}
#pad #dashBtn{width:84px;height:84px;right:0;bottom:0;font-family:var(--fd);font-size:14px;background:linear-gradient(180deg,#3fe0a0,#13a06a);box-shadow:0 5px 0 #0b6a45}
#pad #dashBtn::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,4,30,.62) calc(var(--cd,0)*360deg),transparent 0)}
#pad #dashBtn .chg{position:absolute;bottom:9px;font-family:var(--fb);font-size:11px;z-index:1}
#sp0{right:110px;bottom:6px} #sp1{right:92px;bottom:80px} #sp2{right:22px;bottom:110px} #sp3{right:166px;bottom:74px}
/* prologue cutscene */
#pro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 max(22px,env(safe-area-inset-bottom,0px))}
#proSkip{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(14,6,34,.6);border-color:rgba(255,255,255,.6);padding:8px 16px}
#proBox{box-sizing:border-box;width:100%;max-width:720px;background:rgba(14,6,34,.8);border:2px solid rgba(255,255,255,.85);border-radius:16px;padding:16px 20px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#proText{margin:0;font-size:clamp(16px,2.3vw,21px);line-height:1.55;min-height:3.1em;text-wrap:pretty}
#proHint{align-self:flex-end;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .3s}
#proHint.on{opacity:1}
#proGate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#proGate .pg1{margin:0;font-family:var(--fd);font-size:clamp(22px,5vw,38px);color:#ffd166;text-shadow:0 4px 0 #2a124f;animation:pgpulse 1.6s ease-in-out infinite}
#proGate .pg2{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
@keyframes pgpulse{50%{opacity:.55;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){#proGate .pg1{animation:none}}
#pauseBtn{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:11px;padding:0;
  background:linear-gradient(180deg,#9a52ff,#6a22e0);border:3px solid #fff;box-shadow:0 4px 0 #3a1290;font-family:var(--fd);font-size:15px;color:#fff}
.nokeys #pad .key{display:none}
@media (prefers-reduced-motion:reduce){.logo img{animation:none}.card,.pcard{transition:none}.card:hover{transform:none}}
</style>
<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>


<canvas id="cv" aria-label="Magicion game field"></canvas>
<div id="safe"></div>
<div id="pad" hidden>
  <button class="sp" id="sp0" data-slot="0" aria-label="Spell 1"><span class="key">1</span><span class="g"></span><span class="lv"></span></button>
  <button class="sp" id="sp1" data-slot="1" aria-label="Spell 2"><span class="key">2</span><span class="g"></span><span class="lv"></span></button>
  <button class="sp" id="sp2" data-slot="2" aria-label="Spell 3"><span class="key">3</span><span class="g"></span><span class="lv"></span></button>
  <button class="sp" id="sp3" data-slot="3" aria-label="Spell 4"><span class="key">4</span><span class="g"></span><span class="lv"></span></button>
  <button id="dashBtn" aria-label="Dash"><span class="key">SPACE</span>DASH<span class="chg"></span></button>
</div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="ov"></div>
<div id="pro" hidden>
  <button id="proSkip" class="btn ghost" type="button">Skip ›</button>
  <div id="proGate"><p class="pg1">Tap to begin the show</p><p class="pg2">A Holy Doughnut Studio production</p></div>
  <div id="proBox" hidden><p id="proText"></p><span id="proHint">Tap to continue</span></div>
