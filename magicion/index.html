<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120a2e">
<meta name="description" content="Magicion: an action roguelite of cards, spells and elemental reactions by Holy Doughnut Studio.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Magicion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed game canvas; menus are centred "card table" overlays; HUD hugs the safe-area edges. */
:root{
  --void:#120a2e;      /* deep stage purple */
  --ink:#1f1250;       /* panel */
  --ink-2:#2b1a6b;     /* raised panel */
  --violet:#8b3dff;    /* Magicion purple */
  --cyan:#2ee6ff;      /* spotlight cyan */
  --gold:#ffd166;      /* sparkle gold */
  --rose:#ff4d7e;      /* card red / damage */
  --text:#f1ecff;
  --muted:#b3a6e0;
  --line:rgba(190,170,255,.22);
  --fire:#ff7a3d; --frost:#7fe3ff; --storm:#ffe66d; --arcane:#d08bff;
  --paper:#fffaf3;   /* playing-card face */
  --cink:#2a1a5e;    /* ink on cards */
  --cpink:#f0507f;   /* card trim pink from the menu mockup */
  --fd:'Bungee','Impact','Arial Black',sans-serif;
  --fb:'Chakra Petch','Trebuchet MS','Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--fb);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void)}
#safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none!important}
button{font-family:var(--fb);color:var(--text);cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- overlays ---------- */
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 35%,rgba(46,230,255,.10),transparent 60%),rgba(12,6,32,.82);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));touch-action:pan-y}
#ov.clear{background:transparent}
.panel{width:100%;max-width:880px;margin:auto;display:flex;flex-direction:column;gap:16px;align-items:stretch;padding-block:8px}
.panel.narrow{max-width:460px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:clamp(22px,5vw,34px);text-align:center;color:var(--text)}
h2 small{display:block;font-family:var(--fb);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.sub{color:var(--muted);text-align:center;margin:0;font-size:15px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.card{position:relative;--gold:#c26a00;--cyan:#0e86b0;--arcane:#7d36e6;--rose:#e0335f;--muted:#6d5f98;--fire:#d9481f;--frost:#1590c4;--storm:#a87d00;
  background:repeating-conic-gradient(from 0deg at 50% 44%,rgba(124,92,214,.065) 0 5deg,transparent 5deg 10deg),var(--paper);color:var(--cink);
  border:0;border-radius:16px;padding:40px 22px 40px;text-align:center;align-items:center;display:flex;flex-direction:column;gap:8px;min-width:0;
  box-shadow:0 5px 0 #b9a9e6,0 14px 28px rgba(5,0,20,.5);transition:transform .14s}
.card::before{content:"";position:absolute;inset:7px;border:2px dashed var(--cdash,var(--cpink));border-radius:11px;opacity:.75;pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-6px) rotate(-.6deg)}
.card:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.card .suit{position:absolute;top:12px;left:14px;font-size:17px;line-height:1;display:flex;flex-direction:column;align-items:center;font-weight:700;font-family:var(--fb)}
.card .suit i{font-style:normal;font-family:var(--fd);font-size:15px;margin-bottom:1px}
.card .suit.br{top:auto;left:auto;bottom:12px;right:14px;transform:rotate(180deg)}
.card .nm{font-family:var(--fd);font-size:18px;line-height:1.15;color:var(--cink);text-wrap:balance}
.card .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .ds{font-size:14px;line-height:1.5;color:var(--cink)}
.card .ds b{color:#d2410c;font-weight:700}
.card .cmp{font-size:12px;color:var(--muted);border-top:1px dashed #d5c9f2;padding-top:7px;line-height:1.5;align-self:stretch}
.card .price{font-family:var(--fd);color:#c26a00;font-size:16px}
.card .prev{width:112px;height:112px;max-width:100%}
.cards.two{grid-template-columns:repeat(auto-fit,minmax(min(150px,42vw),1fr))}
.cards.two .card{padding:34px 12px 30px}
.cards.two .nm{font-size:15px}
.card[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.badge{position:absolute;top:12px;right:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--cpink);color:#fff;font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;letter-spacing:.04em}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:linear-gradient(180deg,#9d55ff,#6a22e0);border-color:transparent;font-family:var(--fd);font-weight:400;font-size:18px;padding:14px 28px;box-shadow:0 6px 0 #3d1290,0 0 30px rgba(139,61,255,.45)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #3d1290}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.logo{margin:0;line-height:0}
.logo img{display:block;width:min(70vw,340px,36vh);max-width:100%;height:auto;filter:drop-shadow(0 12px 32px rgba(46,230,255,.35));animation:hatfloat 4.5s ease-in-out infinite}
.logo.sm img{width:min(52vw,190px,26vh);animation:none}
@keyframes hatfloat{50%{transform:translateY(-7px) rotate(-1.2deg)}}
.title.stage{gap:8px;padding-block:0}
#hero{display:block;width:clamp(76px,15vh,140px);height:clamp(76px,15vh,140px);margin-top:-4px}
.deck{display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,1.6vw,14px);padding-top:6px}
.pcard{position:relative;width:clamp(80px,min(24vw,15vh),124px);aspect-ratio:5/7;border:0;border-radius:14px;padding:0;
  background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(240,80,127,.08) 0 5deg,transparent 5deg 10deg),var(--paper);color:var(--cpink);
  box-shadow:0 6px 0 #c9b8ef,0 16px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8%;transition:transform .15s}
.pcard::before{content:"";position:absolute;inset:6px;border:2px dashed var(--cpink);border-radius:9px;opacity:.75}
.pcard.l{transform:rotate(-9deg) translateY(12px)} .pcard.r{transform:rotate(9deg) translateY(12px)}
.pcard.m{width:clamp(96px,min(28vw,18vh),144px);z-index:1;transform:translateY(-4px)}
.pcard.l:hover,.pcard.l:focus-visible{transform:rotate(-6deg) translateY(2px)} .pcard.r:hover,.pcard.r:focus-visible{transform:rotate(6deg) translateY(2px)}
.pcard.m:hover,.pcard.m:focus-visible{transform:translateY(-12px)}
.pcard:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.pcard .cn{position:absolute;top:9px;left:10px;font-size:15px;font-weight:700;line-height:1}
.pcard .cn.br{top:auto;left:auto;bottom:9px;right:10px;transform:rotate(180deg)}
.pcard .ic{width:50%;line-height:0} .pcard .ic svg{width:100%;height:auto}
.pcard .lb{font-family:var(--fd);font-size:clamp(10px,2.6vw,13px);color:var(--cink)}
.pcard .play{width:54%;aspect-ratio:1;border-radius:50%;background:var(--cpink);outline:3px dashed var(--cyan);outline-offset:3px;display:grid;place-items:center}
.pcard .play::after{content:"";width:0;height:0;border-left:clamp(13px,3.6vw,20px) solid #fff;border-top:clamp(8px,2.3vw,13px) solid transparent;border-bottom:clamp(8px,2.3vw,13px) solid transparent;margin-left:12%}
.rbtns{position:fixed;z-index:21;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--cpink);border:3px solid #fff;display:grid;place-items:center;color:#fff;font-family:var(--fd);font-size:18px;box-shadow:0 4px 0 #8a1238;padding:0}
.rbtn svg{width:22px;height:22px;display:block}
.studio-badge{position:fixed;z-index:21;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:clamp(40px,7vw,64px);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.tagline{color:var(--muted);font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin:0}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu .btn{width:100%}
.dust{font-family:var(--fd);color:var(--gold);font-size:16px}
.studio{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);opacity:.7}
.arcana{display:flex;align-items:center;justify-content:center;gap:10px}
.arcana span{min-width:120px;text-align:center;font-weight:600}

/* sanctum / stats */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{background:rgba(31,18,80,.7);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h3{font-size:15px;color:var(--cyan)}
.li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .l{min-width:0;flex:1}
.li .l b{display:block;font-weight:600}
.li .l i{font-style:normal;font-size:12px;color:var(--muted)}
.li .btn{padding:7px 12px;font-size:13px;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.kv span:nth-child(even){text-align:right;color:var(--gold)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.table td:first-child{white-space:nowrap;font-weight:700}
.scroll{overflow-x:auto}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- touch controls: purple chips with white rims, as in the in-game mockup ---------- */
#pad{position:fixed;z-index:10;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:236px;height:200px;pointer-events:none}
#pad button{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid #fff;touch-action:none;color:#fff;
  display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#9a52ff,#6a22e0);box-shadow:0 4px 0 #3a1290;overflow:hidden;padding:0}
#pad .sp{width:60px;height:60px;font-size:27px;text-shadow:0 2px 0 rgba(20,0,50,.45)}
#pad .sp::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,4,30,.72) calc(var(--cd,0)*360deg),transparent 0)}
#pad .sp.nomana{filter:saturate(.25) brightness(.7)}
#pad .sp.empty{opacity:.35;background:rgba(40,20,80,.55);border-color:rgba(255,255,255,.55);box-shadow:none}
#pad .sp .lv{position:absolute;bottom:5px;font-size:10px;font-weight:700;letter-spacing:.05em;z-index:1;color:#fff}
#pad .key{position:absolute;top:4px;font-size:9px;color:rgba(255,255,255,.75);z-index:1}
#pad #dashBtn{width:84px;height:84px;right:0;bottom:0;font-family:var(--fd);font-size:14px;background:linear-gradient(180deg,#3fe0a0,#13a06a);box-shadow:0 5px 0 #0b6a45}
#pad #dashBtn::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,4,30,.62) calc(var(--cd,0)*360deg),transparent 0)}
#pad #dashBtn .chg{position:absolute;bottom:9px;font-family:var(--fb);font-size:11px;z-index:1}
#sp0{right:110px;bottom:6px} #sp1{right:92px;bottom:80px} #sp2{right:22px;bottom:110px} #sp3{right:166px;bottom:74px}
/* prologue cutscene */
#pro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 max(22px,env(safe-area-inset-bottom,0px))}
#proSkip{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(14,6,34,.6);border-color:rgba(255,255,255,.6);padding:8px 16px}
#proBox{box-sizing:border-box;width:100%;max-width:720px;background:rgba(14,6,34,.8);border:2px solid rgba(255,255,255,.85);border-radius:16px;padding:16px 20px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#proText{margin:0;font-size:clamp(16px,2.3vw,21px);line-height:1.55;min-height:3.1em;text-wrap:pretty}
#proHint{align-self:flex-end;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .3s}
#proHint.on{opacity:1}
#proGate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#proGate .pg1{margin:0;font-family:var(--fd);font-size:clamp(22px,5vw,38px);color:#ffd166;text-shadow:0 4px 0 #2a124f;animation:pgpulse 1.6s ease-in-out infinite}
#proGate .pg2{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
@keyframes pgpulse{50%{opacity:.55;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){#proGate .pg1{animation:none}}
#pauseBtn{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:11px;padding:0;
  background:linear-gradient(180deg,#9a52ff,#6a22e0);border:3px solid #fff;box-shadow:0 4px 0 #3a1290;font-family:var(--fd);font-size:15px;color:#fff}
.nokeys #pad .key{display:none}
@media (prefers-reduced-motion:reduce){.logo img{animation:none}.card,.pcard{transition:none}.card:hover{transform:none}}
</style>
<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>


<canvas id="cv" aria-label="Magicion game field"></canvas>
<div id="safe"></div>
<div id="pad" hidden>
  <button class="sp" id="sp0" data-slot="0" aria-label="Spell 1"><span class="key">1</span><span class="g"></span><span class="lv"></span></button>
  <button class="sp" id="sp1" data-slot="1" aria-label="Spell 2"><span class="key">2</span><span class="g"></span><span class="lv"></span></button>
  <button class="sp" id="sp2" data-slot="2" aria-label="Spell 3"><span class="key">3</span><span class="g"></span><span class="lv"></span></button>
  <button class="sp" id="sp3" data-slot="3" aria-label="Spell 4"><span class="key">4</span><span class="g"></span><span class="lv"></span></button>
  <button id="dashBtn" aria-label="Dash"><span class="key">SPACE</span>DASH<span class="chg"></span></button>
</div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="ov"></div>
<div id="pro" hidden>
  <button id="proSkip" class="btn ghost" type="button">Skip ›</button>
  <div id="proGate"><p class="pg1">Tap to begin the show</p><p class="pg2">A Holy Doughnut Studio production</p></div>
  <div id="proBox" hidden><p id="proText"></p><span id="proHint">Tap to continue</span></div>
</div>

<script>
'use strict';
/* =========================================================
   MAGICION — action roguelite (Holy Doughnut Studio pitch)
   ========================================================= */
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const R0=n=>Math.round(n);
const pct=n=>Math.round(n*100)+'%';
const TS='︎';

/* ---------- elements are card suits ---------- */
const EL={
  fire:  {name:'Fire',  suit:'♥'+TS,col:'#ff7a3d',ink:'#d9481f',glow:'#ffc06b',status:'Burn'},
  frost: {name:'Frost', suit:'♠'+TS,col:'#7fe3ff',ink:'#1590c4',glow:'#d4f8ff',status:'Chill'},
  storm: {name:'Storm', suit:'♣'+TS,col:'#ffe66d',ink:'#a87d00',glow:'#fff7b8',status:'Shock'},
  arcane:{name:'Arcane',suit:'♦'+TS,col:'#d08bff',ink:'#8a3ff0',glow:'#f0d4ff',status:'Hex'},
};
const ELS=Object.keys(EL);

/* ---------- save ---------- */
const SAVE_KEY='magicion_save_v1';
const BASE_SPELLS=['fireball','iceShards','chainLightning','arcaneMissiles','flameRing','frostNova'];
function defSave(){return{music:true,shards:0,seen:[],lastRoute:[],outfit:'classic',outfits:['classic'],dust:0,unlocked:BASE_SPELLS.slice(),talents:{},arcanaMax:0,arcana:0,runs:0,wins:0,bestRoom:0,muted:false,autocast:false,tut:false}}
let save=(()=>{try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)return Object.assign(defSave(),s)}catch(e){}return defSave()})();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ---------- spells ---------- */
const sd=(b,l)=>b*(1+0.32*(l-1))*S.power;
const SPELLS={
  fireball:{name:'Fireball',el:'fire',cd:1.6,mana:12,
    info:l=>`Exploding orb: <b>${R0(sd(26,l))}</b> hit + area blast. Burns.${l>=5?' Bursts into 3 embers.':''}`,
    cast(l,a){shoot({ang:a.ang,spd:540,r:9,dmg:sd(26,l),el:'fire',life:1.4,kind:'fireball',onHit:pr=>{
      blast(pr.x,pr.y,55+6*l,pr.dmg*0.7,'fire',{apply:1});
      if(l>=5)for(let i=0;i<3;i++)shoot({x:pr.x,y:pr.y,ang:rand(0,TAU),spd:380,r:5,dmg:pr.dmg*0.35,el:'fire',life:0.5,kind:'ember'});
    }})}},
  flameRing:{name:'Inferno Ring',el:'fire',cd:5,mana:18,
    info:l=>`Fire nova around you: <b>${R0(sd(24,l))}</b> dmg, 2 Burn stacks, knocks enemies back.`,
    cast(l){blast(P.x,P.y,105+12*l,sd(24,l),'fire',{apply:2,kb:260,ring:true})}},
  meteor:{name:'Meteor',el:'fire',cd:7,mana:26,
    info:l=>`Calls a meteor on the target: <b>${R0(sd(80,l))}</b> area dmg after 0.7s.${l>=5?' Two meteors.':''}`,
    cast(l,a){const n=l>=5?2:1;for(let i=0;i<n;i++)addArea({x:a.x+(i?rand(-70,70):0),y:a.y+(i?rand(-70,70):0),r:85+8*l,delay:0.7+i*0.25,dmg:sd(80,l),el:'fire',from:'p',kind:'meteor',apply:2})}},
  iceShards:{name:'Ice Shards',el:'frost',cd:1.3,mana:10,
    info:l=>`Fan of <b>${2+l}</b> shards, <b>${R0(sd(11,l))}</b> each. Chills.${l>=3?' Shards pierce.':''}`,
    cast(l,a){const n=2+l,sp=0.55;for(let i=0;i<n;i++){const t=n>1?i/(n-1)-0.5:0;shoot({ang:a.ang+t*sp,spd:600,r:6,dmg:sd(11,l),el:'frost',life:0.75,kind:'shard',pierce:l>=3?1:0})}}},
  frostNova:{name:'Frost Nova',el:'frost',cd:8,mana:22,

function scheduleStep(tr,step,t,spd){

function musicBoot(){if(!AC||MUS.bus)return;MUS.bus=AC.createGain();MUS.bus.gain.value=0;const comp=AC.createDynamicsCompressor();MUS.bus.connect(comp).connect(AC.destination);

function playMusic(id){MUS.int=0;if(MUS.want===id&&(MUS.id===id||MUS.pendingId===id))return;MUS.want=id;if(!MUS.bus)return;
  const now=AC.currentTime;MUS.bus.gain.cancelScheduledValues(now);MUS.bus.gain.setValueAtTime(MUS.bus.gain.value,now);MUS.bus.gain.linearRampToValueAtTime(0,now+0.5);MUS.switchAt=now+0.5;MUS.pendingId=id;MUS.lastV=-1}

function musicTick(){
  if(!AC||!MUS.bus||AC.state!=='running')return;const now=AC.currentTime;
  if(MUS.pendingId&&now>=MUS.switchAt){const id=MUS.pendingId;MUS.pendingId=null;startTrack(id)}
  if(MUS.pendingId)return;
  const v=musicVol();if(MUS.fadeIn||Math.abs(MUS.lastV-v)>0.001){MUS.bus.gain.cancelScheduledValues(now);MUS.bus.gain.setValueAtTime(MUS.bus.gain.value,now);MUS.bus.gain.linearRampToValueAtTime(v,now+(MUS.fadeIn?1.2:0.3));MUS.lastV=v;MUS.fadeIn=false}

function newPlayer(startSpell){
  P={x:0,y:0,vx:0,vy:0,r:14,hp:100,mana:60,lvl:1,xp:0,gold:0,face:-Math.PI/2,
     spells:[{id:startSpell,l:1,cd:0}],passives:{},equip:{},iframe:0,dashT:0,dashCharges:1,dashRe:0,dashDir:{x:0,y:-1},
     cardT:0,cardCount:0,slowT:0,kx:0,ky:0,shield:0,shieldT:0,shieldBurst:0,orbs:null,revived:false,glacierCd:0,rerolls:(save.talents.insight||0)+1,
     aimEnemy:null,twin:[]};
  const els=ELS.filter(e=>e!==SPELLS[startSpell].el);
  P.equip.grimoire=genItem('grimoire',0,pick(els));
  recompute();P.hp=S.maxHp;P.mana=S.maxMana;P.dashCharges=S.dashCharges;
}
function recompute(){
  const s={maxHp:100,armor:0,move:215,power:1,cdr:0,maxMana:60,regen:6,atkSpd:1,crit:0.05,critDmg:1.8,dashCd:1.15,dashCharges:1,pickup:95,
    react:1,burnMax:5,burnMult:1,freezeDur:1.1,shatter:1,scJumps:3,olRad:1,reactHeal:0,goldMult:1,dmgTaken:1,infuseChance:0.3,
    twincast:0,fullDeck:false,phoenix:false,glacier:false,comet:false,catalyst:false,infuse:null};
  const t=save.talents;
  s.maxHp+=8*(t.vigor||0);s.maxMana+=6*(t.focus||0);s.goldMult+=0.1*(t.fortune||0);s.dashCharges+=(t.sleight||0);
  let moveP=0,regenP=0,dashP=0;
  for(const sl of SLOTS){const it=P.equip[sl];if(!it)continue;
    for(const [k,v] of Object.entries(it.stats)){
      if(k==='power')s.power+=v;else if(k==='hp')s.maxHp+=v;else if(k==='cdr')s.cdr+=v;else if(k==='atkSpd')s.atkSpd+=v;
      else if(k==='move')moveP+=v;else if(k==='crit')s.crit+=v;else if(k==='armor')s.armor+=v;else if(k==='mana')s.maxMana+=v;
      else if(k==='regen')regenP+=v;else if(k==='react')s.react+=v;else if(k==='dashCd')dashP+=v;}
    if(it.el)s.infuse=it.el;
    if(it.leg==='catalystCodex'){s.catalyst=true;s.react+=0.6}
    if(it.leg==='glacier')s.glacier=true;
    if(it.leg==='twincast')s.twincast=0.25;
    if(it.leg==='fullDeck')s.fullDeck=true;
    if(it.leg==='phoenix')s.phoenix=true;
    if(it.leg==='comet')s.comet=true;
  }
  s.move*=1+moveP;s.regen*=1+regenP;s.dashCd*=1-dashP;
  for(const [id,n] of Object.entries(P.passives))PASSIVES[id].a(s,n);
  for(const b of (G.boons||[]))b(s);
  s.cdr=Math.min(0.45,s.cdr);s.armor=Math.min(0.6,s.armor);s.crit=Math.min(0.75,s.crit);s.maxHp=Math.max(30,s.maxHp);
  const oldMax=S?S.maxHp:s.maxHp;
  S=s;
  if(P.hp!==undefined){if(s.maxHp>oldMax)P.hp+=s.maxHp-oldMax;P.hp=Math.min(P.hp,s.maxHp);P.mana=Math.min(P.mana,s.maxMana)}
}
function genItem(slot,rar,el){
  slot=slot||pick(SLOTS);
  const R=G.realm||0;const rm=RAR[rar].m*(1+0.3*R);
  const st={};const main=SLOT_MAIN[slot];st[main]=STAT[main].b*rm*rand(0.9,1.15)*(main==='hp'?1.4:1.25);
  const subs=shuffle(Object.keys(STAT).filter(k=>k!==main)).slice(0,rar>=2?2:rar>=1?1:0);
  for(const k of subs)st[k]=STAT[k].b*rm*rand(0.8,1.1);

  if(slot==='grimoire')it.el=el||pick(ELS);

/* ---------- run / rooms ---------- */
function prog(){return G.realm+G.room/ROOMS_PER_REALM}
function hpMult(){return Math.pow(1.42,prog())*(1+0.25*G.arcana)}
function dmgMult(){return Math.pow(1.24,prog())*(1+0.15*G.arcana)}

function startRun(startSpell){
  audioInit();
  G={mode:'play',time:0,realm:0,room:0,arcana:save.arcana,boons:[],enemies:[],projs:[],eprojs:[],areas:[],parts:[],texts:[],orbs:[],
     pickups:[],doors:[],pillars:[],fx:[],spawnQ:[],waves:[],waveIdx:0,waveT:0,shake:0,freeze:0,fade:0,fadeDir:0,banner:null,hint:null,
     cam:{x:0,y:0},stats:{kills:0,reactions:0,rooms:0,elites:0,bosses:0,goldTotal:0,dmg:0,time:0,best:{}},pendingLevel:0,cleared:false,

  if(CH>CW*1.1)return{W:980,H:1420};
  return{W:1500,H:1000};
}
function enterRoom(kind,reward){
  playMusic(kind==='boss'?'boss_'+RL().boss:(kind==='shop'||kind==='rest'||kind==='shrine')?'haven':'realm_'+G.route[G.realm]);
  const d=roomDims();G.W=d.W;G.H=d.H;G.kind=kind;G.reward=reward;
  for(const k of['enemies','projs','eprojs','areas','parts','texts','orbs','pickups','doors','fx','spawnQ'])G[k]=[];
  G.boss=null;G.cleared=false;G.roomUi=false;G.waves=[];G.waveIdx=0;G.waveT=0;G.roomT=0;
  P.x=G.W/2;P.y=G.H-110;P.vx=P.vy=0;P.orbs=null;
  G.cam.x=P.x;G.cam.y=P.y-150;
  G.pillars=[];
  if(kind==='combat'||kind==='elite'){
    const n=randi(1,3);
    for(let i=0;i<n*4&&G.pillars.length<n;i++){const p={x:rand(200,G.W-200),y:rand(220,G.H-320),r:rand(28,44)};
      if(G.pillars.every(q=>d2(p.x,p.y,q.x,q.y)>260*260)&&d2(p.x,p.y,G.W/2,G.H/2-40)>(p.r+150)**2&&d2(p.x,p.y,G.W/2,G.H-110)>(p.r+140)**2)G.pillars.push(p)}
    buildWaves(kind==='elite');

    G.bossIntro=1.6;sfx('boss');
    G.pillars=[{x:G.W*0.25,y:G.H*0.4,r:34},{x:G.W*0.75,y:G.H*0.4,r:34}];
  }else{
    G.cleared=true;G.roomUi=true;
  }
  bakeFloor();

function buildWaves(elite){
  const R=RL();
  const budget=(24+G.room*3.5+G.realm*8)*(1+0.12*G.arcana);
  const nW=G.room>=4?5:G.room>=2?4:3;
  for(let w=0;w<nW;w++){
    let pts=budget/nW*(0.8+0.25*w);const list=[];
    while(pts>0){const t=pick(R.pool);list.push({type:t});pts-=ENEMIES[t].cost}
    G.waves.push(list);
  }
  if(elite)G.waves[nW-1].push({type:pick(R.elite),elite:true});
  // deeper realms slip extra elites into ordinary fights
  for(let w=1;w<nW;w++)if(Math.random()<0.1*G.realm)G.waves[w].push({type:pick(R.elite),elite:true});
}
function spawnWave(){
  const w=G.waves[G.waveIdx++];if(!w)return;G.waveT=0;
  let px=0,py=0;

    const x=clamp(px+rand(-70,70),40,G.W-40),y=clamp(py+rand(-70,70),40,G.H-40);

function makeDoors(){
  let types;
  if(G.kind==='boss'){types=G.realm<NREALMS-1?['next']:[]}
  else if(G.room===ROOMS_PER_REALM-3)types=['shop','rest'];
  else if(G.room===ROOMS_PER_REALM-2)types=['boss'];
  else{
    const pool=['gold','gold','tome','tome','tome','heal','equip','equip'];
    if(!G.usedShop&&G.room>=1)pool.push('shop');
    if(!G.usedShrine&&G.room>=1)pool.push('shrine','shrine');
    if(P.hp<S.maxHp*0.5)pool.push('heal','heal');
    const n=Math.random()<0.45?3:2;types=[];
    shuffle(pool);for(const t of pool){if(!types.includes(t))types.push(t);if(types.length>=n)break}
  }
  const n=types.length;
  G.doors=types.map((t,i)=>({type:t,x:G.W*(i+1)/(n+1),y:0,open:0}));

function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}

function hurtEnemy(e,dmg,el,o={}){
  if(e.hidden)return;
  if(e.dead||(e.state==='fade'&&e.t<0.2)||e.state==='appear')return;
  let m=1;
  if(el&&e.res[el]!=null)m*=e.res[el];
  if(e.st.hex>0)m*=1.2;
  if(e.st.shock>0)m*=1.15;
  if(hasA(e,'armored'))m*=o.reaction?2:0.6;
  const immune=e.bulwark>0&&!o.reaction&&!o.dot;if(immune){m=0;if(Math.random()<0.3)text(e.x,e.y-e.r*1.8,'IMMUNE','#e2e8f0',11)}
  let crit=false;
  if(!o.noCrit&&!o.dot&&Math.random()<S.crit){crit=true;m*=S.critDmg}
  if(o.blocked)m*=0.2;
  const f=dmg*m;
  e.hp-=f;e.flash=0.08;G.stats.dmg+=f;
  if(f>=1||o.dot){
    const col=o.reaction?'#fff':o.blocked?'#9ca3af':el?EL[el].col:'#fff';
    const sz=o.reaction?22:crit?19:o.dot?12:14;
    text(e.x+rand(-10,10),e.y-e.r-6,(crit?'!':'')+R0(f),col,sz);
    if(el&&e.res[el]>1&&!o.dot&&Math.random()<0.25)text(e.x,e.y-e.r-26,'WEAK','#ffd166',11);
    else if(el&&e.res[el]<1&&!o.dot&&Math.random()<0.25)text(e.x,e.y-e.r-26,'RESIST','#9ca3af',11);
  }
  if(!o.dot)sfx('hit');
  if(e.hp<=0){killEnemy(e);return}
  if(el&&!o.reaction&&(o.apply??1)>0)applyElement(e,el,o.apply??1,dmg);
}
function applyElement(e,el,amt,hitDmg){
  const st=e.st;let r=null;
  if(G.time>=e.reactCd){
    if((el==='fire'&&st.chill>0)||(el==='frost'&&st.burn>0))r='shatter';
    else if((el==='fire'&&st.shock>0)||(el==='storm'&&st.burn>0))r='overload';
    else if((el==='frost'&&st.shock>0)||(el==='storm'&&st.chill>0))r='superconduct';
  }
  if(r){react(e,r,hitDmg);return}
  if(el==='fire'){st.burn=Math.min(S.burnMax,st.burn+amt);st.burnT=3.2}
  else if(el==='frost'){st.chill=Math.min(3,st.chill+amt);st.chillT=3.2;if(st.chill>=3&&!e.boss&&st.frozen<=0){st.frozen=S.freezeDur*(e.elite?0.6:1);text(e.x,e.y-e.r-20,'FROZEN','#d4f8ff',13)}}
  else if(el==='storm'){st.shock=3.2}
  else if(el==='arcane'){st.hex=4}
}
function react(e,r,hitDmg){
  const st=e.st;
  const hexed=st.hex>0;
  let base=(16*S.power+hitDmg*1.15)*S.react*(hexed?1.5:1);
  e.reactCd=G.time+0.3;G.stats.reactions++;
  if(r==='shatter'){
    const frozen=st.frozen>0;
    st.burn=0;st.burnT=0;st.chill=0;st.chillT=0;st.frozen=0;
    hurtEnemy(e,base*1.9*S.shatter*(frozen?1.5:1),null,{reaction:true});

    rtext(e,frozen?'SHATTER!!':'SHATTER','#9ff0ff');
  }else if(r==='overload'){
    st.burn=0;st.burnT=0;st.shock=0;
    const rad=90*S.olRad;
    G.fx.push({type:'ring',x:e.x,y:e.y,r:rad,life:0.4,max:0.4,col:'#ffb347',thick:8});
    burst(e.x,e.y,'#ffb347',26,rad*3);
    for(const o of G.enemies){if(o.dead)continue;if(d2(e.x,e.y,o.x,o.y)<(rad+o.r)**2){knock(o,Math.atan2(o.y-e.y,o.x-e.x),280);hurtEnemy(o,base*1.1,null,{reaction:true})}}
    rtext(e,'OVERLOAD','#ffb347');shake(6);sfx('boom');
  }else{
    st.chill=0;st.chillT=0;st.shock=0;
    if(!e.dead){e.st.stun=Math.max(e.st.stun,e.boss?0.25:0.8);hurtEnemy(e,base*0.7,null,{reaction:true})}
    const others=G.enemies.filter(o=>!o.dead&&o!==e&&d2(o.x,o.y,e.x,e.y)<260*260).sort((a,b)=>d2(a.x,a.y,e.x,e.y)-d2(b.x,b.y,e.x,e.y)).slice(0,S.scJumps);
    for(const o of others){G.fx.push({type:'bolt',x:e.x,y:e.y,ex:o.x,ey:o.y,life:0.3,max:0.3,col:'#a5f3fc'});o.st.stun=Math.max(o.st.stun,o.boss?0.25:0.8);hurtEnemy(o,base*0.8,null,{reaction:true})}
    rtext(e,'SUPERCONDUCT','#a5f3fc');
  }
  if(S.reactHeal)heal(S.reactHeal,true);
  if(S.catalyst)P.mana=Math.min(S.maxMana,P.mana+4);
  G.freeze=Math.max(G.freeze,0.04);sfx('react');
  if(!save.tut&&G.stats.reactions===1){G.hint={t:4,text:'Reaction! Mix two elements on one enemy for big damage.'}}
}

function burst(x,y,col,n,spd){n=Math.min(n,80);for(let i=0;i<n;i++){if(G.parts.length>700)G.parts.shift();const a=rand(0,TAU),s=rand(0.2,1)*spd*0.5;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.25,0.6),max:0.6,size:rand(2,4.5),col})}}

/* ---------- casting ---------- */
function aimInfo(){
  let enemy=null,x,y;
  if(MOUSE.active&&performance.now()-MOUSE.last<2500){
    const w=screenToWorld(MOUSE.x,MOUSE.y);x=w.x;y=w.y;enemy=nearestEnemy(x,y,140);
  }else{
    enemy=P.aimEnemy&&!P.aimEnemy.dead?P.aimEnemy:nearestEnemy(P.x,P.y,900);
    if(enemy){x=enemy.x;y=enemy.y}else{x=P.x+Math.cos(P.face)*220;y=P.y+Math.sin(P.face)*220}
  }
  return{x,y,enemy,ang:Math.atan2(y-P.y,x-P.x)};
}
function castSlot(i,auto){
  if(G.mode!=='play'||P.hp<=0)return;
  const s=P.spells[i];if(!s)return;
  const D=SPELLS[s.id];
  if(s.cd>0||P.mana<D.mana){if(!auto&&s.cd<=0)text(P.x,P.y-34,'NO MANA','#2ee6ff',12);return}
  const a=aimInfo();
  if(D.cast(s.l,a)===false){if(!auto)text(P.x,P.y-34,'NO TARGET','#b3a6e0',12);return}
  P.mana-=D.mana;s.cd=D.cd*(1-0.04*(s.l-1))*(1-S.cdr);
  P.face=a.ang;
  if(!['frostNova','flameRing','stormOrbs','arcaneBarrier'].includes(s.id))sfx(D.el);
  if(S.twincast&&Math.random()<S.twincast)P.twin.push({id:s.id,l:s.l,t:0.18});
  if(!save.tut&&G.tutStep===1){G.tutStep=2;G.hint={t:5,text:'Each spell has an element suit. Hit one foe with two different suits.'}}
}
function dash(){
  if(G.mode!=='play'||P.dashCharges<1||P.dashT>0||P.hp<=0)return;
  P.dashCharges--;P.dashT=0.17;
  let dx=INPUT.x,dy=INPUT.y;if(Math.hypot(dx,dy)<0.2){dx=Math.cos(P.face);dy=Math.sin(P.face)}
  const m=Math.hypot(dx,dy)||1;P.dashDir={x:dx/m,y:dy/m};sfx('dash');
  if(S.comet){const el=S.infuse||'arcane';blast(P.x,P.y,95,18*S.power,el,{apply:1})}
}

/* ---------- input ---------- */
const KEYS={};const INPUT={x:0,y:0};const MOUSE={x:0,y:0,active:false,last:0};let JOY=null;
addEventListener('keydown',e=>{
  if(e.repeat)return;KEYS[e.code]=true;
  if(G.mode==='prologue'){if(e.code==='Escape')endPrologue();else if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();proTap()}return}
  if(G.mode==='play'){
    if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'){dash();e.preventDefault()}
    const m={Digit1:0,Digit2:1,Digit3:2,Digit4:3,KeyJ:0,KeyK:1,KeyL:2,Semicolon:3};
    if(e.code in m)castSlot(m[e.code]);
    if(e.code==='Escape'||e.code==='KeyP')openPause();
  }else if(G.mode==='overlay'&&(e.code==='Escape')&&G.ovKind==='pause')resume();
});
addEventListener('keyup',e=>{KEYS[e.code]=false});
addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=false;JOY=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')openPause();if(AC){try{document.hidden?AC.suspend():AC.resume()}catch(e){}}});
cv.addEventListener('pointerdown',e=>{
  audioInit();
  if(e.pointerType==='mouse'){MOUSE.active=true;MOUSE.last=performance.now();MOUSE.x=e.clientX;MOUSE.y=e.clientY;return}
  if(G.mode!=='play')return;
  if(!JOY&&e.clientX<CW*0.62){JOY={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){MOUSE.x=e.clientX;MOUSE.y=e.clientY;MOUSE.active=true;MOUSE.last=performance.now();return}
  if(JOY&&e.pointerId===JOY.id){JOY.x=e.clientX;JOY.y=e.clientY;const dx=JOY.x-JOY.ox,dy=JOY.y-JOY.oy,d=Math.hypot(dx,dy),max=60;
    if(d>max){JOY.ox=JOY.x-dx/d*max;JOY.oy=JOY.y-dy/d*max}}
});
const endJoy=e=>{if(JOY&&e.pointerId===JOY.id)JOY=null};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')MOUSE.active=false});
for(let i=0;i<4;i++)document.getElementById('sp'+i).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();castSlot(i)});
document.getElementById('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();dash()});
pauseBtn.addEventListener('click',()=>{if(G.mode==='play')openPause()});
function readInput(){
  let x=0,y=0;
  if(KEYS.KeyA||KEYS.ArrowLeft)x-=1;if(KEYS.KeyD||KEYS.ArrowRight)x+=1;if(KEYS.KeyW||KEYS.ArrowUp)y-=1;if(KEYS.KeyS||KEYS.ArrowDown)y+=1;
  if(JOY){const dx=JOY.x-JOY.ox,dy=JOY.y-JOY.oy;const d=Math.hypot(dx,dy);if(d>6){x=dx/60;y=dy/60}}
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
  INPUT.x=x;INPUT.y=y;
}
function screenToWorld(sx,sy){return{x:(sx-CW/2)/SCALE+G.cam.x,y:(sy-CH/2)/SCALE+G.cam.y}}

/* ---------- update ---------- */
function update(dt){
  G.time+=dt;G.roomT+=dt;G.stats.time+=dt;
  readInput();
  if(G.hint){G.hint.t-=dt;if(G.hint.t<=0)G.hint=null}
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
  if(G.hurtFlash>0)G.hurtFlash-=dt;
  // tutorial progression
  if(!save.tut){
    if(G.tutStep===0&&G.roomT>4.5&&!G.hint){G.tutStep=1;G.hint={t:5,text:isTouch?'Tap a spell button (bottom right) to cast. DASH dodges.':'Cast spells with 1-4, dash with Space. Mouse aims if you move it.'}}
    if(G.tutStep===2&&G.stats.reactions>0){save.tut=true;persist()}
  }

  updatePlayer(dt);

  // spawning & waves
  if(G.kind==='combat'||G.kind==='elite'){
    G.waveT+=dt;
    const alive=G.enemies.filter(e=>!e.dead).length+G.spawnQ.length;
    if(G.waveIdx===0&&G.roomT>0.6)spawnWave();
    else if(G.waveIdx<G.waves.length&&(alive<=5||G.waveT>11))spawnWave();
    // a steady trickle of fodder while waves remain keeps the arena crowded
    if(!G.cleared&&G.waveIdx>0&&G.waveIdx<G.waves.length){G.trickT=(G.trickT??2)-dt;if(G.trickT<=0&&alive<42){G.trickT=rand(1.4,2.4);
      const cheap=RL().pool.filter(k=>ENEMIES[k].cost<=1.5);const edge=Math.random()<0.5;
      for(let k=0;k<2+Math.floor(G.realm/2);k++){const x=edge?(Math.random()<0.5?50:G.W-50):rand(60,G.W-60),y=edge?rand(60,G.H-60):(Math.random()<0.5?50:G.H-50);
        if(d2(x,y,P.x,P.y)>250*250)G.spawnQ.push({x:x+rand(-30,30),y:y+rand(-30,30),t:0.8,type:pick(cheap.length?cheap:RL().pool)})}}}
    if(!G.cleared&&G.waveIdx>=G.waves.length&&alive===0)roomCleared();
  }else if(G.kind==='boss'){
    if(G.bossIntro>0){G.bossIntro-=dt;if(G.bossIntro<=0)makeBoss(RL().boss)}
    else if(!G.cleared&&!G.boss&&G.enemies.every(e=>e.dead)&&G.slowmo<=0)roomCleared();
  }
  for(const s of G.spawnQ){s.t-=dt;if(s.t<=0){const e=makeEnemy(s.type,s.x,s.y,{elite:s.elite,parent:s.parent});if(s.parent)s.parent.minions++;s.done=true;burst(s.x,s.y,'#c084fc',10,200)}}
  G.spawnQ=G.spawnQ.filter(s=>!s.done);

  for(const e of G.enemies)if(!e.dead)updEnemy(e,dt);
  separate();
  updProjectiles(dt);
  updAreas(dt);
  updPickups(dt);

  // doors
  for(const d of G.doors){d.open=Math.min(1,d.open+dt*2);if(d.open>=1&&Math.abs(P.x-d.x)<52&&P.y<P.r+34)enterDoor(d)}

  // fx / particles / texts
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;p.life-=dt}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y+=t.vy*dt;t.vy*=0.94;t.life-=dt}
  G.texts=G.texts.filter(t=>t.life>0);
  for(const f of G.fx)f.life-=dt;
  G.fx=G.fx.filter(f=>f.life>0);
  G.enemies=G.enemies.filter(e=>!e.dead);

  // camera
  const vw=CW/SCALE,vh=CH/SCALE,m=70;
  let tx=P.x,ty=P.y-vh*0.05;
  tx=vw>=G.W+2*m?G.W/2:clamp(tx,vw/2-m,G.W-vw/2+m);
  ty=vh>=G.H+2*m?G.H/2:clamp(ty,vh/2-m-40,G.H-vh/2+m);
  G.cam.x+=(tx-G.cam.x)*Math.min(1,dt*8);G.cam.y+=(ty-G.cam.y)*Math.min(1,dt*8);
  G.shake=Math.max(0,G.shake-dt*40);

  if(G.pendingLevel>0&&G.mode==='play'&&!G.dying){G.pendingLevel--;sfx('level');openLevel('Level '+(P.lvl-G.pendingLevel),'Choose one',false)}
  if(G.roomUi&&G.roomT>0.45&&!G.fadeDir&&G.mode==='play'){G.roomUi=false;if(G.kind==='shop')openShop();else if(G.kind==='shrine')openShrine();else openRest()}
  if(G.pendingAfter&&G.mode==='play'){const f=G.pendingAfter;G.pendingAfter=null;f()}
}
function updatePlayer(dt){
  if(P.hp<=0)return;
  P.iframe=Math.max(0,P.iframe-dt);P.glacierCd-=dt;
  // dash
  if(P.dashCharges<S.dashCharges){P.dashRe+=dt;if(P.dashRe>=S.dashCd){P.dashRe=0;P.dashCharges++}}else P.dashRe=0;
  let sp=S.move*(P.slowT>0?0.6:1);P.slowT=Math.max(0,P.slowT-dt);
  if(P.dashT>0){P.dashT-=dt;P.vx=P.dashDir.x*900;P.vy=P.dashDir.y*900;if(Math.random()<0.8)G.parts.push({x:P.x,y:P.y,vx:0,vy:0,life:0.25,max:0.25,size:9,col:'rgba(139,61,255,.6)'})}
  else{P.vx+=(INPUT.x*sp-P.vx)*Math.min(1,dt*14);P.vy+=(INPUT.y*sp-P.vy)*Math.min(1,dt*14)}
  P.x+=(P.vx+P.kx)*dt;P.y+=(P.vy+P.ky)*dt;P.kx*=Math.pow(0.02,dt);P.ky*=Math.pow(0.02,dt);
  P.x=clamp(P.x,P.r,G.W-P.r);P.y=clamp(P.y,P.r,G.H-P.r);
  for(const p of G.pillars)pushOut(P,p);
  if(Math.hypot(INPUT.x,INPUT.y)>0.2)P.moveFace=Math.atan2(INPUT.y,INPUT.x);
  // mana
  P.mana=Math.min(S.maxMana,P.mana+S.regen*dt);
  if(G.refillMana){P.mana=S.maxMana;G.refillMana=false}
  for(const s of P.spells)s.cd=Math.max(0,s.cd-dt);
  for(const t of P.twin){t.t-=dt;if(t.t<=0){t.done=true;SPELLS[t.id].cast(t.l,aimInfo());text(P.x,P.y-40,'TWIN','#ffc94a',12)}}
  P.twin=P.twin.filter(t=>!t.done);
  // auto-target (sticky)
  const near=nearestEnemy(P.x,P.y,560);
  if(!P.aimEnemy||P.aimEnemy.dead||d2(P.x,P.y,P.aimEnemy.x,P.aimEnemy.y)>620*620||(near&&d2(P.x,P.y,near.x,near.y)<0.45*d2(P.x,P.y,P.aimEnemy.x,P.aimEnemy.y)))P.aimEnemy=near;
  const tgt=P.aimEnemy;
  if(tgt)P.face=Math.atan2(tgt.y-P.y,tgt.x-P.x);else if(P.moveFace!==undefined)P.face=P.moveFace;
  // cards
  P.cardT-=dt;
  if(tgt&&P.cardT<=0){
    P.cardT=1/(2.3*S.atkSpd);P.cardCount++;
    const a=Math.atan2(tgt.y-P.y,tgt.x-P.x);
    const fan=S.fullDeck&&P.cardCount%5===0?5:1;
    for(let i=0;i<fan;i++){
      const off=fan>1?(i/(fan-1)-0.5)*0.7:0;
      const inf=S.infuse&&Math.random()<S.infuseChance;
      shoot({ang:a+off,spd:680,r:7,dmg:9*S.power,el:inf?S.infuse:null,life:0.85,kind:'card',suit:S.infuse,apply:1});
    }
    sfx('card');
  }
  // autocast
  if(save.autocast&&tgt){for(let i=0;i<P.spells.length;i++){const s=P.spells[i];const D=SPELLS[s.id];
    if(s.cd<=0&&P.mana>=D.mana){if((s.id==='frostNova'||s.id==='flameRing'||s.id==='arcaneBarrier')&&d2(P.x,P.y,tgt.x,tgt.y)>170*170)continue;castSlot(i,true);break}}}
  // shield
  if(P.shieldT>0){P.shieldT-=dt;if(P.shieldT<=0)barrierBurst()}
  // orbs
  if(P.orbs){const o=P.orbs;o.t-=dt;o.ang+=dt*4;
    for(let i=0;i<o.n;i++){const a=o.ang+i*TAU/o.n;const ox=P.x+Math.cos(a)*78,oy=P.y+Math.sin(a)*78;
      for(const e of G.enemies){if(e.dead)continue;if(d2(ox,oy,e.x,e.y)<(14+e.r)**2){const last=o.hit.get(e)||0;if(G.time-last>0.35){o.hit.set(e,G.time);hurtEnemy(e,o.dmg,'storm',{apply:1})}}}}
    if(o.t<=0)P.orbs=null}
}
function pushOut(a,p){const dx=a.x-p.x,dy=a.y-p.y,d=Math.hypot(dx,dy)||1,m=a.r+p.r;if(d<m){a.x=p.x+dx/d*m;a.y=p.y+dy/d*m;return true}return false}
function separate(){
  const E=G.enemies;
  for(let i=0;i<E.length;i++){const a=E[i];if(a.dead)continue;
    for(let j=i+1;j<E.length;j++){const b=E[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
      const d=Math.hypot(dx,dy)||0.01;if(d<m){const o=(m-d)/2,ux=dx/d,uy=dy/d;const wa=a.boss?0.1:1,wb=b.boss?0.1:1;a.x-=ux*o*wa;a.y-=uy*o*wa;b.x+=ux*o*wb;b.y+=uy*o*wb}}}
}
function updEnemy(e,dt){
  const st=e.st;
  if(st.burnT>0){st.burnT-=dt;st.tick-=dt;if(st.tick<=0){st.tick=0.5;hurtEnemy(e,st.burn*2.4*S.power*S.burnMult*(1+0.25*G.realm),'fire',{dot:true,noCrit:true,apply:0});if(e.dead)return}if(st.burnT<=0)st.burn=0;
    if(Math.random()<0.25)G.parts.push({x:e.x+rand(-e.r,e.r)*0.6,y:e.y-rand(0,e.r),vx:0,vy:-60,life:0.4,max:0.4,size:3,col:'#ff9a3d'})}
  if(st.chillT>0){st.chillT-=dt;if(st.chillT<=0)st.chill=0}
  st.frozen=Math.max(0,st.frozen-dt);st.shock=Math.max(0,st.shock-dt);st.hex=Math.max(0,st.hex-dt);st.stun=Math.max(0,st.stun-dt);
  e.flash=Math.max(0,e.flash-dt);
  const disabled=st.frozen>0||st.stun>0;
  const slow=e.boss?1-Math.min(0.3,0.1*st.chill):1-0.15*Math.min(3,st.chill);
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  let mx=0,my=0,spd=e.spd*slow;
  if(!disabled){
    e.cd-=dt*(hasA(e,'swift')?1.3:1)*(1+0.09*G.realm);
    if(e.ai==='boss')bossAI(e,dt,ux,uy,d);
    else switch(e.ai){
      case'chase':mx=ux;my=uy;e.face=Math.atan2(uy,ux);break;
      case'ghost':{e.face=Math.atan2(uy,ux);
        if(e.state==='fade'){e.t-=dt;if(e.t<=0){const a=rand(0,TAU);e.x=clamp(P.x+Math.cos(a)*150,e.r,G.W-e.r);e.y=clamp(P.y+Math.sin(a)*150,e.r,G.H-e.r);e.state='appear';e.t=0.55}break}
        if(e.state==='appear'){e.t-=dt;if(e.t<=0){e.state='move';e.cd=rand(4,6)}break}
        mx=ux;my=uy;if(e.cd<=0&&d>200){e.state='fade';e.t=0.45}
        break}
      case'shield':{mx=ux;my=uy;const ta=Math.atan2(uy,ux);let df=((ta-e.face+Math.PI*3)%TAU)-Math.PI;e.face+=clamp(df,-1.9*dt,1.9*dt);break}
      case'ranged':case'sniper':{
        e.face=Math.atan2(uy,ux);
        if(e.state==='wind'){e.t-=dt;if(e.t<=0){e.state='move';e.cd=rand(1.8,2.6);
          if(e.ai==='sniper')for(let i=-1;i<=1;i++)eshoot(e.x,e.y,e.face+i*0.22,240,e.dmg,7,'#7fe3ff');
          else eshoot(e.x,e.y,e.face,280,e.dmg,7,'#c5f26a')}
          break}
        if(d>330){mx=ux;my=uy}else if(d<230){mx=-ux;my=-uy}else{mx=-uy*e.side;my=ux*e.side;spd*=0.6}
        if(e.cd<=0&&d<540){e.state='wind';e.t=e.ai==='sniper'?0.75:0.55}
        break}
      case'charger':{
        if(e.state==='wind'){e.t-=dt;if(e.t<=0){e.state='dash';e.t=0.45}break}
        if(e.state==='dash'){e.t-=dt;mx=Math.cos(e.face);my=Math.sin(e.face);spd=620;if(e.t<=0){e.state='rest';e.t=0.6}break}
        if(e.state==='rest'){e.t-=dt;if(e.t<=0){e.state='move';e.cd=rand(2,3)}break}
        mx=ux;my=uy;e.face=Math.atan2(uy,ux);
        if(e.cd<=0&&d<340){e.state='wind';e.t=0.7;e.face=Math.atan2(uy,ux)}
        break}
      case'bomber':{
        if(e.state==='fuse'){e.t-=dt;mx=ux;my=uy;spd*=0.25;if(e.t<=0){
          e.dead=false;addArea({x:e.x,y:e.y,r:85,delay:0,dmg:e.dmg,from:'e',kind:'boom',col:e.col,friendly:30});killEnemy(e);G.stats.kills--;sfx('boom');shake(6)}break}
        mx=ux;my=uy;e.face=Math.atan2(uy,ux);
        if(d<e.r+P.r+46){e.state='fuse';e.t=0.85}
        break}
      case'summoner':{
        e.face=Math.atan2(uy,ux);
        if(e.state==='cast'){e.t-=dt;if(e.t<=0){e.state='move';e.cd=rand(4.5,6);
          const q=G.spawnQ.filter(s=>s.parent===e).length;
          for(let i=0;i<2&&e.minions+q+i<4;i++){const a=rand(0,TAU);G.spawnQ.push({x:clamp(e.x+Math.cos(a)*50,40,G.W-40),y:clamp(e.y+Math.sin(a)*50,40,G.H-40),t:0.5,type:e.T.minion||'thrall',parent:e})}}
          break}
        if(d<300){mx=-ux;my=-uy}else if(d>420){mx=ux;my=uy}else{mx=-uy*e.side;my=ux*e.side;spd*=0.5}
        if(e.cd<=0){e.state='cast';e.t=0.9}
        break}
    }
    if(e.aff&&e.ai!=='boss'){const ov=eliteTick(e,dt,d);
      if(ov){mx=ov.mx;my=ov.my;spd=ov.spd}
      else{if(e.rage)spd*=e.rage;e.jinkT-=dt;if(e.jinkT<=0){e.jinkT=rand(0.4,1.1);e.jink=(Math.random()<0.5?-1:1)*rand(0.4,1)}
        if(mx||my){const nx=mx-my*e.jink,ny=my+mx*e.jink,m=Math.hypot(nx,ny)||1;mx=nx/m;my=ny/m}}}
  }
  if(e.ai!=='boss'||!disabled){e.x+=(mx*spd+e.kx)*dt;e.y+=(my*spd+e.ky)*dt}

function updProjectiles(dt){
  for(const p of G.projs){
    if(p.delay>0){p.delay-=dt;p.x=P.x;p.y=P.y;continue}
    if(p.homing){const t=nearestEnemy(p.x,p.y,600);if(t){const want=Math.atan2(t.y-p.y,t.x-p.x),cur=Math.atan2(p.vy,p.vx);let df=((want-cur+Math.PI*3)%TAU)-Math.PI;const na=cur+clamp(df,-7*dt,7*dt);p.vx=Math.cos(na)*p.spd;p.vy=Math.sin(na)*p.spd;p.spd=Math.min(700,p.spd+500*dt)}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*18;
    if(p.x<0||p.y<0||p.x>G.W||p.y>G.H){p.life=0;if(p.onHit)p.onHit(p)}
    for(const pl of G.pillars)if(d2(p.x,p.y,pl.x,pl.y)<(pl.r+p.r)**2){p.life=0;if(p.onHit)p.onHit(p);burst(p.x,p.y,'#ffffff',4,120)}
    if(p.life<=0)continue;
    for(const e of G.enemies){
      if(e.dead||p.hit.has(e))continue;
      if(d2(p.x,p.y,e.x,e.y)<(p.r+e.r)**2){
        p.hit.add(e);
        let blocked=false;
        if(e.ai==='shield'&&e.st.frozen<=0&&e.st.stun<=0){const a=Math.atan2(p.y-e.y,p.x-e.x);let df=Math.abs(((a-e.face+Math.PI*3)%TAU)-Math.PI);if(df<1.05)blocked=true}
        hurtEnemy(e,p.dmg,p.el,{apply:p.el?p.apply:0,blocked});
        if(blocked&&Math.random()<0.4)text(e.x,e.y-e.r-24,'BLOCKED','#9ca3af',11);
        if(p.kind==='card')P.mana=Math.min(S.maxMana,P.mana+1.2);
        if(p.onHit){p.onHit(p);p.life=0;break}
        if(p.pierce>0&&!blocked)p.pierce--;else{p.life=0;break}
      }
    }
  }
  G.projs=G.projs.filter(p=>p.life>0);
  for(const b of G.eprojs){
    if(b.homing){const want=Math.atan2(P.y-b.y,P.x-b.x),cur=Math.atan2(b.vy,b.vx);const df=((want-cur+Math.PI*3)%TAU)-Math.PI;const na=cur+clamp(df,-b.homing*dt,b.homing*dt);b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.x<-20||b.y<-20||b.x>G.W+20||b.y>G.H+20)b.life=0;
    for(const pl of G.pillars)if(d2(b.x,b.y,pl.x,pl.y)<(pl.r+b.r)**2)b.life=0;
    if(b.life>0&&d2(b.x,b.y,P.x,P.y)<(b.r+P.r-3)**2){if(P.iframe<=0&&P.dashT<=0){hitP(b.dmg,b.chill);b.life=0}}
  }
  G.eprojs=G.eprojs.filter(b=>b.life>0);
}

function bakeFloor(){
  const R=RL(),st=R.st,W=G.W,H=G.H;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const rgb=(k,al)=>`rgba(${clamp(st[0]+k,0,255)|0},${clamp(st[1]+k,0,255)|0},${clamp(st[2]+k,0,255)|0},${al})`;
  x.fillStyle=rgb(0,1);x.fillRect(0,0,W,H);
  // layered value noise, upscaled with smoothing, gives soft natural ground with no tile edges
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  for(const [cell,amp,al] of [[180,24,0.9],[70,13,0.55],[26,7,0.35]]){
    const nw=Math.ceil(W/cell)+3,nh=Math.ceil(H/cell)+3,n=document.createElement('canvas');n.width=nw;n.height=nh;const nx=n.getContext('2d'),id=nx.createImageData(nw,nh);
    for(let i=0;i<nw*nh;i++){const v=(Math.random()*2-1)*amp;id.data[i*4]=clamp(st[0]+v,0,255);id.data[i*4+1]=clamp(st[1]+v,0,255);id.data[i*4+2]=clamp(st[2]+v,0,255);id.data[i*4+3]=255}
    nx.putImageData(id,0,0);x.globalAlpha=al;x.drawImage(n,-cell,-cell,nw*cell,nh*cell)}
  x.globalAlpha=1;
  for(let i=0;i<24;i++){const px=rand(0,W),py=rand(0,H),r=rand(90,260),k=rand(-20,20);const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,rgb(k,0.4));g.addColorStop(1,rgb(k,0));x.fillStyle=g;x.fillRect(px-r,py-r,2*r,2*r)}

}

    <div class="box"><h3>Reading enemies</h3><p class="sub" style="text-align:left;font-size:14px">The small suit at an enemy's shoulder is its <b>weakness</b>. Shield-bearers block shots from the front: flank them or use area spells. Red zones and lines are attacks about to land. Armored elites take double damage from reactions.</p></div>
    <div class="box"><h3>The run</h3><p class="sub" style="text-align:left;font-size:14px">5 realms, 9 rooms each, on a route that changes every run. Enemies grow tougher with every room. After each fight, choose a door: the symbol is the reward. Elite doors drop gear for your Grimoire, Robe, Hat, Gloves and Cape. Stardust from every run unlocks new spells, never raw power.</p></div>
  </div><div class="row"><button class="btn primary" data-a="${G.mode==='menu'?'back':'pause'}" data-focus>Got it</button></div></div>`,'howto');
};
/* sanctum */
ACT.sanctum=()=>{
  const sp=Object.keys(SPELL_UNLOCK).map(id=>{const D=SPELLS[id],E=EL[D.el],has=save.unlocked.includes(id),cost=SPELL_UNLOCK[id];
    return `<div class="li"><div class="l"><b><span style="color:${E.col}">${E.suit}</span> ${D.name}</b><i>${E.name} spell</i></div>${has?'<span class="tag" style="color:var(--cyan)">Unlocked</span>':`<button class="btn" data-a="buySpell" data-v="${id}" ${save.dust<cost?'disabled':''}>✦ ${cost}</button>`}</div>`}).join('');
  const tl=Object.entries(TALENTS).map(([id,T])=>{const r=save.talents[id]||0;const cost=T.cost[r];
    return `<div class="li"><div class="l"><b>${T.n} <span style="color:var(--muted);font-weight:400">${r}/${T.max}</span></b><i>${T.d}</i></div>${r>=T.max?'<span class="tag" style="color:var(--cyan)">Max</span>':`<button class="btn" data-a="buyTal" data-v="${id}" ${save.dust<cost?'disabled':''}>✦ ${cost}</button>`}</div>`}).join('');
  showOv(`<div class="panel"><h2><small>✦ ${save.dust} Stardust</small>The Sanctum</h2>
    <p class="sub">Every run earns Stardust, win or lose. Spells add variety to your pool; talents are small and capped, so skill still decides runs.</p>
    <div class="grid2"><div class="box"><h3>Spellbook</h3>${sp}</div><div class="box"><h3>Talents</h3>${tl}</div>
    <div class="box"><h3>Realm Atlas · ${(save.seen||[]).length}/${Object.keys(REALM_DEFS).length} found</h3>${[0,1,2].map(t=>`<div class="li"><div class="l"><b>${['Outer','Middle','Final'][t]} realms</b><i>${TIERS[t].map(k=>(save.seen||[]).includes(k)?REALM_DEFS[k].name:'???').join(' · ')}</i></div></div>`).join('')}<p class="sub" style="text-align:left;font-size:13px">Every run takes a different route: one realm from each tier, never the same as your last run.</p></div></div>
    <div class="row"><button class="btn primary" data-a="back" data-focus>Done</button></div></div>`,'sanctum');
};
ACT.buySpell=id=>{const c=SPELL_UNLOCK[id];if(save.dust>=c&&!save.unlocked.includes(id)){save.dust-=c;save.unlocked.push(id);persist();sfx('level')}ACT.sanctum()};
ACT.buyTal=id=>{const r=save.talents[id]||0,c=TALENTS[id].cost[r];if(r<TALENTS[id].max&&save.dust>=c){save.dust-=c;save.talents[id]=r+1;persist();sfx('level')}ACT.sanctum()};

/* level up / tome */
function levelOptions(spellOnly){
  const opts=[];
  for(const s of P.spells)if(s.l<5)opts.push({t:'up',id:s.id,w:3});
  if(P.spells.length<4)for(const id of save.unlocked)if(!P.spells.find(s=>s.id===id))opts.push({t:'new',id,w:P.spells.length<2?5:2.5});
  if(!spellOnly)for(const [id,D] of Object.entries(PASSIVES))if((P.passives[id]||0)<D.max)opts.push({t:'pas',id,w:1.6});
  const out=[];
  while(out.length<3&&opts.length){let tot=opts.reduce((a,o)=>a+o.w,0),r=Math.random()*tot;let i=0;for(;i<opts.length;i++){r-=opts[i].w;if(r<=0)break}i=Math.min(i,opts.length-1);out.push(opts.splice(i,1)[0])}
  if(!out.length)out.push({t:'gold'});
  return out;
}
function openLevel(title,sub,spellOnly){
  G.choices=levelOptions(spellOnly);G.choiceSpellOnly=spellOnly;
  const html=G.choices.map((o,i)=>{
    if(o.t==='up'){const s=P.spells.find(s=>s.id===o.id);return spellCard(o.id,s.l+1,'Level '+s.l+' → '+(s.l+1),'choose',i,s.l+1===5?'Mastery':'')}
    if(o.t==='new')return spellCard(o.id,1,'New spell','choose',i,'New');
    if(o.t==='gold')return `<button class="card" data-a="choose" data-v="${i}"><span class="suit" style="color:var(--gold)">¤</span><span class="nm">Pocket Change</span><span class="ds">Gain <b>40</b> gold.</span></button>`;
    const D=PASSIVES[o.id],n=P.passives[o.id]||0;
    return `<button class="card" data-a="choose" data-v="${i}"><span class="suit" style="color:var(--gold)">✧</span><span class="nm">${D.name}</span><span class="tag">Passive · ${n}/${D.max}</span><span class="ds">${D.d}</span></button>`;
  }).join('');
  showOv(`<div class="panel"><h2><small>${sub}</small>${title}</h2><div class="cards">${html}</div>
    <div class="row"><button class="btn" data-a="reroll" ${P.rerolls<1?'disabled':''}>Reroll (${P.rerolls})</button></div></div>`,'level');
}
ACT.choose=v=>{
  const o=G.choices[+v];if(!o)return;
  if(o.t==='up'){const s=P.spells.find(s=>s.id===o.id);s.l++}
  else if(o.t==='new'){P.spells.push({id:o.id,l:1,cd:0})}
  else if(o.t==='pas'){P.passives[o.id]=(P.passives[o.id]||0)+1;recompute();const D=PASSIVES[o.id];if(D.on)D.on()}
  else if(o.t==='gold')gainGold(40);
  recompute();sfx('level');closeOverlay();buildPad();
  if(G.afterChoice){const f=G.afterChoice;G.afterChoice=null;f()}
};
ACT.reroll=()=>{if(P.rerolls<1)return;P.rerolls--;const t=ov.querySelector('h2').lastChild.textContent,s=ov.querySelector('h2 small').textContent;openLevel(t,s,G.choiceSpellOnly)};

/* equipment */
function itemHtml(it){
  const R=RAR[it.rar];
  const st=Object.entries(it.stats).map(([k,v])=>`${STAT[k].l} <b>${STAT[k].f(v)}</b>`).join('<br>');
  return `<span class="suit" style="color:${R.ink}"><i>${RANK[it.rar]}</i>${it.el?EL[it.el].suit:'♦'+TS}</span><span class="tag" style="color:${R.ink}">${R.n} ${SLOT_NAME[it.slot]}${it.el?` · <span style="color:${EL[it.el].ink}">${EL[it.el].suit} ${EL[it.el].name} cards</span>`:''}</span>
    <span class="nm" style="color:${R.ink}">${it.name}</span><span class="ds">${st}${it.legD?`<br><span style="color:var(--gold)">${it.legD}</span>`:''}</span>`;
}
function openEquip(items,title){
  G.choices=items;
  const html=items.map((it,i)=>{const cur=P.equip[it.slot];
    return `<button class="card" data-a="equip" data-v="${i}" style="--cdash:${RAR[it.rar].ink}">${itemHtml(it)}
      <span class="cmp">Replaces: ${cur?`<span style="color:${RAR[cur.rar].ink}">${cur.name}</span> (${Object.entries(cur.stats).map(([k,v])=>STAT[k].l+' '+STAT[k].f(v)).join(', ')}${cur.el?', '+EL[cur.el].name+' cards':''})`:'empty slot'}</span></button>`}).join('');
  showOv(`<div class="panel"><h2><small>Choose one item</small>${title}</h2><div class="cards">${html}</div>
    <div class="row"><button class="btn ghost" data-a="skipEquip">Skip (+25 gold)</button></div></div>`,'equip');
}
ACT.equip=v=>{const it=G.choices[+v];P.equip[it.slot]=it;recompute();sfx('level');closeOverlay();buildPad();if(G.afterChoice){const f=G.afterChoice;G.afterChoice=null;f()}};
ACT.skipEquip=()=>{gainGold(25);closeOverlay();if(G.afterChoice){const f=G.afterChoice;G.afterChoice=null;f()}};

/* shop */
function openShop(){
  const m=1+0.2*G.realm;
  if(!G.shopStock){G.shopStock=[
    {k:'item',it:genItem(null,1),p:R0(70*m)},{k:'item',it:genItem(null,2),p:R0(125*m)},{k:'item',it:genItem(null,rollRar(1)),p:0},
    {k:'tome',p:R0(65*m)},{k:'potion',p:R0(35*m)},{k:'reroll',p:R0(30*m)}];
    const s=G.shopStock[2];s.p=R0([50,70,125,200][s.it.rar]*m)}
  const html=G.shopStock.map((s,i)=>{
    const dis=s.sold||P.gold<s.p?'disabled':'';
    let body;
    if(s.k==='item')body=itemHtml(s.it);
    else if(s.k==='tome')body=`<span class="suit" style="color:var(--arcane)">✦</span><span class="nm">Spell Tome</span><span class="ds">Choose a new spell or a spell upgrade.</span>`;
    else if(s.k==='potion')body=`<span class="suit" style="color:var(--rose)">♥${TS}</span><span class="nm">Elixir</span><span class="ds">Restore <b>40%</b> HP.</span>`;
    else body=`<span class="suit" style="color:var(--cyan)">↻</span><span class="nm">Reroll Token</span><span class="ds">+1 level-up reroll.</span>`;
    return `<button class="card" data-a="buy" data-v="${i}" ${dis} ${s.k==='item'?`style="--cdash:${RAR[s.it.rar].ink}"`:''}>${body}<span class="price">${s.sold?'SOLD':'¤ '+s.p}</span></button>`}).join('');
  showOv(`<div class="panel"><h2><small>You have ¤ ${P.gold}</small>Curio Shop</h2><div class="cards">${html}</div>
    <div class="row"><button class="btn primary" data-a="leave" data-focus>Leave shop</button></div></div>`,'shop');
}
ACT.buy=v=>{const s=G.shopStock[+v];if(!s||s.sold||P.gold<s.p)return;P.gold-=s.p;s.sold=true;sfx('coin');
  if(s.k==='item'){P.equip[s.it.slot]=s.it;recompute();buildPad()}
  else if(s.k==='potion')heal(S.maxHp*0.4);
  else if(s.k==='reroll')P.rerolls++;
  else if(s.k==='tome'){G.afterChoice=openShop;openLevel('Spell Tome','Choose a spell or upgrade',true);return}
  openShop()};
ACT.leave=()=>{G.shopStock=null;closeOverlay();makeDoors()};
/* shrine */
function openShrine(){
  G.choices=shuffle(SHRINES.slice()).slice(0,3);
  const html=G.choices.map((s,i)=>`<button class="card" data-a="shrine" data-v="${i}"><span class="suit" style="color:var(--cyan)">✧</span><span class="nm">${s.n}</span><span class="ds">${s.d}</span></button>`).join('');
  showOv(`<div class="panel"><h2><small>Make an offering, or walk away</small>Shrine of Whispers</h2><div class="cards">${html}</div>
    <div class="row"><button class="btn ghost" data-a="leave">Walk away</button></div></div>`,'shrine');
}
ACT.shrine=v=>{const s=G.choices[+v];s.f();recompute();sfx('level');closeOverlay();makeDoors()};
/* rest */
function openRest(){
  showOv(`<div class="panel narrow"><h2><small>A quiet place before the boss</small>Sanctuary</h2>
    <div class="cards">
      <button class="card" data-a="rest" data-v="heal"><span class="suit" style="color:var(--rose)">♥${TS}</span><span class="nm">Rest</span><span class="ds">Heal <b>45%</b> of max HP (${R0(S.maxHp*0.45)}).</span></button>
      <button class="card" data-a="rest" data-v="study"><span class="suit" style="color:var(--arcane)">✦</span><span class="nm">Study</span><span class="ds">Upgrade or learn a spell.</span></button>
    </div></div>`,'rest');
}
ACT.rest=v=>{if(v==='heal'){heal(S.maxHp*0.45);closeOverlay();makeDoors()}else{G.afterChoice=makeDoors;openLevel('Study','Choose a spell or upgrade',true)}};

/* pause */
function openPause(){
  if(G.mode==='menu'||!P)return;
  if(G.mode!=='play'&&!['howto','pause'].includes(G.ovKind))return;
  JOY=null;
  const sp=P.spells.map(s=>{const D=SPELLS[s.id],E=EL[D.el];return `<div class="li"><div class="l"><b><span style="color:${E.col}">${E.suit}</span> ${D.name} <span style="color:var(--muted);font-weight:400">Lv ${s.l}</span></b><i>${D.info(s.l).replace(/<[^>]+>/g,'')}</i></div></div>`}).join('');
  const eq=SLOTS.map(sl=>{const it=P.equip[sl];return `<div class="li"><div class="l"><b style="color:${it?RAR[it.rar].c:'var(--muted)'}">${it?it.name:'Empty'}</b><i>${SLOT_NAME[sl]}${it?' · '+Object.entries(it.stats).map(([k,v])=>STAT[k].l+' '+STAT[k].f(v)).join(', ')+(it.el?' · '+EL[it.el].name+' cards':'')+(it.legD?' · '+it.legD:''):''}</i></div></div>`}).join('');
  const pas=Object.entries(P.passives).map(([id,n])=>`${PASSIVES[id].name} ×${n}`).join(', ')||'None yet';
  showOv(`<div class="panel"><h2><small>${RL().name} · Room ${G.room+1}/${ROOMS_PER_REALM}</small>Paused</h2>
   <div class="grid2">
    <div class="box"><h3>Spells</h3>${sp}<h3 style="margin-top:6px">Passives</h3><p class="sub" style="text-align:left;font-size:14px">${pas}</p></div>
    <div class="box"><h3>Equipment</h3>${eq}</div>
    <div class="box"><h3>Stats</h3><div class="kv">
      <span>Max HP</span><span>${R0(S.maxHp)}</span><span>Spell power</span><span>${pct(S.power)}</span><span>Cooldowns</span><span>-${pct(S.cdr)}</span>
      <span>Crit chance</span><span>${pct(S.crit)}</span><span>Armor</span><span>${pct(S.armor)}</span><span>Reaction dmg</span><span>${pct(S.react)}</span>
      <span>Mana</span><span>${R0(S.maxMana)} (+${S.regen.toFixed(1)}/s)</span><span>Reactions this run</span><span>${G.stats.reactions}</span></div></div>
    <div class="box"><h3>Settings</h3>
      <div class="toggle"><span>Auto-cast spells</span><button class="btn" data-a="autocast">${save.autocast?'On':'Off'}</button></div>
      <div class="toggle"><span>Music</span><button class="btn" data-a="musicT">${save.music===false?'Off':'On'}</button></div>
      <div class="toggle"><span>Sound effects</span><button class="btn" data-a="mute">${save.muted?'Off':'On'}</button></div>
      <div class="toggle"><span>Guide</span><button class="btn" data-a="howto">How to play</button></div>
      <div class="toggle"><span>End this run</span><button class="btn" data-a="abandon">Abandon</button></div></div>
   </div><div class="row"><button class="btn primary" data-a="resume" data-focus>Resume</button></div></div>`,'pause');
}
ACT.pause=()=>openPause();
ACT.resume=()=>resume();
function resume(){closeOverlay()}
ACT.autocast=()=>{save.autocast=!save.autocast;persist();openPause()};
ACT.abandon=(v,b)=>{if(b.dataset.sure){endRun(false)}else{b.dataset.sure='1';b.textContent='Tap again to confirm'}};

/* end */
function endRun(win){
  playMusic(win?'victory':'defeat');
  const s=G.stats;
  let dust=s.rooms*2+s.elites*5+s.bosses*20+(win?40:0);
  dust=R0(dust*(1+0.25*G.arcana));
  save.dust+=dust;
  const shards=s.bosses+(win?2+G.arcana:0);save.shards=(save.shards||0)+shards;
  hostEmit('runEnd',{win,realm:G.realm+1,room:G.room+1,level:P.lvl,kills:s.kills,reactions:s.reactions,bosses:s.bosses,time:Math.round(s.time),stardust:dust,moonShards:shards});
  if(win){save.wins++;save.arcWin=Math.max(save.arcWin||0,G.arcana);if(G.arcana>=save.arcanaMax&&save.arcanaMax<5)save.arcanaMax++}
  persist();
  G.mode='overlay';syncPad();
  const m=Math.floor(s.time/60),sec=Math.floor(s.time%60);
  showOv(`<div class="panel narrow"><div class="title"><h1 class="logo sm"><img src="assets/magicion-logo.webp" alt="Magicion" width="706" height="720"></h1></div><h2><small>${win?'The darkness breaks':'The curtain falls'}</small>${win?'Victory!':'Run Over'}</h2>
    <p class="sub">${win?`You defeated ${BOSSES[RL().boss].name}${G.arcana?' on Arcana '+G.arcana:''}.${save.arcanaMax>G.arcana?' Arcana '+save.arcanaMax+' is now unlocked.':''}`:`Fell in ${RL().name}, room ${G.room+1}.`}</p>
    <div class="box"><div class="kv">
      <span>Time</span><span>${m}:${String(sec).padStart(2,'0')}</span><span>Rooms cleared</span><span>${s.rooms}</span><span>Enemies defeated</span><span>${s.kills}</span>
      <span>Reactions</span><span>${s.reactions}</span><span>Elites / Bosses</span><span>${s.elites} / ${s.bosses}</span><span>Level reached</span><span>${P.lvl}</span>
      <span>Stardust earned</span><span>✦ ${dust}</span><span>Moon Shards earned</span><span>☽ ${shards}</span></div></div>
    <div class="row"><button class="btn primary" data-a="back" data-focus>Continue</button></div></div>`,'end');
}

/* ---------- pad ---------- */
function buildPad(){
  for(let i=0;i<4;i++){const b=document.getElementById('sp'+i);const s=P&&P.spells[i];
    b.classList.toggle('empty',!s);
    b.querySelector('.g').textContent=s?EL[SPELLS[s.id].el].suit:'';
    b.style.color=s?EL[SPELLS[s.id].el].col:'';
    b.querySelector('.lv').textContent=s?'Lv'+s.l:'';
    b.setAttribute('aria-label',s?SPELLS[s.id].name:'Empty spell slot');}
}
function updPad(){
  if(pad.hidden||!P)return;
  for(let i=0;i<P.spells.length;i++){const s=P.spells[i],D=SPELLS[s.id],b=document.getElementById('sp'+i);
    const full=D.cd*(1-0.04*(s.l-1))*(1-S.cdr);b.style.setProperty('--cd',(s.cd/full).toFixed(3));b.classList.toggle('nomana',P.mana<D.mana)}
  const db=document.getElementById('dashBtn');
  db.style.setProperty('--cd',P.dashCharges>=1?0:(1-P.dashRe/S.dashCd).toFixed(3));
  db.querySelector('.chg').textContent=S.dashCharges>1?P.dashCharges+'/'+S.dashCharges:'';
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  let dt=Math.min(1/30,(now-last)/1000);last=now;
  if(G.mode==='play'){
    if(G.freeze>0){G.freeze-=dt;dt=0}
    if(G.slowmo>0){G.slowmo-=dt;dt*=0.3}
    if(G.fadeDir){G.fade+=G.fadeDir*dt*4;if(G.fadeDir>0&&G.fade>=1){G.fade=1;G.fadeDir=-1;if(G.onFade){const f=G.onFade;G.onFade=null;f()}}else if(G.fadeDir<0&&G.fade<=0){G.fade=0;G.fadeDir=0}}
    if(dt>0)update(dt);
    if(G.dying>0){G.dying-=Math.min(1/30,(now-last)/1000)||1/60;if(G.dying<=0.01||G.slowmo<=0){G.dying=0;endRun(false)}}
    updPad();
  }
  draw();
  requestAnimationFrame(frame);
}
/* ---------- host page integration: iframe postMessage API ---------- */
const EMBEDDED=window.parent!==window;
function hostEmit(type,data){if(!EMBEDDED)return;try{parent.postMessage(Object.assign({source:'magicion',type},data||{}),'*')}catch(e){}}
addEventListener('message',ev=>{const d=ev.data;if(!d||d.target!=='magicion')return;
  switch(d.cmd){
    case'pause':if(G.mode==='play')openPause();break;
    case'resume':if(G.ovKind==='pause')resume();break;
    case'mute':save.muted=true;save.music=false;persist();break;
    case'unmute':save.muted=false;save.music=true;persist();audioInit();break;
    case'music':save.music=!!d.value;persist();break;
    case'sfx':save.muted=!d.value;persist();break;
  }
});
function start(){if(!save.seenPrologue)startPrologue(true);else titleScreen();requestAnimationFrame(t=>{last=t;frame(t)});hostEmit('ready',{version:'1.0'})}
const boot=()=>{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{}).catch(()=>{});start()};
boot();
</script>
